        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The options a browser needs to create a passkey (REQ-AUTH-002).
  /api/v1/auth/mfa/passkeys/challenge:
    post:
      description: |-
        The options a browser needs to prove a passkey (REQ-AUTH-002).

        Serves both moments a passkey is proved: the second half of a login, where the account comes
        from the pending login the password left behind, and a re-confirmation, where it comes from the
        session. Hence no session requirement and no user id in the request — the one thing a caller
        may not do is say whose passkeys it wants the options for.
      operationId: passkeyChallenge
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyView'
          description: the options, as JSON, for `navigator.credentials.get()`
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The options a browser needs to prove a passkey (REQ-AUTH-002)
  /api/v1/auth/mfa/passkeys/confirmation:
    post:
      description: Finishes registering a passkey.
      operationId: confirmPasskey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationRequest'
        description: what the browser produced, and what to call this authenticator
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
