        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TenantMembershipView'
                type: array
          description: the memberships, each with the tenant's name and the role held in it
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
