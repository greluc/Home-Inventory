                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
