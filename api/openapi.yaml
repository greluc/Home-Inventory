  /api/v1/me/tenants:
    get:
      description: |-
        Every tenant the caller belongs to, oldest membership first.

        Read through the lookup that works without a tenant context, because the caller is asking
        which tenant to have and therefore cannot be required to already have one.

        There is no cursor, and there does not need to be one: a tenant limit is capped at 200
        (`AppUser.MAX_TENANT_LIMIT`), which is REQ-NFR-010's page size, so one page holds every
        membership anybody can have. The `limit` exists so that a client asking for fewer gets
        fewer, and so that the bound is visible in the contract rather than only in a constraint.
