      description: |-
        Everything that runs out, soonest first (REQ-LIFE-013).

        Warranty ends, licence expiries and best-before dates in one list. The first is a column on
        the item; the other two are type attributes whose field is marked `expiry`, which is what
        lets a tenant's own date join the list without this endpoint knowing its name.

        Dates that have already gone are included **by default**: a warranty that ran out last
        month is the one somebody most wants to know about, and an overview that quietly dropped it
        would forget its own point.
