          type: string
      type: object
    ItemView:
      description: |-
        What other blocks and the REST layer are allowed to see of an item.

        This is the published type of the `inventory` block (REQ-NFR-023). The entity stays
        inside: handed out, it carries its persistence context with it, so a caller could modify the
        aggregate without passing the use case that guards its invariants — and would do so by accident,
        because a getter returning a managed entity looks exactly like one returning data.

        A record, so it is immutable without anyone having to remember to make it so.
      properties:
        attributes:
          description: |-
            the fields the item's type version declares, as JSON text. The source of
            truth for every attribute (ADR-0004); what a key means is the catalog's business, and a
            client reads the type version's schema to render it
          type: string
        createdAt:
          description: when it was created
          format: date-time
          type: string
        description:
          description: free text, may be `null`
          type: string
        id:
          description: the item's UUIDv7
          format: uuid
          type: string
        kind:
          description: '`PHYSICAL` or `DIGITAL`, as a string so consumers need no enum of ours'
          type: string
        lifecycleState:
          description: where the item is in its life; stage 0 always `ACTIVE`
          type: string
        locationId:
          description: where it is; `null` for a digital item
          format: uuid
          type: string
        minimumStock:
          description: the level below which this consumable needs restocking, or `null`
          type: number
        name:
          description: the name
          type: string
        notes:
          description: the paragraph a person wrote, in limited Markdown with the HTML already removed
          type: string
        quantity:
          description: how many
          type: number
        quantityUnit:
          description: the unit, may be `null`
          type: string
        updatedAt:
          description: when it last changed
          format: date-time
          type: string
        version:
          description: |-
            the optimistic lock, which a client echoes back on update to detect a concurrent
            edit rather than overwriting one
          format: int64
          type: integer
      type: object
    LocationCategoryPage:
      description: One page of categories.
      properties:
        items:
          description: the categories on this page
          items:
            $ref: '#/components/schemas/LocationCategoryView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    LocationCategoryView:
      description: |-
        A kind of place a location can be: a room, a shelf, a box.

        ## Why the key and not a label

        The categories of stage 0 are shipped, not configured — twelve fixed keys, the same for every
        tenant. Their names are *interface text*, so they belong in the client's resource bundle
        with everything else a user reads, and REQ-NFR-032 forbids display text anywhere else. A label
        returned from here would be one the server would have to translate, in a language the server does
        not know the user prefers.

        That changed at stage 1, and the labels are here now. A category nobody shipped has no key in
        any bundle, so it has to carry its own name; a shipped one may have been renamed by its tenant
        (REQ-CORE-042, "all present and editable"), and that name has to win over the translation.

        So the rule for a client is one sentence: **use the label for the reader's language when
        there is one, and translate the key when there is not.** Nothing here is display text the
        server invented — every label in this map was typed by somebody in the tenant, which is what
        keeps REQ-NFR-032 true.
      properties:
        icon:
          description: an icon name for the client, or `null`
          type: string
        id:
          description: the category, which is what a location references
          format: uuid
          type: string
        key:
          description: |-
            the shipped key — `room`, `shelf`, `box` — which a client translates
            when the tenant has given the category no name of its own
          type: string
        labels:
          additionalProperties:
            type: string
          description: the tenant's own name per language tag, empty when it has none
          type: object
        mobile:
          description: |-
            whether locations of this category travel with their contents. Every shipped one is
            stationary; the flag marks the relocation case a client offers, not a restriction on moving
          type: boolean
      type: object
    LocationPage:
      description: One page of locations.
      properties:
        items:
          description: the locations on this page
          items:
            $ref: '#/components/schemas/LocationView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    LocationView:
      description: |-
        What other blocks and the REST layer see of a location.

        `ancestors` is the readable form of the materialised path: the names from the root down
        to this location, assembled from the rows the path names. The path itself is made of ids and is
        deliberately not published - it is an index structure, and publishing it would invite a client to
        parse it.
      properties:
        ancestors:
          description: the names from the root down to and including this location (REQ-CORE-044)
          items:
            type: string
          type: array
        attributes:
          description: the fields the category version declares, as JSON text (REQ-CORE-041)
          type: string
        categoryId:
          description: the category
          format: uuid
          type: string
        depth:
          description: distance from the root
          format: int32
          type: integer
        id:
          description: the location
          format: uuid
          type: string
        name:
          description: the name
          type: string
        parentId:
          description: the parent, or `null` for a root
          format: uuid
          type: string
      type: object
    LoginRequest:
      description: The login body.
      properties:
        email:
          description: the address
          maxLength: 320
          minLength: 0
          type: string
        password:
          description: |-
            the password. Length-bounded, because Argon2id spends 19 MiB per attempt and an
            unbounded field is an invitation to spend it on a megabyte of nothing
          maxLength: 200
          minLength: 0
          type: string
      required:
      - email
      - password
      type: object
    MediaPage:
      description: One page of attachments.
      properties:
        items:
          description: the attachments on this page
          items:
            $ref: '#/components/schemas/MediaView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    MediaView:
      description: |-
        What a client learns about a stored file.

        Deliberately no bytes and no unsigned path. `urls` carries signed, short-lived links per
        variant and nothing else (REQ-MED-010); a field with a raw path would be a field that bypasses the
        signature, the expiry and the dedicated hostname at once.

        When the scan has not finished, `urls` is empty rather than absent. A client showing a
        placeholder needs to know the upload exists and is not yet retrievable, which is a different state
        from "no such file" (REQ-MED-013).
      properties:
        byteSize:
          description: the size of the original
          format: int64
          type: integer
        heightPx:
          description: the height for an image, or `null`
          format: int32
          type: integer
        id:
          description: the media object
          format: uuid
          type: string
        mediaType:
          description: the detected type, never the declared one
          type: string
        primaryImage:
          description: |-
            whether this is the image lists show for the thing it hangs on
            (REQ-MED-002). Carried per attachment rather than implied by position, because the list is
            paged and the primary is not guaranteed to be on the page a client is looking at
          type: boolean
        scanState:
          description: where the scan stands; only `CLEAN` yields URLs
          type: string
        urls:
          additionalProperties:
            type: string
          description: variant name to signed URL, empty until the scan says clean
          type: object
        widthPx:
          description: the width for an image, or `null`
          format: int32
          type: integer
      type: object
    MemberPage:
      description: One page of members.
      properties:
        items:
          description: the members
          items:
            $ref: '#/components/schemas/MemberView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    MemberView:
      description: A member of the tenant.
      properties:
        displayName:
          description: what the interface calls them
          type: string
        email:
          description: the address they sign in with
          type: string
        joinedAt:
          description: when the membership was written
          format: date-time
          type: string
        role:
          description: the built-in role they hold here
          type: string
        roleDefinitionId:
          description: the tenant-owned role extending it (REQ-TEN-006), or null
          format: uuid
          type: string
        roleName:
          description: |-
            what to call the role: the tenant-owned role's name where there is one,
            otherwise the built-in name. A member list shows this rather than making a client join
          type: string
        scopeLocationId:
          description: |-
            the part of the tree they are confined to (REQ-TEN-007), or null for the
            whole tenant
          format: uuid
          type: string
        userId:
          description: the account
          format: uuid
          type: string
      type: object
    MoveLocationRequest:
      description: Where a location is to be moved.
      properties:
        parentId:
          description: |-
            the new parent, or null to make it a root. A client that means "out of
            everything" says so with null rather than with an absent field, and both are read the same
            way
          format: uuid
          type: string
      type: object
    OpenSession:
      description: One open session, as its owner sees it.
      properties:
        current:
          description: |-
            whether this is the session making the request, which a client shows differently
            and should not offer to end by accident
          type: boolean
        device:
          description: |-
            what the client called itself, shortened. A user agent and nothing more: it is
            what distinguishes "my phone" from "the machine at work" for somebody deciding which to end
          type: string
        handle:
          description: what to call it when ending it — never the session id itself
          type: string
        lastSeenAt:
          description: when it last made a request
          format: date-time
          type: string
        origin:
          description: |-
            where it signed in from, with the host part of the address removed —
            `203.0.113.0/24` rather than the address itself (`REQ-PRIV-006`). Enough to tell a
            familiar network from a strange one, not enough to be a location history
          type: string
        signedInAt:
          description: when the session was established
          format: date-time
          type: string
      type: object
    OperatorPage:
      description: One page of operators.
      properties:
        items:
          description: the accounts
          items:
            $ref: '#/components/schemas/AccountView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    PasskeyRegistrationRequest:
      description: What finishes a passkey registration.
      properties:
        credential:
          description: what `navigator.credentials.create()` produced, as JSON
          maxLength: 20000
          minLength: 0
          type: string
        label:
          description: what to call this authenticator, or null
          maxLength: 100
          minLength: 0
          type: string
      required:
      - credential
      type: object
    PasskeyView:
      description: One registered passkey.
      properties:
        id:
          description: the credential, for removing it
          format: uuid
          type: string
        label:
          description: what the person called it
          type: string
        lastUsedAt:
          description: when it was last used, or null
          format: date-time
          type: string
        registeredAt:
          description: when it was registered
          format: date-time
          type: string
      type: object
    Problem:
      additionalProperties: true
      description: 'An error, as RFC 9457 describes one. A client branches on `type` and never on `detail`:
        the URI is stable and documented under `api/problems/`, the prose is not and is translated (REQ-API-003).'
      properties:
        detail:
          description: What happened this time, in a sentence. Not stable; do not branch on it.
          type: string
        instance:
          description: The path of the request that failed.
          format: uri
          type: string
        status:
          description: The HTTP status, repeated in the body.
          format: int32
        title:
          description: The condition stable, human-readable name.
          type: string
        traceId:
          description: The identifier of this request in the server log. Quoting it in a report leads
            straight to the operation (REQ-NFR-042).
          type: string
        type:
          description: What went wrong, as an identifier. One of the tokens in `docs/reference/problem-types.yaml`,
            under `https://home-inv.example/problems/`. Fixed for the product rather than derived from
            a deployment hostname, so a client recognises it from every instance.
          format: uri
          type: string
      required:
      - status
      - title
      - type
    QuotaRequest:
      description: The body of a quota change.
      properties:
        permitted:
          description: |-
            how much the tenant may use. Zero is legal and means "none for now"; there is
            no way to say "unlimited", because an unbounded quota is not a quota
          format: int64
          minimum: 0
          type: integer
      type: object
    QuotaState:
      description: Where a tenant stands in one quota.
      properties:
        permitted:
          description: how much is allowed
          format: int64
          type: integer
        used:
          description: how much is in use now
          format: int64
          type: integer
      type: object
    RecoveryCodesView:
      description: The recovery codes, readable this once.
      properties:
        codes:
          description: ten single-use codes
          items:
            type: string
          type: array
      type: object
    RelationPage:
      description: One page of relations.
      properties:
        items:
          description: the relations on this page
          items:
            $ref: '#/components/schemas/RelationView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    RelationRequest:
      description: The body of a relation.
      properties:
        targetId:
          description: the item this one points at
          format: uuid
          type: string
        type:
          description: '`ACCESSORY_OF`, `PART_OF`, `REPLACEMENT_FOR` or `RELATED`'
          maxLength: 20
          minLength: 0
          type: string
      required:
      - targetId
      - type
      type: object
    RelationView:
      description: One relation, as the item at either end sees it.
      properties:
        id:
          description: the relation
          format: uuid
          type: string
        inbound:
          description: |-
            whether the item that was asked is the TARGET rather than the source. A client
            renders "accessories" for one and "accessory of" for the other, from the same row
          type: boolean
        sourceId:
          description: the item the relation is stated from
          format: uuid
          type: string
        targetId:
          description: the item it points at
          format: uuid
          type: string
        type:
          description: what kind of relation
          enum:
          - ACCESSORY_OF
          - PART_OF
          - REPLACEMENT_FOR
          - RELATED
          type: string
      type: object
    RenameLocationRequest:
      description: The body of a rename.
      properties:
        name:
          description: the new name
          maxLength: 300
          minLength: 0
          type: string
      required:
      - name
      type: object
    RevisionPage:
      description: One page of history.
      properties:
        items:
          description: the revisions on this page, newest first
          items:
            $ref: '#/components/schemas/RevisionView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    RevisionView:
      description: One entry of a history.
      properties:
        changedAt:
          description: when
          format: date-time
          type: string
        changedBy:
          description: who, or `null` where a system process made the change
          format: uuid
          type: string
        kind:
          description: what happened
          enum:
          - CREATED
          - UPDATED
          - TRASHED
          - RESTORED
          - PURGED
          type: string
        revision:
          description: this entry's number in the entity's history, counting from one
          format: int64
          type: integer
        snapshot:
          description: the state it produced, as JSON text
          type: string
      type: object
    RevokedView:
      description: The tenant that is answering again.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        state:
          description: its state, which is `ACTIVE` by the time this is returned
          type: string
      type: object
    RolePage:
      description: One page of roles.
      properties:
        items:
          description: the definitions
          items:
            $ref: '#/components/schemas/RoleView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    RoleReference:
      description: A role a rule is about.
      properties:
        role:
          description: the built-in role's name, or null
          type: string
        roleDefinitionId:
          description: the tenant-owned role, or null
          format: uuid
          type: string
      type: object
    RoleRequest:
      description: The body of a role change.
      properties:
        role:
          description: |-
            one of `OWNER`, `ADMIN`, `MEMBER`, `CONTRIBUTOR`,
            `VIEWER`, `GUEST`. A name this build does not know grants nothing and is
            refused
          maxLength: 32
          minLength: 0
          type: string
        roleDefinitionId:
          description: |-
            a tenant-owned role extending it (REQ-TEN-006), or omitted for a plain
            built-in role. Where it is given it decides the base, and `role` is ignored
          format: uuid
          type: string
        scopeLocationId:
          description: |-
            a location to confine them to (REQ-TEN-007), or omitted for the whole
            tenant
          format: uuid
          type: string
      required:
      - role
      type: object
    RoleView:
      description: A tenant-owned role.
      properties:
        baseRole:
          description: the built-in role it extends
          type: string
        description:
          description: what it is for, or null
          type: string
        effectivePermissions:
          description: |-
            everything it holds, base included — so a client can show what a
            role means without re-implementing the ladder
          items:
            type: string
          type: array
        id:
          description: the definition
          format: uuid
          type: string
        name:
          description: what the tenant calls it
          type: string
        permissions:
          description: the ids it adds
          items:
            type: string
          type: array
      type: object
    SearchResult:
      description: What was found.
      properties:
        items:
          description: the matching items
          items:
            $ref: '#/components/schemas/ItemView'
          type: array
        nextCursor:
          description: the cursor for the following page, or `null` when this was the last
          type: string
      type: object
    SecondFactorRequest:
      description: |-
        The body of a second-factor answer: a code, or a passkey assertion.

        Exactly one of the two. One body for both because the question is the same one — "prove the
        second factor" — and a client that had to choose an endpoint would be a client that has to know
        which kinds this account has before it asks.
      properties:
        code:
          description: |-
            the six digits from the authenticator app, or one of the recovery codes, or null
            when a passkey is answering. Bounded because it reaches an Argon2id comparison, where an
            unbounded field is an invitation to spend 19 MiB on a megabyte of nothing
          maxLength: 64
          minLength: 0
          type: string
        credential:
          description: |-
            what `navigator.credentials.get()` produced, as JSON, or null when a
            code is answering. Bounded generously: an assertion carries a signature, client data and
            the authenticator's own bytes
          maxLength: 20000
          minLength: 0
          type: string
        passkey:
          description: Whether a passkey is answering.
          type: boolean
      type: object
    ServiceAccountRequest:
      description: What a new service account needs.
      properties:
        description:
          description: what it is for, or null
          maxLength: 1000
          minLength: 0
          type: string
        expiresAt:
          description: |-
            when it stops working. Required — REQ-AUTH-010 asks for an expiry date, and a
            machine credential nobody reviews is one nobody revokes
          format: date-time
          type: string
        name:
          description: what to call it, so a list of tokens is a list somebody can act on
          maxLength: 200
          minLength: 0
          type: string
        role:
          description: the built-in role it holds, one of the six names
          maxLength: 20
          minLength: 0
          type: string
        roleDefinitionId:
          description: a tenant-owned role extending it (REQ-TEN-006), or null
          format: uuid
          type: string
      required:
      - expiresAt
      - name
      - role
      type: object
    ServiceAccountView:
      description: A service account as its tenant sees it.
      properties:
        description:
          description: what it is for, or null
          type: string
        expiresAt:
          description: when it stops working
          format: date-time
          type: string
        id:
          description: the account
          format: uuid
          type: string
        lastUsedAt:
          description: when it last authenticated, or null when it never has
          format: date-time
          type: string
        name:
          description: what it is called
          type: string
        role:
          description: the built-in role it holds
          type: string
        roleDefinitionId:
          description: the tenant-owned role extending it, or null
          format: uuid
          type: string
      type: object
    SessionView:
      description: |-
        Who the caller is after the switch.

        The same shape `GET /api/v1/auth/me` answers with, so a client has one type for "the
        session" however it changed.
      properties:
        email:
          description: the address they signed in with
          type: string
        locale:
          description: their interface language
          type: string
        role:
          description: the role they hold in the new tenant
          type: string
        tenantId:
          description: the tenant this session now acts for
          format: uuid
          type: string
        userId:
          description: the person
          format: uuid
          type: string
      type: object
    SwitchTenantRequest:
      description: The body of a switch.
      properties:
        tenantId:
          description: |-
            the tenant to act for. Must be one the caller is a member of; anything else is
            answered as though it did not exist
          format: uuid
          type: string
      required:
      - tenantId
      type: object
    TagGroupPage:
      description: One page of tag groups.
      properties:
        items:
          description: the groups on this page
          items:
            $ref: '#/components/schemas/TagGroupView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    TagGroupRequest:
      description: The body of a group creation.
      properties:
        displayOrder:
          description: where the group sits among the others
          format: int32
          type: integer
        exclusive:
          description: whether a thing may carry only one tag of this group
          type: boolean
        key:
          description: the stable key
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the group's name per language tag
          type: object
      required:
      - key
      type: object
    TagGroupView:
      description: A group of tags — "condition", "room", "owner" (REQ-CORE-061).
      properties:
        displayOrder:
          description: where the group sits among the others on a form
          format: int32
          type: integer
        exclusive:
          description: |-
            whether a thing may carry only one tag of this group. "Condition" is one of new,
            used or broken; a thing that was both would be a thing whose condition nobody can read
          type: boolean
        id:
          description: the group
          format: uuid
          type: string
        key:
          description: the stable key, which is what an import or an export names
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the group's name per language tag, as the tenant wrote it. Multilingual data rather
            than interface text: the server cannot translate a word a tenant invented (REQ-NFR-032)
          type: object
      type: object
    TagPage:
      description: One page of tags.
      properties:
        items:
          description: the tags on this page
          items:
            $ref: '#/components/schemas/TagView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    TagRequest:
      description: The body of a tag creation or change.
      properties:
        colour:
          description: '`#rrggbb`, or omitted'
          maxLength: 7
          minLength: 0
          type: string
        groupId:
          description: the group it belongs to, or omitted
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        name:
          description: the name a person reads and types
          maxLength: 120
          minLength: 0
          type: string
      required:
      - name
      type: object
    TagView:
      description: A tag as everything outside this block sees it.
      properties:
        colour:
          description: '`#rrggbb`, or `null` when the tenant chose none (REQ-CORE-062)'
          type: string
        groupId:
          description: the group it belongs to, or `null`
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or `null`
          type: string
        id:
          description: the tag
          format: uuid
          type: string
        mergedInto:
          description: |-
            what this tag became, or `null` while it is itself. A tag with a value
            here is a tombstone: it is offered nowhere, carries nothing, and exists so a client holding
            its id is redirected rather than told the tag never existed (REQ-CORE-063)
          format: uuid
          type: string
        name:
          description: the name a person reads, unique per tenant among the live ones
          type: string
      type: object
    TenantMembershipView:
      description: One of the caller's memberships.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name, which is what a switcher shows
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    TenantStateView:
      description: A tenant's state.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        state:
          description: '`ACTIVE`, `SUSPENDED` or `PENDING_DELETION`'
          type: string
      type: object
    TenantView:
      description: A tenant as its member sees it.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    TotpEnrolmentView:
      description: A secret that has just been generated.
      properties:
        provisioningUri:
          description: the `otpauth://` URI a QR code carries
          type: string
        secret:
          description: the shared secret in base32, for somebody typing it in by hand
          type: string
      type: object
    UpdateCategoryRequest:
      description: |-
        What to change about a location category.

        Replaced whole, every field of it: a partial body would make removing a translation
        impossible, since there is no spelling for "drop this language" in a merge.
      properties:
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the name per language tag; omitted or empty leaves it nameless and a client falls
            back to translating the key
          type: object
        mobile:
          description: whether its places travel with their contents
          type: boolean
      type: object
    UpdateItemRequest:
      description: 'The body of an update. `kind` is absent: a physical item does not become a digital
        one.'
      properties:
        attributes:
          description: |-
            the new attribute set as a JSON object, checked against the version the item
            was written against rather than against whatever the type says today
          maxLength: 65536
          minLength: 0
          type: string
        description:
          description: the new description
          maxLength: 20000
          minLength: 0
          type: string
        locationId:
          description: the new location; required while the item is physical
          format: uuid
          type: string
        minimumStock:
          description: the new restocking level, or omitted to stop tracking one
          minimum: 0
          type: number
        name:
          description: the new name
          maxLength: 500
          minLength: 0
          type: string
        notes:
          description: the new notes; HTML is removed before they are stored
          maxLength: 20000
          minLength: 0
          type: string
        quantity:
          description: the new quantity; `null` means one
          minimum: 0
          type: number
        quantityUnit:
          description: the new unit
          maxLength: 30
          minLength: 0
          type: string
      required:
      - name
      type: object
    UpdateItemTypeRequest:
      description: What to change about an item type.
      properties:
        icon:
          description: an icon name for clients, or omitted to remove the one it has
          maxLength: 64
          minLength: 0
          type: string
      type: object
    ValueListEntryView:
      description: One permitted value.
      properties:
        archived:
          description: whether it is still offered for new input
          type: boolean
        displayOrder:
          description: its position
          format: int32
          type: integer
        id:
          description: the entry
          format: uuid
          type: string
        labels:
          additionalProperties:
            type: string
          description: its readable form per language tag
          type: object
        value:
          description: what is stored in an item's attributes
          type: string
      type: object
    ValueListPage:
      description: One page of value lists.
      properties:
        items:
          description: the lists on this page, each with its entries
          items:
            $ref: '#/components/schemas/ValueListView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    ValueListView:
      description: A value list with its entries.
      properties:
        entries:
          description: its entries in display order, archived ones included
          items:
            $ref: '#/components/schemas/ValueListEntryView'
          type: array
        id:
          description: the list
          format: uuid
          type: string
        key:
          description: its stable key
          type: string
        labels:
          additionalProperties:
            type: string
          description: its name per language tag
          type: object
      type: object
    VersionView:
      description: One version and the fields it declares.
      properties:
        fields:
          description: every field, in display order, inherited ones included once published
          items:
            $ref: '#/components/schemas/FieldDefinitionView'
          type: array
        id:
          description: the version
          format: uuid
          type: string
        ownerId:
          description: the item type or location category it belongs to
          format: uuid
          type: string
        published:
          description: whether it is frozen and referenceable
          type: boolean
        versionNumber:
          description: its position in that owner's series, starting at one
          format: int32
          type: integer
      type: object
    VisibilityRequest:
      description: The one condition that decides whether a client shows a field.
      properties:
        field:
          description: the key of the field watched
          maxLength: 64
          minLength: 0
          type: string
        operator:
          description: '`equals`, `notEquals`, `present` or `absent`'
          maxLength: 16
          minLength: 0
          type: string
        value:
          description: the JSON text compared against, for the two operators that compare
          maxLength: 256
          minLength: 0
          type: string
      required:
      - field
      - operator
      type: object
    VisibilityRule:
      description: |-
        When a field is shown: one condition, over one other field of the same item (REQ-CORE-028).

        ## Why it is this small

        ADR-0020 permits "a simple condition over another field of the same item" and gives the example
        that decides the shape: show `warrantyUntil` when `hasWarranty` is true. It permits no
        conjunction, no nesting and no reference to a second item — because each of those is a step toward
        an expression language that would have to evaluate identically in Java, TypeScript and Kotlin, and
        the line against that is the core of that decision.

        A rule is presentation only. A hidden field is not cleared, not exempted from `required`
        and not removed from the generated schema: hiding a value is not the same as not having one, and a
        schema that changed shape with the data would be a schema a client could not cache.
      properties:
        field:
          description: |-
            the key of the field this one watches, which must be another field of the same type
            version — a rule pointing at itself is a refused definition
          type: string
        operator:
          description: how the watched value is compared
          enum:
          - EQUALS
          - NOT_EQUALS
          - PRESENT
          - ABSENT
          type: string
        value:
          description: |-
            what it is compared against, as the JSON text of a scalar (`true`, `3`,
            `"new"`). Ignored by {@link Operator#PRESENT Operator#PRESENT} and {@link Operator#ABSENT Operator#ABSENT}
          type: string
      type: object
info:
  contact:
    email: lucas.greuloch@gmail.com
    name: Lucas Greuloch (greluc)
    url: https://github.com/greluc/Home-Inventory
  description: |-
    The HTTP surface of a self-hosted Home Inventory instance.

    This document is generated from the implementation and committed (ADR-0049); it describes what the code does rather than what it was meant to do. Errors follow RFC 9457 on every endpoint, and a client branches on the `type` URI, which is registered in `docs/reference/problem-types.yaml` and documented under `api/problems/` (REQ-API-003).

    Paths are versioned. Within a major version a field may be added and an optional one may appear, and nothing a client already reads changes meaning (REQ-API-008).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: Home Inventory API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: |-
        Verifies credentials and establishes a session.

        Any session that existed before the login is invalidated and a new one created. That is what
        prevents session fixation: an id an attacker planted beforehand is never the id the
        authenticated session ends up with.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: the credentials
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: who the caller now is
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor required (`second-factor-required`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Rate limited (`rate-limited`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Verifies credentials and establishes a session
  /api/v1/auth/logout:
    post:
      description: |-
        Ends the session.

        Always `204`, whether or not there was a session. A client cleaning up after itself
        should not have to care, and the answer says nothing about whether the caller was logged in.
      operationId: logout
      responses:
        '204':
          description: No Content
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Ends the session
  /api/v1/auth/me:
    get:
      description: Who the caller is.
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: the session view
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Who the caller is.
  /api/v1/auth/mfa:
    post:
      description: |-
        Answers the second factor and finishes the login (REQ-AUTH-002).

        The pending login is consumed whether or not the code is right: a wrong one costs the
        password again. An attacker holding a stolen cookie therefore gets one guess per password,
        rather than as many as they like against a session that keeps waiting.
      operationId: completeLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
        description: the code, which may be a TOTP code or a recovery code
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: who the caller now is
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Answers the second factor and finishes the login (REQ-AUTH-002)
  /api/v1/auth/mfa/enrolment:
    get:
      description: |-
        What the caller's account holds.

        /**
        What the caller's account holds.
      operationId: enrolment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentView'
          description: the enrolment
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: What the caller's account holds.
  /api/v1/auth/mfa/passkeys:
    post:
      description: The options a browser needs to create a passkey (REQ-AUTH-002).
      operationId: beginPasskey
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyView'
          description: the options, as JSON, for `navigator.credentials.create()`
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The options a browser needs to create a passkey (REQ-AUTH-002).
  /api/v1/auth/mfa/passkeys/challenge:
    post:
      description: |-
        The options a browser needs to prove a passkey (REQ-AUTH-002).

        Serves both moments a passkey is proved: the second half of a login, where the account comes
        from the pending login the password left behind, and a re-confirmation, where it comes from the
        session. Hence no session requirement and no user id in the request — the one thing a caller
        may not do is say whose passkeys it wants the options for.
      operationId: passkeyChallenge
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyView'
          description: the options, as JSON, for `navigator.credentials.get()`
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The options a browser needs to prove a passkey (REQ-AUTH-002)
  /api/v1/auth/mfa/passkeys/confirmation:
    post:
      description: Finishes registering a passkey.
      operationId: confirmPasskey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationRequest'
        description: what the browser produced, and what to call this authenticator
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Finishes registering a passkey.
  /api/v1/auth/mfa/passkeys/{passkeyId}/removal:
    post:
      description: |-
        Removes one passkey.

        Asks for the second factor to have been proved recently (REQ-AUTH-011) rather than for a
        code in the body, which is how the TOTP removal beside it works: an account whose only factor
        is a passkey has no code to type, and the re-confirmation takes either kind.
      operationId: removePasskey
      parameters:
      - description: which one
        in: path
        name: passkeyId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Second factor stale (`second-factor-stale`)
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found (`not-found`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Removes one passkey
  /api/v1/auth/mfa/recovery-codes:
    post:
      description: Issues a fresh set of recovery codes, retiring whatever is left of the old one.
      operationId: reissueRecoveryCodes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesView'
          description: the new codes, in clear, for the only time they are readable
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Issues a fresh set of recovery codes, retiring whatever is left of the old one.
  /api/v1/auth/mfa/step-up:
    post:
      description: |-
        Proves the second factor again, for an operation that asks (REQ-AUTH-011).

        The same code the login takes, against a session that already exists. What it changes is one
        instant in that session: for the next fifteen minutes the operations of 12 §12.4 are permitted
        and sensitive fields are shown.
      operationId: stepUp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
        description: the code
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Proves the second factor again, for an operation that asks (REQ-AUTH-011)
  /api/v1/auth/mfa/totp:
    post:
      description: |-
        Begins a TOTP enrolment.

        The secret is returned **once**, here, and is unreadable afterwards: it is sealed under
        the instance's credential key before it is stored. A client that loses it asks again, which
        replaces the unconfirmed enrolment.
      operationId: beginTotp
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolmentView'
          description: the secret and the `otpauth://` URI a QR code carries
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Second factor enrolled (`second-factor-enrolled`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Begins a TOTP enrolment
  /api/v1/auth/mfa/totp/confirmation:
    post:
      description: |-
        Confirms an enrolment with a code, and issues the recovery codes.

        The codes are returned **once**, here. They are stored as Argon2id hashes, so nothing —
        this application included — can show them again.
      operationId: confirmTotp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
        description: the code from the authenticator app
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesView'
          description: the recovery codes, in clear, for the only time they are readable
        '400':
          content:
            application/problem+json:
              schema:
