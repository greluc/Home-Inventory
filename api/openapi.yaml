          type: string
        lifecycleState:
          description: where the item is in its life; stage 0 always `ACTIVE`
          type: string
        locationId:
          description: where it is; `null` for a digital item
          format: uuid
          type: string
        minimumStock:
          description: the level below which this consumable needs restocking, or `null`
          type: number
        name:
          description: the name
          type: string
        notes:
          description: the paragraph a person wrote, in limited Markdown with the HTML already removed
          type: string
        quantity:
          description: how many
          type: number
        quantityUnit:
          description: the unit, may be `null`
          type: string
        updatedAt:
          description: when it last changed
          format: date-time
          type: string
        version:
          description: |-
            the optimistic lock, which a client echoes back on update to detect a concurrent
            edit rather than overwriting one
          format: int64
          type: integer
      type: object
