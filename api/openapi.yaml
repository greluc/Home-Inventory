          type: string
      type: object
    MediaView:
      description: |-
        What a client learns about a stored file.

        Deliberately no bytes and no unsigned path. `urls` carries signed, short-lived links per
        variant and nothing else (REQ-MED-010); a field with a raw path would be a field that bypasses the
        signature, the expiry and the dedicated hostname at once.

        When the scan has not finished, `urls` is empty rather than absent. A client showing a
        placeholder needs to know the upload exists and is not yet retrievable, which is a different state
        from "no such file" (REQ-MED-013).
      properties:
        byteSize:
          description: the size of the original
          format: int64
          type: integer
        heightPx:
          description: the height for an image, or `null`
          format: int32
          type: integer
        id:
          description: the media object
          format: uuid
          type: string
        mediaType:
          description: the detected type, never the declared one
          type: string
        primaryImage:
          description: |-
            whether this is the image lists show for the thing it hangs on
            (REQ-MED-002). Carried per attachment rather than implied by position, because the list is
            paged and the primary is not guaranteed to be on the page a client is looking at
          type: boolean
        scanState:
          description: where the scan stands; only `CLEAN` yields URLs
          type: string
        urls:
          additionalProperties:
            type: string
          description: variant name to signed URL, empty until the scan says clean
          type: object
        widthPx:
          description: the width for an image, or `null`
          format: int32
          type: integer
      type: object
    MemberPage:
      description: One page of members.
      properties:
        items:
          description: the members
          items:
            $ref: '#/components/schemas/MemberView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    MemberView:
      description: A member of the tenant.
      properties:
        displayName:
          description: what the interface calls them
          type: string
        email:
          description: the address they sign in with
          type: string
        joinedAt:
          description: when the membership was written
          format: date-time
          type: string
        role:
          description: the built-in role they hold here
          type: string
        roleDefinitionId:
          description: the tenant-owned role extending it (REQ-TEN-006), or null
          format: uuid
          type: string
        roleName:
          description: |-
            what to call the role: the tenant-owned role's name where there is one,
            otherwise the built-in name. A member list shows this rather than making a client join
          type: string
        scopeLocationId:
          description: |-
            the part of the tree they are confined to (REQ-TEN-007), or null for the
            whole tenant
          format: uuid
          type: string
        userId:
          description: the account
          format: uuid
          type: string
      type: object
    OperatorPage:
      description: One page of operators.
      properties:
        items:
          description: the accounts
          items:
            $ref: '#/components/schemas/AccountView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    Problem:
      additionalProperties: true
      description: 'An error, as RFC 9457 describes one. A client branches on `type` and never on `detail`:
        the URI is stable and documented under `api/problems/`, the prose is not and is translated (REQ-API-003).'
      properties:
        detail:
          description: What happened this time, in a sentence. Not stable; do not branch on it.
          type: string
        instance:
          description: The path of the request that failed.
          format: uri
          type: string
        status:
          description: The HTTP status, repeated in the body.
          format: int32
        title:
          description: The condition stable, human-readable name.
          type: string
        traceId:
          description: The identifier of this request in the server log. Quoting it in a report leads
            straight to the operation (REQ-NFR-042).
          type: string
        type:
          description: What went wrong, as an identifier. One of the tokens in `docs/reference/problem-types.yaml`,
            under `https://home-inv.example/problems/`. Fixed for the product rather than derived from
            a deployment hostname, so a client recognises it from every instance.
          format: uri
          type: string
      required:
      - status
      - title
      - type
    QuotaRequest:
      description: The body of a quota change.
      properties:
        permitted:
          description: |-
            how much the tenant may use. Zero is legal and means "none for now"; there is
            no way to say "unlimited", because an unbounded quota is not a quota
          format: int64
          minimum: 0
          type: integer
      type: object
    QuotaState:
      description: Where a tenant stands in one quota.
      properties:
        permitted:
          description: how much is allowed
          format: int64
          type: integer
        used:
          description: how much is in use now
          format: int64
          type: integer
      type: object
    RelationPage:
      description: One page of relations.
      properties:
        items:
          description: the relations on this page
          items:
            $ref: '#/components/schemas/RelationView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    RelationRequest:
      description: The body of a relation.
      properties:
        targetId:
          description: the item this one points at
          format: uuid
          type: string
        type:
          description: '`ACCESSORY_OF`, `PART_OF`, `REPLACEMENT_FOR` or `RELATED`'
          maxLength: 20
          minLength: 0
          type: string
      required:
      - targetId
      - type
      type: object
    RelationView:
      description: One relation, as the item at either end sees it.
      properties:
        id:
          description: the relation
          format: uuid
          type: string
        inbound:
          description: |-
            whether the item that was asked is the TARGET rather than the source. A client
            renders "accessories" for one and "accessory of" for the other, from the same row
          type: boolean
        sourceId:
          description: the item the relation is stated from
          format: uuid
          type: string
        targetId:
          description: the item it points at
          format: uuid
          type: string
        type:
          description: what kind of relation
          enum:
          - ACCESSORY_OF
          - PART_OF
          - REPLACEMENT_FOR
          - RELATED
          type: string
      type: object
    RenameLocationRequest:
      description: The body of a rename.
      properties:
        name:
          description: the new name
          maxLength: 300
          minLength: 0
          type: string
      required:
      - name
      type: object
    RevisionPage:
      description: One page of history.
      properties:
        items:
          description: the revisions on this page, newest first
          items:
            $ref: '#/components/schemas/RevisionView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    RevisionView:
      description: One entry of a history.
      properties:
        changedAt:
          description: when
          format: date-time
          type: string
        changedBy:
          description: who, or `null` where a system process made the change
          format: uuid
          type: string
        kind:
          description: what happened
          enum:
          - CREATED
          - UPDATED
          - TRASHED
          - RESTORED
          - PURGED
          type: string
        revision:
          description: this entry's number in the entity's history, counting from one
          format: int64
          type: integer
        snapshot:
          description: the state it produced, as JSON text
          type: string
      type: object
    RolePage:
      description: One page of roles.
      properties:
        items:
          description: the definitions
          items:
            $ref: '#/components/schemas/RoleView'
          type: array
        nextCursor:
          description: where the next page starts, or null when this was the last
          type: string
      type: object
    RoleReference:
      description: A role a rule is about.
      properties:
        role:
          description: the built-in role's name, or null
          type: string
        roleDefinitionId:
          description: the tenant-owned role, or null
          format: uuid
          type: string
      type: object
    RoleRequest:
      description: The body of a role change.
      properties:
        role:
          description: |-
            one of `OWNER`, `ADMIN`, `MEMBER`, `CONTRIBUTOR`,
            `VIEWER`, `GUEST`. A name this build does not know grants nothing and is
            refused
          maxLength: 32
          minLength: 0
          type: string
        roleDefinitionId:
          description: |-
            a tenant-owned role extending it (REQ-TEN-006), or omitted for a plain
            built-in role. Where it is given it decides the base, and `role` is ignored
          format: uuid
          type: string
        scopeLocationId:
          description: |-
            a location to confine them to (REQ-TEN-007), or omitted for the whole
            tenant
          format: uuid
          type: string
      required:
      - role
      type: object
    RoleView:
      description: A tenant-owned role.
      properties:
        baseRole:
          description: the built-in role it extends
          type: string
        description:
          description: what it is for, or null
          type: string
        effectivePermissions:
          description: |-
            everything it holds, base included — so a client can show what a
            role means without re-implementing the ladder
          items:
            type: string
          type: array
        id:
          description: the definition
          format: uuid
          type: string
        name:
          description: what the tenant calls it
          type: string
        permissions:
          description: the ids it adds
          items:
            type: string
          type: array
      type: object
    SearchResult:
      description: What was found.
      properties:
        items:
          description: the matching items
          items:
            $ref: '#/components/schemas/ItemView'
          type: array
        nextCursor:
          description: the cursor for the following page, or `null` when this was the last
          type: string
      type: object
    SessionView:
      description: |-
        Who the caller is after the switch.

        The same shape `GET /api/v1/auth/me` answers with, so a client has one type for "the
        session" however it changed.
      properties:
        email:
          description: the address they signed in with
          type: string
        locale:
          description: their interface language
          type: string
        role:
          description: the role they hold in the new tenant
          type: string
        tenantId:
          description: the tenant this session now acts for
          format: uuid
          type: string
        userId:
          description: the person
          format: uuid
          type: string
      type: object
    SwitchTenantRequest:
      description: The body of a switch.
      properties:
        tenantId:
          description: |-
            the tenant to act for. Must be one the caller is a member of; anything else is
            answered as though it did not exist
          format: uuid
          type: string
      required:
      - tenantId
      type: object
    TagGroupPage:
      description: One page of tag groups.
      properties:
        items:
          description: the groups on this page
          items:
            $ref: '#/components/schemas/TagGroupView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    TagGroupRequest:
      description: The body of a group creation.
      properties:
        displayOrder:
          description: where the group sits among the others
          format: int32
          type: integer
        exclusive:
          description: whether a thing may carry only one tag of this group
          type: boolean
        key:
          description: the stable key
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the group's name per language tag
          type: object
      required:
      - key
      type: object
    TagGroupView:
      description: A group of tags — "condition", "room", "owner" (REQ-CORE-061).
      properties:
        displayOrder:
          description: where the group sits among the others on a form
          format: int32
          type: integer
        exclusive:
          description: |-
            whether a thing may carry only one tag of this group. "Condition" is one of new,
            used or broken; a thing that was both would be a thing whose condition nobody can read
          type: boolean
        id:
          description: the group
          format: uuid
          type: string
        key:
          description: the stable key, which is what an import or an export names
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the group's name per language tag, as the tenant wrote it. Multilingual data rather
            than interface text: the server cannot translate a word a tenant invented (REQ-NFR-032)
          type: object
      type: object
    TagPage:
      description: One page of tags.
      properties:
        items:
          description: the tags on this page
          items:
            $ref: '#/components/schemas/TagView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    TagRequest:
      description: The body of a tag creation or change.
      properties:
        colour:
          description: '`#rrggbb`, or omitted'
          maxLength: 7
          minLength: 0
          type: string
        groupId:
          description: the group it belongs to, or omitted
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        name:
          description: the name a person reads and types
          maxLength: 120
          minLength: 0
          type: string
      required:
      - name
      type: object
    TagView:
      description: A tag as everything outside this block sees it.
      properties:
        colour:
          description: '`#rrggbb`, or `null` when the tenant chose none (REQ-CORE-062)'
          type: string
        groupId:
          description: the group it belongs to, or `null`
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or `null`
          type: string
        id:
          description: the tag
          format: uuid
          type: string
        mergedInto:
          description: |-
            what this tag became, or `null` while it is itself. A tag with a value
            here is a tombstone: it is offered nowhere, carries nothing, and exists so a client holding
            its id is redirected rather than told the tag never existed (REQ-CORE-063)
          format: uuid
          type: string
        name:
          description: the name a person reads, unique per tenant among the live ones
          type: string
      type: object
    TenantMembershipView:
      description: One of the caller's memberships.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name, which is what a switcher shows
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    TenantView:
      description: A tenant as its member sees it.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    UpdateItemRequest:
      description: 'The body of an update. `kind` is absent: a physical item does not become a digital
        one.'
      properties:
        attributes:
          description: |-
            the new attribute set as a JSON object, checked against the version the item
            was written against rather than against whatever the type says today
          maxLength: 65536
          minLength: 0
          type: string
        description:
          description: the new description
          maxLength: 20000
          minLength: 0
          type: string
        locationId:
          description: the new location; required while the item is physical
          format: uuid
          type: string
        minimumStock:
          description: the new restocking level, or omitted to stop tracking one
          minimum: 0
          type: number
        name:
          description: the new name
          maxLength: 500
          minLength: 0
          type: string
        notes:
          description: the new notes; HTML is removed before they are stored
          maxLength: 20000
          minLength: 0
          type: string
        quantity:
          description: the new quantity; `null` means one
          minimum: 0
          type: number
        quantityUnit:
          description: the new unit
          maxLength: 30
          minLength: 0
          type: string
      required:
      - name
      type: object
    ValueListEntryView:
      description: One permitted value.
      properties:
        archived:
          description: whether it is still offered for new input
          type: boolean
        displayOrder:
          description: its position
          format: int32
          type: integer
        id:
          description: the entry
          format: uuid
          type: string
        labels:
          additionalProperties:
            type: string
          description: its readable form per language tag
          type: object
        value:
          description: what is stored in an item's attributes
          type: string
      type: object
    ValueListPage:
      description: One page of value lists.
      properties:
        items:
          description: the lists on this page, each with its entries
          items:
            $ref: '#/components/schemas/ValueListView'
          type: array
        nextCursor:
          description: the cursor for the next page, or `null` when this was the last
          type: string
      type: object
    ValueListView:
      description: A value list with its entries.
      properties:
        entries:
          description: its entries in display order, archived ones included
          items:
            $ref: '#/components/schemas/ValueListEntryView'
          type: array
        id:
          description: the list
          format: uuid
          type: string
        key:
          description: its stable key
          type: string
        labels:
          additionalProperties:
            type: string
          description: its name per language tag
          type: object
      type: object
    VersionView:
      description: One version and the fields it declares.
      properties:
        fields:
          description: every field, in display order, inherited ones included once published
          items:
            $ref: '#/components/schemas/FieldDefinitionView'
          type: array
        id:
          description: the version
          format: uuid
          type: string
        ownerId:
          description: the item type or location category it belongs to
          format: uuid
          type: string
        published:
          description: whether it is frozen and referenceable
          type: boolean
        versionNumber:
          description: its position in that owner's series, starting at one
          format: int32
          type: integer
      type: object
    VisibilityRequest:
      description: The one condition that decides whether a client shows a field.
      properties:
        field:
          description: the key of the field watched
          maxLength: 64
          minLength: 0
          type: string
        operator:
          description: '`equals`, `notEquals`, `present` or `absent`'
          maxLength: 16
          minLength: 0
          type: string
        value:
          description: the JSON text compared against, for the two operators that compare
          maxLength: 256
          minLength: 0
          type: string
      required:
      - field
      - operator
      type: object
    VisibilityRule:
      description: |-
        When a field is shown: one condition, over one other field of the same item (REQ-CORE-028).

        ## Why it is this small

        ADR-0020 permits "a simple condition over another field of the same item" and gives the example
        that decides the shape: show `warrantyUntil` when `hasWarranty` is true. It permits no
        conjunction, no nesting and no reference to a second item — because each of those is a step toward
        an expression language that would have to evaluate identically in Java, TypeScript and Kotlin, and
        the line against that is the core of that decision.

        A rule is presentation only. A hidden field is not cleared, not exempted from `required`
        and not removed from the generated schema: hiding a value is not the same as not having one, and a
        schema that changed shape with the data would be a schema a client could not cache.
      properties:
        field:
          description: |-
            the key of the field this one watches, which must be another field of the same type
            version — a rule pointing at itself is a refused definition
          type: string
        operator:
          description: how the watched value is compared
          enum:
          - EQUALS
          - NOT_EQUALS
          - PRESENT
          - ABSENT
          type: string
        value:
          description: |-
            what it is compared against, as the JSON text of a scalar (`true`, `3`,
            `"new"`). Ignored by {@link Operator#PRESENT Operator#PRESENT} and {@link Operator#ABSENT Operator#ABSENT}
          type: string
      type: object
info:
  contact:
    email: lucas.greuloch@gmail.com
    name: Lucas Greuloch (greluc)
    url: https://github.com/greluc/Home-Inventory
  description: |-
    The HTTP surface of a self-hosted Home Inventory instance.

    This document is generated from the implementation and committed (ADR-0049); it describes what the code does rather than what it was meant to do. Errors follow RFC 9457 on every endpoint, and a client branches on the `type` URI, which is registered in `docs/reference/problem-types.yaml` and documented under `api/problems/` (REQ-API-003).

    Paths are versioned. Within a major version a field may be added and an optional one may appear, and nothing a client already reads changes meaning (REQ-API-008).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: Home Inventory API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: |-
        Verifies credentials and establishes a session.

        Any session that existed before the login is invalidated and a new one created. That is what
        prevents session fixation: an id an attacker planted beforehand is never the id the
        authenticated session ends up with.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: the credentials
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: who the caller now is
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Rate limited (`rate-limited`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Verifies credentials and establishes a session
  /api/v1/auth/logout:
    post:
      description: |-
        Ends the session.

        Always `204`, whether or not there was a session. A client cleaning up after itself
        should not have to care, and the answer says nothing about whether the caller was logged in.
      operationId: logout
      responses:
        '204':
          description: No Content
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Ends the session
  /api/v1/auth/me:
    get:
      description: Who the caller is.
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: the session view
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Who the caller is.
  /api/v1/catalog/fields/{id}:
    delete:
      description: Removes a deprecated field and every value stored under it.
      operationId: removeField
      parameters:
      - description: the field
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden (`forbidden`)
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found (`not-found`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
