# GENERATED FROM THE IMPLEMENTATION — DO NOT EDIT.
#
# `./gradlew updateOpenApi` regenerates it; `./gradlew :app:test` fails while this file and
# the code disagree. Editing it by hand is lost and noticed rather than lost and not
# (ADR-0049).
components:
  schemas:
    AcceptRequest:
      description: The body of an acceptance.
      properties:
        displayName:
          description: |-
            what the interface should call the new account; ignored when the address
            already has one
          maxLength: 200
          minLength: 0
          type: string
        locale:
          description: the interface language to start in; ignored when the account exists
          maxLength: 16
          minLength: 0
          type: string
        password:
          description: |-
            the new account's password. Length-bounded for the reason the login's is:
            Argon2id spends 19 MiB per hash, and an unbounded field is an invitation to spend it on a
            megabyte of nothing
          maxLength: 200
          minLength: 0
          type: string
      type: object
    AcceptedInvitation:
      description: What accepting an invitation produced.
      properties:
        accountCreated:
          description: |-
            whether this acceptance created the account, which decides whether the
            client sends the person to a sign-in or straight on
          type: boolean
        role:
          description: the role granted
          type: string
        tenantId:
          description: the tenant joined
          format: uuid
          type: string
        tenantName:
          description: its display name, so the client can say where the person has landed
          type: string
        userId:
          description: the account, whether it existed or was created by this acceptance
          format: uuid
          type: string
      type: object
    AccountView:
      description: |-
        An account as the operator's view shows it.

        No password hash, no session information, no list of tenants: an operator administers
        entitlements, and the rest is the account holder's.
      properties:
        displayName:
          description: what the interface calls them
          type: string
        email:
          description: the login address
          type: string
        id:
          description: the account
          format: uuid
          type: string
        instanceOperator:
          description: whether they administer the instance
          type: boolean
        locked:
          description: whether the account is barred from authenticating
          type: boolean
        mayCreateTenants:
          description: whether they may create tenants
          type: boolean
        tenantLimit:
          description: their own limit, or null when the instance-wide default applies
          format: int32
          type: integer
      type: object
    AddEntryRequest:
      description: A value to add to a list.
      properties:
        displayOrder:
          description: its position
          format: int32
          type: integer
        labels:
          additionalProperties:
            type: string
          description: its readable form per language tag
          type: object
        value:
          description: what lands in an item's attributes
          maxLength: 128
          minLength: 0
          type: string
      required:
      - value
      type: object
    BlockReport:
      description: What one block removed, or deliberately did not.
      properties:
        block:
          description: the building block's name, as 04 §4.3 spells it
          type: string
        note:
          description: |-
            what was left and why, or null when everything of this block's went. The one entry
            that always carries a note is `audit`: the application holds `INSERT` and
            `SELECT` on the log and nothing else (`REQ-SEC-069`), so the log outlives the erasure
            and is removed by the retention run under `homeinv_housekeeping`
          type: string
        rowsRemoved:
          description: how many rows went
          format: int64
          type: integer
      type: object
    Bucket:
      description: One value of the dimension, and how many rows carry it.
      properties:
        count:
          description: how many rows
          format: int64
          type: integer
        value:
          description: |-
            the token a `filter` takes for this bucket — a type key, a tag name, a
            location id, an attribute value
          type: string
      type: object
    BulkEntryRequest:
      description: One item in a bulk call.
      properties:
        idempotencyKey:
          description: this entry's own key, or `null`. In the body for the same reason
          maxLength: 255
          minLength: 0
          type: string
        itemId:
          description: the item
          format: uuid
          type: string
        version:
          description: |-
            the version the caller acted on, from the `ETag` of its last read, or
            `null` to skip the check for this entry. In the body and not in `If-Match`,
            because a header cannot carry 500 of them
          format: int64
          minimum: 0
          type: integer
      required:
      - itemId
      type: object
    BulkEntryStatus:
      description: What became of one entry.
      properties:
        detail:
          description: what went wrong in prose, or `null` when nothing did
          type: string
        itemId:
          description: the item this line is about
          format: uuid
          type: string
        status:
          description: the status this entry would have had as a request of its own
          format: int32
          type: integer
        title:
          description: the stable name of the condition, or `null` when the entry was applied
          type: string
        type:
          description: the problem type URI, or `null` when the entry was applied
          type: string
      type: object
    BulkRequest:
      description: One change, its target, and the items it applies to.
      properties:
        entries:
          description: the items, at most 500
          items:
            $ref: '#/components/schemas/BulkEntryRequest'
          maxItems: 500
          minItems: 1
          type: array
        itemTypeId:
          description: the type a change of type writes them against
          format: uuid
          type: string
        locationId:
          description: where a move puts them
          format: uuid
          type: string
        operation:
          description: which of the four
          enum:
          - MOVE
          - TAG
          - CHANGE_TYPE
          - DELETE
          type: string
        tagId:
          description: what a tag assignment assigns
          format: uuid
          type: string
      required:
      - entries
      - operation
      type: object
    BulkResponse:
      description: What became of every entry.
      properties:
        entries:
          description: one line per entry, in the order they were sent
          items:
            $ref: '#/components/schemas/BulkEntryStatus'
          type: array
      type: object
    BundleMemberRequest:
      description: The body that puts an item into a bundle.
      properties:
        memberId:
          description: the item to put in
          format: uuid
          type: string
      required:
      - memberId
      type: object
    BundleMemberView:
      description: One membership.
      properties:
        bundleId:
          description: the item that contains
          format: uuid
          type: string
        id:
          description: the membership, which is what a sync reconciles
          format: uuid
          type: string
        memberId:
          description: the item in it
          format: uuid
          type: string
      type: object
    CapabilityView:
      description: One capability a plugin asks for.
      properties:
        granted:
          description: |-
            whether this tenant has agreed to it. False is the state every capability starts
            in: a plugin has no permissions until they are granted
          type: boolean
        id:
          description: the capability, from the closed set of 09 §9.4
          type: string
      type: object
    CategoryView:
      description: A location category as an administrator sees it.
      properties:
        archived:
          description: whether it is offered for nothing new
          type: boolean
        builtin:
          description: whether it was provisioned with the tenant
          type: boolean
        draftVersionId:
          description: the version being edited, or `null`
          format: uuid
          type: string
        icon:
          description: an icon name for the client, or `null`
          type: string
        id:
          description: the category
          format: uuid
          type: string
        key:
          description: its stable key
          type: string
        labels:
          additionalProperties:
            type: string
          description: its name per language tag
          type: object
        mobile:
          description: whether its locations travel with their contents
          type: boolean
        publishedVersionId:
          description: the newest published version, or `null`
          format: uuid
          type: string
      type: object
    CeremonyView:
      description: The options one side of a ceremony needs.
      properties:
        options:
          description: |-
            the WebAuthn options, as the JSON `navigator.credentials` takes. Passed
            through as text rather than re-modelled: the shape is the specification's, and a second
            model of it here would be a second thing to keep in step with browsers
          type: string
      type: object
    Certificate:
      description: One certificate.
      properties:
        completedAt:
          description: when the last block reported
          format: date-time
          type: string
        report:
          description: |-
            one entry per building block: how many rows it removed, and where something was
            deliberately left, why
          items:
            $ref: '#/components/schemas/BlockReport'
          type: array
        requestedAt:
          description: when the erasure was asked for
          format: date-time
          type: string
        requestedBy:
          description: |-
            which account asked. An opaque id and nothing more, which is what 05 §5.9
            means by keeping the record "pseudonymised"
          format: uuid
          type: string
        tenantId:
          description: the tenant that was erased
          format: uuid
          type: string
        tenantName:
          description: what it was called, as it stood when the erasure began
          type: string
      type: object
    ChildCategoriesRequest:
      description: The categories a category is to take underneath it (REQ-CORE-047).
      properties:
        permitted:
          description: |-
            the categories, by id. Omitted or empty withdraws the restriction, so the
            category takes everything again; the cap is the one every collection here carries
          items:
            format: uuid
            type: string
          maxItems: 200
          minItems: 0
          type: array
      type: object
    ChildCategoryRuleView:
      description: |-
        What one category takes underneath it (REQ-CORE-047).

        No cursor and no page, and that is deliberate: the list is the rule itself, and half a
        whitelist is not a smaller answer but a wrong one. It cannot outgrow the tenant's categories,
        which is a configuration surface a person maintains by hand — the write caps it at 200 anyway,
        for the reason every collection here is capped.
      properties:
        categoryId:
          description: the category the rule belongs to
          format: uuid
          type: string
        permitted:
          description: |-
            the categories it takes, by id, ordered by when each was permitted. Empty
            means no restriction at all and therefore everything, not nothing
          items:
            format: uuid
            type: string
          type: array
      type: object
    ConstraintsRequest:
      description: The declarative limits on a field.
      properties:
        max:
          description: the largest permitted number
          type: number
        maxLength:
          description: the most characters
          format: int32
          type: integer
        min:
          description: the smallest permitted number
          type: number
        minLength:
          description: the fewest characters
          format: int32
          type: integer
        pattern:
          description: a regular expression the whole value must match
          maxLength: 256
          minLength: 0
          type: string
        referenceKind:
          description: |-
            what a `reference` may point at: `ITEM`, `LOCATION` or
            `VALUE_LIST`
          maxLength: 16
          minLength: 0
          type: string
        unit:
          description: the one unit or ISO 4217 code accepted
          maxLength: 16
          minLength: 0
          type: string
      type: object
    CreateCategoryRequest:
      description: What to call a new location category.
      properties:
        key:
          description: the stable key
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the name per language tag
          type: object
        mobile:
          description: whether its places travel with their contents
          type: boolean
      required:
      - key
      type: object
    CreateItemRequest:
      description: |-
        The body of a creation.

        The constraints are duplicated from the aggregate on purpose. The aggregate's checks are the
        truth and hold for every caller; these produce a `422` with a field path, which is what
        lets a form mark the field instead of showing a sentence. A rule that existed only here would
        be one a non-HTTP caller could walk past.
      properties:
        attributes:
          description: |-
            the fields the type declares, as a JSON object. Checked against the version's
            schema, and an offending value is a `422` naming its path (REQ-CORE-005)
          maxLength: 65536
          minLength: 0
          type: string
        description:
          description: free text
          maxLength: 20000
          minLength: 0
          type: string
        id:
          description: the client's chosen UUIDv7, or `null` to have one assigned
          format: uuid
          type: string
        itemTypeId:
          description: |-
            the type, or omitted — the server then uses the tenant's built-in type, which
            is what a quick capture does and what every stage-0 client did. The TYPE and not one of its
            versions: a person picks "book", and which version that is today is the server's to know
            (REQ-CORE-025)
          format: uuid
          type: string
        kind:
          description: '`PHYSICAL` or `DIGITAL`'
          enum:
          - PHYSICAL
          - DIGITAL
          type: string
        locationId:
          description: required for a physical item
          format: uuid
          type: string
        maintenanceIntervalDays:
          description: |-
            how often it needs servicing, in days, or omitted when
            nothing should remind about it (REQ-LIFE-004). Days and not months, because "every 3
            months from 31 January" has no answer that is not a surprise to somebody
          format: int32
          maximum: 3650
          minimum: 1
          type: integer
        minimumStock:
          description: the level below which this consumable needs restocking, or omitted
          minimum: 0
          type: number
        name:
          description: the name
          maxLength: 500
          minLength: 0
          type: string
        notes:
          description: a paragraph in limited Markdown; HTML is removed before it is stored
          maxLength: 20000
          minLength: 0
          type: string
        quantity:
          description: how many; `null` means one
          minimum: 0
          type: number
        quantityUnit:
          description: the unit
          maxLength: 30
          minLength: 0
          type: string
        valuation:
          $ref: '#/components/schemas/ValuationRequest'
          description: what it cost, what covers it and what replacing it would cost, or omitted
      required:
      - kind
      - name
      type: object
    CreateItemTypeRequest:
      description: What to call a new item type.
      properties:
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        key:
          description: the stable key, lower-case and unique per tenant
          maxLength: 64
          minLength: 0
          type: string
        kind:
          description: '`PHYSICAL` or `DIGITAL`'
          maxLength: 16
          minLength: 0
          type: string
        parentId:
          description: the type it inherits from, or omitted
          format: uuid
          type: string
      required:
      - key
      - kind
      type: object
    CreateLocationRequest:
      description: The body of a creation.
      properties:
        attributes:
          description: |-
            the fields the category declares, as a JSON object. Checked against the
            category version's schema, and an offending value is a `422` naming its path
            (REQ-CORE-041, REQ-CORE-005)
          maxLength: 65536
          minLength: 0
          type: string
        categoryId:
          description: the category
          format: uuid
          type: string
        id:
          description: the client's chosen id, or omitted
          format: uuid
          type: string
        name:
          description: the name
          maxLength: 300
          minLength: 0
          type: string
        parentId:
          description: the parent, or omitted to create a root
          format: uuid
          type: string
      required:
      - categoryId
      - name
      type: object
    CreateTenantRequest:
      description: The body of a tenant creation.
      properties:
        name:
          description: |-
            what to call it. The only thing a new tenant needs: everything else it has —
            the built-in item type, the location categories — is seeded for it
          maxLength: 200
          minLength: 0
          type: string
      required:
      - name
      type: object
    CreateValueListRequest:
      description: What to call a new value list.
      properties:
        key:
          description: the stable key
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the list's name per language tag
          type: object
      required:
      - key
      type: object
    DeletionRequest:
      description: What an erasure request produced.
      properties:
        eraseAfter:
          description: when the grace period runs out and the erasure begins
          format: date-time
          type: string
        revocationToken:
          description: |-
            the secret that withdraws it. Returned **once**: where
            `plugin-smtp` is installed it also goes out by mail, and where it is not — which a
            `minimal` installation is by design — this is the only way it reaches anybody
          type: string
      type: object
    DisposalRequest:
      description: The body of a disposal (REQ-LIFE-007).
      properties:
        note:
          description: anything else worth knowing, or absent
          maxLength: 2000
          minLength: 0
          type: string
        'on':
          description: when it went
          format: date
          type: string
        price:
          $ref: '#/components/schemas/MoneyJson'
          description: |-
            what it fetched, or absent. Only a sale has one; absent rather than zero for
            something given away, because the two are different claims
        recipient:
          description: who to, in the seller's own words, or absent
          maxLength: 200
          minLength: 0
          type: string
        state:
          description: |-
            `SOLD` or `DISPOSED` — the two ways an item leaves. Any other value is
            refused rather than treated as a disposal
          enum:
          - ACTIVE
          - LENT
          - ARCHIVED
          - TRASHED
          - SOLD
          - DISPOSED
          type: string
      required:
      - 'on'
      - state
      type: object
    EnrolmentView:
      description: What an account holds.
      properties:
        enrolledAt:
          description: when it was confirmed, or null
          format: date-time
          type: string
        passkeys:
          description: the registered passkeys, oldest first
          items:
            $ref: '#/components/schemas/PasskeyView'
          type: array
        recoveryCodesLeft:
          description: |-
            how many single-use codes are unspent. Zero beside a confirmed factor
            is worth showing: losing the phone then loses the account
          format: int32
          type: integer
        totpConfirmed:
          description: whether a confirmed authenticator app exists
          type: boolean
      type: object
    EntitlementsRequest:
      description: The body of an entitlement change.
      properties:
        instanceOperator:
          description: whether the account administers the instance
          type: boolean
        mayCreateTenants:
          description: whether it may create tenants (REQ-TEN-002)
          type: boolean
        tenantLimit:
          description: how many tenants it may be in, or omitted for the instance-wide default
          format: int32
          maximum: 200
          minimum: 0
          type: integer
      type: object
    Expiring:
      description: One thing that runs out.
      properties:
        dueOn:
          description: when it runs out
          format: date
          type: string
        itemId:
          description: which item
          format: uuid
          type: string
        itemName:
          description: what it is called
          type: string
        kind:
          description: |-
            `warranty` for the column, or the field's key for an attribute — so a client
            can group by it and a person can see *what* runs out rather than only when
          type: string
        label:
          description: |-
            what to call the kind in the tenant's language, or the field key when the field
            declares no label
          type: string
      type: object
    ExportJobView:
      description: An export job as a caller sees it.
      properties:
        byteSize:
          description: how large the archive is, or `null` until it exists
          format: int64
          type: integer
        failure:
          description: |-
            what went wrong, or `null`. Never a stack trace: it is shown to whoever
            asked
          type: string
        finishedAt:
          description: when it finished, or `null`
          format: date-time
          type: string
        id:
          description: its id
          format: uuid
          type: string
        progress:
          description: |-
            how far along, 0 to 100 — coarse on purpose, because it is read by somebody
            deciding whether to keep waiting and a number that moves is worth more to them than a
            number that is exact
          format: int32
          type: integer
        ready:
          description: Whether the archive can be downloaded.
          type: boolean
        requestedAt:
          description: when it was asked for
          format: date-time
          type: string
        requestedBy:
          description: who asked
          format: uuid
          type: string
        state:
          description: '`QUEUED`, `RUNNING`, `READY` or `FAILED`'
          type: string
      type: object
    Facet:
      description: |-
        How many rows a list would still hold for each value of one dimension (REQ-SRCH-002).

        The sidebar beside a list: "Werkzeug 41, Buch 12", "defekt 4", "Schuppen 18". A client renders
        the buckets and puts a bucket's {@link Bucket#value Bucket#value()} straight back into a `filter`
        parameter — which is why a bucket carries the token the filter grammar takes and not a display
        name. A type is its key, a tag its name, a location its id, an attribute its stored value; the
        names come from the endpoints that own them, because a count is not the place to learn what
        something is called in a language.

        ## A facet is counted without its own filter

        Decided with the owner on 2026-09-14. With `filter=tag:broken` active, the tag facet
        still counts every tag — "neu 12, gebraucht 30, defekt 4" — because the whole point of the
        sidebar is to show where one could click next. Counted *with* its own filter it would show
        one tag and the total, which is a number nobody needs and a control nobody can use. Every
        *other* dimension's filters do narrow it, so the counts still describe the list somebody is
        looking at.

        That makes "facet counts agree with the results" true of a dimension nobody filtered by and
        deliberately untrue of one somebody did. REQ-SRCH-002's acceptance says so since that decision.
      properties:
        buckets:
          description: the values and their counts, most first
          items:
            $ref: '#/components/schemas/Bucket'
          type: array
        dimension:
          description: |-
            what was counted, spelled as the `facet` and `filter` parameters
            spell it: `type`, `category`, `tag`, `location` or
            `attr.<key>`
          type: string
      type: object
    FieldConstraints:
      description: |-
        The declarative limits a field puts on its values — the whole of them (ADR-0020).

        Every member is expressible in JSON Schema and evaluable with the value in hand, which is what
        lets a client offline reach the same verdict as the server (REQ-CORE-027). There is deliberately
        nothing here that reads another item, calls out, or evaluates an expression: those are the three
        things ADR-0020 excludes, and the place they belong is a plugin.

        A `null` member is no constraint at all. A record rather than a map, so that a typo in a
        constraint name is a refused field definition rather than a limit that silently does nothing.
      properties:
        empty:
          description: Whether this declares no limit whatsoever.
          type: boolean
        max:
          description: the largest permitted number, by the same rule
          type: number
        maxLength:
          description: |-
            the most characters. Absent, the 64 KiB ceiling on the whole attribute set is the
            only limit, which is a limit on the wrong thing
          format: int32
          type: integer
        min:
          description: |-
            the smallest permitted number, for `integer`, `decimal`, `money` and
            `quantity` — compared against the amount, never against the unit
          type: number
        minLength:
          description: the fewest characters, for the text-shaped kinds
          format: int32
          type: integer
        pattern:
          description: |-
            a regular expression the whole value must match, for `text`, `
            multiline`, `url`, `email` and `secret`. Anchored by the validator, so
            `[0-9]+` means the entire value and not a digit somewhere in it
          type: string
        referenceKind:
          description: what a `reference` field may point at
          enum:
          - ITEM
          - LOCATION
          - VALUE_LIST
          type: string
        unit:
          description: |-
            the one unit a `quantity` field accepts, or the one ISO 4217 code a `
            money` field accepts. Declaring it is what makes a total over the field meaningful:
            REQ-CORE-032 forbids a mixed-unit sum, and a field that accepts any unit can only be summed
            per unit
          type: string
      type: object
    FieldDefinitionView:
      description: |-
        One field of one type version, as everything outside `catalog` sees it.

        A view and not the entity (REQ-NFR-022): `inventory` needs to know that `
        purchasePrice` is money and is searchable; it has no business holding a row it could write back.
      properties:
        constraints:
          $ref: '#/components/schemas/FieldConstraints'
          description: |-
            the declarative limits, never `null` — {@link FieldConstraints#NONE FieldConstraints#NONE} when
            the definition carries none
        dataType:
          description: what kind of value it holds
          enum:
          - TEXT
          - MULTILINE
          - INTEGER
          - DECIMAL
          - MONEY
          - BOOLEAN
          - DATE
          - DATETIME
          - ENUM
          - MULTI_ENUM
          - URL
          - EMAIL
          - QUANTITY
          - REFERENCE
          - SECRET
          - FILE
          type: string
        defaultValue:
          description: the JSON text of the value a new item starts with, or `null`
          type: string
        deprecated:
          description: whether it is hidden from new input while its values remain (REQ-CORE-026)
          type: boolean
        displayOrder:
          description: the position within that group; ties are broken by key, so the order is total
          format: int32
          type: integer
        expiry:
          description: |-
            whether this date is an expiry, and so appears in the overview of
            REQ-LIFE-013
          type: boolean
        facetable:
          description: whether it is mirrored for counting
          type: boolean
        group:
          description: the form section the tenant put it in, or `null`
          type: string
        helpTexts:
          additionalProperties:
            type: string
          description: the explanatory line per language tag, empty when the tenant wrote none
          type: object
        id:
          description: the definition, stable across the life of the version it belongs to
          format: uuid
          type: string
        key:
          description: |-
            the attribute key — `isbn`, `purchasePrice` — which is what appears in
            `item.attributes` and in `item_attr_index.field_key`
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the field's name per language tag, as the tenant wrote it. Multilingual data rather
            than interface text: the server cannot translate a word a tenant invented (REQ-NFR-032)
          type: object
        required:
          description: |-
            whether a value must be present. A deprecated field is never required, whatever
            this says — see {@link de.greluc.homeinv.catalog.api.FieldDefinitionView#effectivelyRequired #effectivelyRequired()}
          type: boolean
        searchable:
          description: whether it is mirrored into the side table for filtering
          type: boolean
        sensitive:
          description: |-
            whether reading it needs a permission of its own and it is encrypted at rest
            (ADR-0019)
          type: boolean
        sortable:
          description: whether it is mirrored for ordering
          type: boolean
        valueListId:
          description: |-
            the list an `enum` or `multi-enum` draws from, `null`
            otherwise
          format: uuid
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityRule'
          description: |-
            the one condition that decides whether a client shows this field, or `
            null` when it is always shown
      type: object
    FieldRemovalPreview:
      description: What a field removal would destroy (REQ-CORE-026).
      properties:
        affected:
          description: how many items or locations carry a value under that key today
          format: int64
          type: integer
        fieldId:
          description: the field
          format: uuid
          type: string
        key:
          description: its attribute key
          type: string
      type: object
    FieldRequest:
      description: A field, as it is added or changed.
      properties:
        constraints:
          $ref: '#/components/schemas/ConstraintsRequest'
          description: the declarative limits
        dataType:
          description: the token of one of the sixteen kinds, for example `multi-enum`
          maxLength: 16
          minLength: 0
          type: string
        defaultValue:
          description: the JSON text of the starting value
          maxLength: 4096
          minLength: 0
          type: string
        displayOrder:
          description: the position within the group
          format: int32
          type: integer
        expiry:
          description: |-
            whether this date is an expiry, and so belongs in the overview of REQ-LIFE-013.
            Only a `date` or `datetime` may carry it; anything else is a `422`
          type: boolean
        facetable:
          description: whether it is mirrored for counting
          type: boolean
        group:
          description: the form section
          maxLength: 64
          minLength: 0
          type: string
        helpTexts:
          additionalProperties:
            type: string
          description: the explanatory line per language tag
          type: object
        key:
          description: the attribute key; ignored when changing
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the field's name per language tag; at least one
          type: object
        required:
          description: whether a value must be present
          type: boolean
        searchable:
          description: whether it is mirrored for filtering
          type: boolean
        sensitive:
          description: whether reading it needs a permission of its own
          type: boolean
        sortable:
          description: whether it is mirrored for ordering
          type: boolean
        valueListId:
          description: the list an enumeration draws from
          format: uuid
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityRequest'
          description: the one condition deciding whether a client shows it
      required:
      - dataType
      type: object
    Figures:
      description: The three figures, each per currency (REQ-LIFE-015, REQ-LIFE-017).
      properties:
        current:
          description: what they are worth now, per currency
          items:
            $ref: '#/components/schemas/MoneyJson'
          type: array
        purchase:
          description: what the things cost, per currency
          items:
            $ref: '#/components/schemas/MoneyJson'
          type: array
        replacement:
          description: what replacing them would cost, per currency
          items:
            $ref: '#/components/schemas/MoneyJson'
          type: array
      type: object
    ImportJobView:
      description: An import job as a caller sees it.
      properties:
        byteSize:
          description: how large the uploaded archive was
          format: int64
          type: integer
        dryRun:
          description: whether the work was thrown away at the end
          type: boolean
        failure:
          description: what went wrong, or null. One sentence, never a stack trace
          type: string
        finishedAt:
          description: when it ended, or null
          format: date-time
          type: string
        id:
          description: its id
          format: uuid
          type: string
        progress:
          description: how far along, 0 to 100
          format: int32
          type: integer
        report:
          description: |-
            what happened, as a JSON object, or null until the job finishes. Per block: how
            many rows were inserted, how many overwritten and how many deliberately skipped, plus the
            sentences saying what an import never writes
          type: string
        requestedAt:
          description: when it was uploaded
          format: date-time
          type: string
        state:
          description: '`QUEUED`, `RUNNING`, `DONE` or `FAILED`'
          type: string
      type: object
    InstanceCapabilityView:
      description: One capability, and whether the instance has granted it.
      properties:
        grantedForInstance:
          description: |-
            whether the instance operator has agreed to it. False is where every
            capability starts, on this level as on the tenant's
          type: boolean
        id:
          description: the capability, from the closed set of 09 §9.4
          type: string
      type: object
    InstancePluginView:
      description: An installed plugin as the operator sees it.
      properties:
        capabilities:
          description: |-
            everything its manifest asks for, each with whether the **instance** has
            granted it. A tenant's grants are not shown here and are not this surface's business
          items:
            $ref: '#/components/schemas/InstanceCapabilityView'
          type: array
        disabled:
          description: whether it is out of service
          type: boolean
        id:
          description: its reverse-domain id
          type: string
        name:
          description: what a person sees
          type: string
        registeredAt:
          description: when it was first seen
          format: date-time
          type: string
        version:
          description: the plugin's own version
          type: string
      type: object
    InvitationView:
      description: |-
        An invitation, as the tenant that issued it sees it.

        The token is not here. It exists once, in the answer to {@link de.greluc.homeinv.tenancy.api.InvitationService.InvitationView#invite #invite}, and afterwards only
        as a hash (REQ-SEC-048) — so a list of invitations cannot be read to obtain one, and an
        administrator who loses a link withdraws it and sends another.
      properties:
        email:
          description: the address it is bound to
          type: string
        expiresAt:
          description: when it stops working
          format: date-time
          type: string
        id:
          description: the invitation
          format: uuid
          type: string
        invitedAt:
          description: when it was issued
          format: date-time
          type: string
        role:
          description: the role it grants on acceptance
          type: string
        state:
          description: '`OPEN`, `ACCEPTED`, `REVOKED` or `EXPIRED`'
          type: string
      type: object
    InviteRequest:
      description: The body of an invitation.
      properties:
        email:
          description: the address to invite, which the invitation is bound to
          format: email
          maxLength: 320
          minLength: 0
          type: string
        role:
          description: the role to grant on acceptance, bounded by what the inviter holds (REQ-TEN-010)
          maxLength: 32
          minLength: 0
          type: string
      required:
      - email
      - role
      type: object
    IssuedInvitation:
      description: A freshly issued invitation, with the one copy of its token.
      properties:
        invitation:
          $ref: '#/components/schemas/InvitationView'
          description: the invitation
        token:
          description: |-
            the secret the invited person presents. Returned exactly once. Where
            `plugin-smtp` is installed it also goes out by mail; where it is not, this is the only
            way the link reaches anybody, which 04 §4.3 describes as the expected reduced state
          type: string
      type: object
    IssuedServiceAccount:
      description: A service account that has just been created, and its token.
      properties:
        account:
          $ref: '#/components/schemas/ServiceAccountView'
          description: the account
        token:
          description: the token, in clear, for the only time it is readable
          type: string
      type: object
    ItemTypeView:
      description: An item type as an administrator sees it.
      properties:
        archived:
          description: whether it is offered for nothing new
          type: boolean
        builtin:
          description: whether it is the one every tenant is provisioned with
          type: boolean
        draftVersionId:
          description: the version being edited, or `null` when none is
          format: uuid
          type: string
        icon:
          description: the icon name, or `null`
          type: string
        id:
          description: the type
          format: uuid
          type: string
        key:
          description: its stable key
          type: string
        kind:
          description: whether its items exist physically
          enum:
          - PHYSICAL
          - DIGITAL
          type: string
        parentId:
          description: the type it inherits from, or `null`
          format: uuid
          type: string
        publishedVersionId:
          description: the newest published version, or `null` when none is published
          format: uuid
          type: string
        usefulLifeMonths:
          format: int32
          type: integer
      type: object
    ItemView:
      description: |-
        What other blocks and the REST layer are allowed to see of an item.

        This is the published type of the `inventory` block (REQ-NFR-023). The entity stays
        inside: handed out, it carries its persistence context with it, so a caller could modify the
        aggregate without passing the use case that guards its invariants — and would do so by accident,
        because a getter returning a managed entity looks exactly like one returning data.

        A record, so it is immutable without anyone having to remember to make it so.
      properties:
        attributes:
          description: |-
            the fields the item's type version declares, as JSON text. The source of
            truth for every attribute (ADR-0004); what a key means is the catalog's business, and a
            client reads the type version's schema to render it
          type: string
        createdAt:
          description: when it was created
          format: date-time
          type: string
        description:
          description: free text, may be `null`
          type: string
        id:
          description: the item's UUIDv7
          format: uuid
          type: string
        kind:
          description: '`PHYSICAL` or `DIGITAL`, as a string so consumers need no enum of ours'
          type: string
        lifecycleState:
          description: |-
            where the item is in its life, as an {@link ItemState ItemState} name —
            `ACTIVE`, `LENT`, `ARCHIVED`, `TRASHED`, `SOLD` or
            `DISPOSED` (04 §4.4). *Said "stage 0 always ACTIVE" until 2026-09-20, by which
            time trashing, lending and disposal all moved it*
          type: string
        locationId:
          description: where it is; `null` for a digital item
          format: uuid
          type: string
        maintenanceIntervalDays:
          description: |-
            how often it needs servicing, in days, or `null` when
            nothing reminds about it (REQ-LIFE-004)
          format: int32
          type: integer
        minimumStock:
          description: the level below which this consumable needs restocking, or `null`
          type: number
        name:
          description: the name
          type: string
        notes:
          description: the paragraph a person wrote, in limited Markdown with the HTML already removed
          type: string
        quantity:
          description: how many
          type: number
        quantityUnit:
          description: the unit, may be `null`
          type: string
        updatedAt:
          description: when it last changed
          format: date-time
          type: string
        valuation:
          $ref: '#/components/schemas/Valuation'
        version:
          description: |-
            the optimistic lock, which a client echoes back on update to detect a concurrent
            edit rather than overwriting one
          format: int64
          type: integer
      type: object
    LoanRequest:
      description: |-
        The body of a handover (REQ-LIFE-005).

        Exactly one of the two borrower fields is given, which the service leaves to the database's
        `num_nonnulls(...) = 1` rather than restating: two places deciding one rule is how they
        come to disagree.
      properties:
        borrowerName:
          description: |-
            who has it, in the lender's own words, or absent. Most things are lent to
            people with no account here
          maxLength: 200
          minLength: 0
          type: string
        borrowerUserId:
          description: a member of this tenant, or absent
          format: uuid
          type: string
        dueOn:
          description: when it is due back, or absent when nothing was agreed
          format: date
          type: string
        handedOutOn:
          description: when it went out
          format: date
          type: string
        note:
          description: anything else worth knowing, or absent
          maxLength: 2000
          minLength: 0
          type: string
      required:
      - handedOutOn
      type: object
    LoanView:
      description: One loan, open or closed.
      properties:
        borrowerName:
          description: the name that was typed, or `null`
          type: string
        borrowerUserId:
          description: the member who has it, or `null`
          format: uuid
          type: string
        dueOn:
          description: when it is due back, or `null`
          format: date
          type: string
        handedOutOn:
          description: when it went out
          format: date
          type: string
        id:
          description: the loan
          format: uuid
          type: string
        itemId:
          description: what was lent
          format: uuid
          type: string
        note:
          description: anything else worth knowing, or `null`
          type: string
        open:
          description: Whether the item is still out.
          type: boolean
        recordedAt:
          description: when the handover was written down
          format: date-time
          type: string
        recordedBy:
          description: who wrote it down
          format: uuid
          type: string
        returnedOn:
          description: when it came back, or `null` while it is still out
          format: date
          type: string
      type: object
    LocationCategoryView:
      description: |-
        A kind of place a location can be: a room, a shelf, a box.

        ## Why the key and not a label

        The categories of stage 0 are shipped, not configured — twelve fixed keys, the same for every
        tenant. Their names are *interface text*, so they belong in the client's resource bundle
        with everything else a user reads, and REQ-NFR-032 forbids display text anywhere else. A label
        returned from here would be one the server would have to translate, in a language the server does
        not know the user prefers.

        That changed at stage 1, and the labels are here now. A category nobody shipped has no key in
        any bundle, so it has to carry its own name; a shipped one may have been renamed by its tenant
        (REQ-CORE-042, "all present and editable"), and that name has to win over the translation.

        So the rule for a client is one sentence: **use the label for the reader's language when
        there is one, and translate the key when there is not.** Nothing here is display text the
        server invented — every label in this map was typed by somebody in the tenant, which is what
        keeps REQ-NFR-032 true.
      properties:
        icon:
          description: an icon name for the client, or `null`
          type: string
        id:
          description: the category, which is what a location references
          format: uuid
          type: string
        key:
          description: |-
            the shipped key — `room`, `shelf`, `box` — which a client translates
            when the tenant has given the category no name of its own
          type: string
        labels:
          additionalProperties:
            type: string
          description: the tenant's own name per language tag, empty when it has none
          type: object
        mobile:
          description: |-
            whether locations of this category travel with their contents. Every shipped one is
            stationary; the flag marks the relocation case a client offers, not a restriction on moving
          type: boolean
      type: object
    LocationView:
      description: |-
        What other blocks and the REST layer see of a location.

        `ancestors` is the readable form of the materialised path: the names from the root down
        to this location, assembled from the rows the path names. The path itself is made of ids and is
        deliberately not published - it is an index structure, and publishing it would invite a client to
        parse it.
      properties:
        ancestors:
          description: the names from the root down to and including this location (REQ-CORE-044)
          items:
            type: string
          type: array
        attributes:
          description: the fields the category version declares, as JSON text (REQ-CORE-041)
          type: string
        categoryId:
          description: the category
          format: uuid
          type: string
        depth:
          description: distance from the root
          format: int32
          type: integer
        id:
          description: the location
          format: uuid
          type: string
        name:
          description: the name
          type: string
        parentId:
          description: the parent, or `null` for a root
          format: uuid
          type: string
        version:
          format: int64
          type: integer
      type: object
    LoginRequest:
      description: The login body.
      properties:
        email:
          description: the address
          maxLength: 320
          minLength: 0
          type: string
        password:
          description: |-
            the password. Length-bounded, because Argon2id spends 19 MiB per attempt and an
            unbounded field is an invitation to spend it on a megabyte of nothing
          maxLength: 200
          minLength: 0
          type: string
      required:
      - email
      - password
      type: object
    MaintenanceEntryView:
      description: One recorded piece of work.
      properties:
        cost:
          $ref: '#/components/schemas/MoneyJson'
          description: what it cost, or `null`
        id:
          description: the entry
          format: uuid
          type: string
        itemId:
          description: what it was done to
          format: uuid
          type: string
        kind:
          description: what kind of work
          type: string
        note:
          description: anything else worth knowing, or `null`
          type: string
        performedOn:
          description: when it was done
          format: date
          type: string
        recordedAt:
          description: when the entry was written down, which is not when the work happened
          format: date-time
          type: string
        recordedBy:
          description: who wrote it down
          format: uuid
          type: string
      type: object
    MaintenanceRequest:
      description: The body of a maintenance entry (REQ-LIFE-003).
      properties:
        cost:
          $ref: '#/components/schemas/MoneyJson'
          description: |-
            what it cost, or absent. Absent rather than zero for work under warranty: the two
            are different claims
        kind:
          description: what kind of work, in the tenant's own words
          maxLength: 100
          minLength: 0
          type: string
        note:
          description: anything else worth knowing, or absent
          maxLength: 2000
          minLength: 0
          type: string
        performedOn:
          description: when the work was done
          format: date
          type: string
      required:
      - kind
      - performedOn
      type: object
    MappingProfile:
      description: |-
        What a CSV's columns mean (REQ-PORT-001, REQ-PORT-002).

        ## Data, not a language

        A profile is a set of pairs: this column is that field. Nothing in it is an expression, a
        formula or a condition, and that is a rule rather than an omission — ADR-0020 says the
        configuration surface must not become a programming language, and a mapping with an `if` in
        it is the first step of exactly that. A file that needs more than pairs needs editing before it
        is uploaded, or a plugin.

        ## Two ship with the product

        Homebox and InvenTree (REQ-PORT-002), as constants rather than as rows: they are the same on
        every instance and in every tenant, so a row per tenant would be provisioning writing the same
        thing over and over, and a built-in nobody may edit is what a constant already is. A tenant
        needing one of them changed copies it into a profile of its own.
      properties:
        columns:
          additionalProperties:
            type: string
          description: |-
            the mapping, from the CSV's own header to a target. A header the map does not name
            is reported and not written; the report lists them once, because a column nobody mapped is
            usually a column somebody meant to
          type: object
        defaultCurrency:
          description: |-
            the currency every price in the file is in. A CSV rarely says, and
            guessing per row is how a household ends up owning things in three currencies
          type: string
        itemTypeKey:
          description: |-
            which item type the rows are written against, or null for the tenant's
            built-in `general`
          type: string
        key:
          description: how the profile is named in a request — `homebox`, `inventree`
          type: string
        name:
          description: what it is called in a list
          type: string
        source:
          description: |-
            the system a file comes from, recorded as the provenance of every item it creates
            (REQ-PORT-008)
          type: string
      type: object
    MediaView:
      description: |-
        What a client learns about a stored file.

        Deliberately no bytes and no unsigned path. `urls` carries signed, short-lived links per
        variant and nothing else (REQ-MED-010); a field with a raw path would be a field that bypasses the
        signature, the expiry and the dedicated hostname at once.

        When the scan has not finished, `urls` is empty rather than absent. A client showing a
        placeholder needs to know the upload exists and is not yet retrievable, which is a different state
        from "no such file" (REQ-MED-013).
      properties:
        byteSize:
          description: the size of the original
          format: int64
          type: integer
        heightPx:
          description: the height for an image, or `null`
          format: int32
          type: integer
        id:
          description: the media object
          format: uuid
          type: string
        mediaType:
          description: the detected type, never the declared one
          type: string
        primaryImage:
          description: |-
            whether this is the image lists show for the thing it hangs on
            (REQ-MED-002). Carried per attachment rather than implied by position, because the list is
            paged and the primary is not guaranteed to be on the page a client is looking at
          type: boolean
        role:
          description: |-
            what the attachment is for — `PHOTO`, `RECEIPT`, `
            WARRANTY_PROOF` or `OTHER` (REQ-LIFE-016). On the **attachment** rather than on the
            file, because the same scan of a receipt may be the purchase proof of one item and an
            ordinary document on another, and the file is stored once by content address either way
          type: string
        scanState:
          description: where the scan stands; only `CLEAN` yields URLs
          type: string
        urls:
          additionalProperties:
            type: string
          description: variant name to signed URL, empty until the scan says clean
          type: object
        widthPx:
          description: the width for an image, or `null`
          format: int32
          type: integer
      type: object
    MemberView:
      description: A member of the tenant.
      properties:
        displayName:
          description: what the interface calls them
          type: string
        email:
          description: the address they sign in with
          type: string
        joinedAt:
          description: when the membership was written
          format: date-time
          type: string
        role:
          description: the built-in role they hold here
          type: string
        roleDefinitionId:
          description: the tenant-owned role extending it (REQ-TEN-006), or null
          format: uuid
          type: string
        roleName:
          description: |-
            what to call the role: the tenant-owned role's name where there is one,
            otherwise the built-in name. A member list shows this rather than making a client join
          type: string
        scopeLocationId:
          description: |-
            the part of the tree they are confined to (REQ-TEN-007), or null for the
            whole tenant
          format: uuid
          type: string
        userId:
          description: the account
          format: uuid
          type: string
      type: object
    Meta:
      description: What was true of the answer rather than of the rows.
      properties:
        degraded:
          description: |-
            whether a derived store was unavailable and something else answered
            (ADR-0039). Never a header: `Warning: 199` was obsoleted by RFC 9111 §5.5
          type: boolean
        degradedReason:
          description: |-
            a stable token from `docs/reference/degraded-reasons.yaml`, or
            `null` when nothing is degraded
          type: string
        took:
          description: how many milliseconds the request took, or `null` before the edge fills it in
          format: int64
          type: integer
      type: object
    MoneyJson:
      description: |-
        The JSON shape of an amount of money (REQ-NFR-070).

        Exists for the document alone. Nothing constructs one: `MoneyModule` does the
        conversion, and this record is what springdoc is told to describe in its place.
      properties:
        amount:
          description: |-
            the amount as a decimal string — never a JSON number, which is a `double`
            by the time it has been through a browser
          type: string
        currency:
          description: the ISO 4217 code, three letters
          type: string
      type: object
    MoveLocationRequest:
      description: Where a location is to be moved.
      properties:
        parentId:
          description: |-
            the new parent, or null to make it a root. A client that means "out of
            everything" says so with null rather than with an absent field, and both are read the same
            way
          format: uuid
          type: string
      type: object
    OpenSession:
      description: One open session, as its owner sees it.
      properties:
        current:
          description: |-
            whether this is the session making the request, which a client shows differently
            and should not offer to end by accident
          type: boolean
        device:
          description: |-
            what the client called itself, shortened. A user agent and nothing more: it is
            what distinguishes "my phone" from "the machine at work" for somebody deciding which to end
          type: string
        handle:
          description: what to call it when ending it — never the session id itself
          type: string
        lastSeenAt:
          description: when it last made a request
          format: date-time
          type: string
        origin:
          description: |-
            where it signed in from, with the host part of the address removed —
            `203.0.113.0/24` rather than the address itself (`REQ-PRIV-006`). Enough to tell a
            familiar network from a strange one, not enough to be a location history
          type: string
        signedInAt:
          description: when the session was established
          format: date-time
          type: string
      type: object
    PageAccountView:
      description: |-
        One page of anything, in the shape 08 §8.2 specifies for every collection.

        `{"data": […], "page": {…`, "meta": {…}}}. Twenty listings each had a record of their
