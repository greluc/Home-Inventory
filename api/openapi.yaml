  /api/v1/tenants/{tenantId}/quotas:
    get:
      description: |-
        Where this tenant stands in each of its four quotas (REQ-TEN-009).

        Readable by anybody who may read the tenant, so a client can warn before a limit is reached
        rather than after. Deliberately exempt from the API-call quota itself: "how much have I used"
        has to be answerable when the answer is "all of it".

        Keyed by quota rather than a list, and not to dodge the page cap of REQ-NFR-010: there are
        exactly four quotas and there will be exactly four tomorrow, so a cursor would page a set that
        cannot grow. A key is also what a client wants — it reads one quota, not the third element.
      operationId: quotas
      parameters:
      - description: the tenant, which must be the session's
        in: path
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/QuotaState'
                type: object
          description: one entry per quota, with what is used and what is permitted
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
            application/problem+json:
