  /api/v1/tenants/{tenantId}:
    delete:
      description: |-
        Asks for the tenant to be erased (REQ-TEN-011, REQ-PRIV-005).

        Answered `202`: nothing is erased, and for thirty days nothing will be. The tenant
        stops answering at once — 05 §5.9's "access blocked immediately, data still present" — and the
        answer carries the token that withdraws the request and the instant the erasure begins.

        The token comes back in the response because that is the only way it reaches anybody where
        `plugin-smtp` is not installed, which a `minimal` installation is by design. Where
        it is, the same link goes out by mail.

        `REQ-SEC-021` requires the second factor to be confirmed again for an operation like
        this one. It is wired in with the second factor itself; until then the permission and the
        owner's session are what stands in front of it, and no release ships without the rest.
      operationId: requestDeletion
      parameters:
      - description: the tenant, which must be the session's
        in: path
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
          description: the revocation token and when the erasure begins
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
