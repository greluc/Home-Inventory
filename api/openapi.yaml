        schema:
          format: uuid
          type: string
      - description: the tag that absorbs it
        in: path
        name: targetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagView'
          description: the target, now carrying both sets of assignments
        '401':
          content:
            application/problem+json:
