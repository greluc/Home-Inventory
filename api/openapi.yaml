    PasskeyRegistrationRequest:
      description: What finishes a passkey registration.
      properties:
        credential:
          description: what `navigator.credentials.create()` produced, as JSON
          maxLength: 20000
          minLength: 0
          type: string
        label:
          description: what to call this authenticator, or null
          maxLength: 100
          minLength: 0
          type: string
      required:
      - credential
      type: object
    PasskeyView:
      description: One registered passkey.
      properties:
        id:
          description: the credential, for removing it
          format: uuid
          type: string
        label:
          description: what the person called it
          type: string
        lastUsedAt:
          description: when it was last used, or null
          format: date-time
          type: string
        registeredAt:
          description: when it was registered
          format: date-time
          type: string
      type: object
    PasswordResetCompletion:
      description: The body of a redemption.
      properties:
        password:
          description: the new password
          maxLength: 200
          minLength: 0
          type: string
        token:
          description: what the message carried
          maxLength: 500
          minLength: 0
          type: string
      required:
      - password
      - token
      type: object
    PasswordResetRequest:
      description: The body of a reset request.
      properties:
        email:
          description: the address to send the link to
          maxLength: 320
          minLength: 0
          type: string
      required:
      - email
      type: object
    PluginView:
      description: One installed plugin, as this tenant sees it.
      properties:
        capabilities:
          description: |-
            everything its manifest asks for, each with whether this tenant agreed.
            Both halves together, because "what it wants" without "what it has" is not a decision
            anybody can take
          items:
            $ref: '#/components/schemas/CapabilityView'
          type: array
        contract:
          description: the contract range it supports
          type: string
        disabled:
          description: whether it is out of service
          type: boolean
        id:
          description: the reverse-domain id
          type: string
        name:
          description: what a person sees
          type: string
        registeredAt:
          description: when it was first seen
          format: date-time
          type: string
        runtime:
          description: '`out-of-process` or `in-process`'
          type: string
        signed:
          description: |-
            whether the operator verified its signature. An unsigned plugin runs only where
            they allowed it, and a client shows that permanently (REQ-PLG-004)
          type: boolean
        vendor:
          description: who publishes it
          type: string
        version:
          description: the plugin's own version
          type: string
      type: object
    Problem:
      additionalProperties: true
      description: 'An error, as RFC 9457 describes one. A client branches on `type` and never on `detail`:
        the URI is stable and documented under `api/problems/`, the prose is not and is translated (REQ-API-003).'
      properties:
        detail:
          description: What happened this time, in a sentence. Not stable; do not branch on it.
          type: string
        instance:
          description: The path of the request that failed.
          format: uri
          type: string
        status:
          description: The HTTP status, repeated in the body.
          format: int32
        title:
          description: The condition stable, human-readable name.
          type: string
        traceId:
          description: The identifier of this request in the server log. Quoting it in a report leads
            straight to the operation (REQ-NFR-042).
          type: string
        type:
          description: What went wrong, as an identifier. One of the tokens in `docs/reference/problem-types.yaml`,
            under `https://home-inv.example/problems/`. Fixed for the product rather than derived from
            a deployment hostname, so a client recognises it from every instance.
          format: uri
          type: string
      required:
      - status
      - title
      - type
    QuotaRequest:
      description: The body of a quota change.
      properties:
        permitted:
          description: |-
            how much the tenant may use. Zero is legal and means "none for now"; there is
            no way to say "unlimited", because an unbounded quota is not a quota
          format: int64
          minimum: 0
          type: integer
      type: object
    QuotaState:
      description: Where a tenant stands in one quota.
      properties:
        permitted:
          description: how much is allowed
          format: int64
          type: integer
        used:
          description: how much is in use now
          format: int64
          type: integer
      type: object
    RecoveryCodesView:
      description: The recovery codes, readable this once.
      properties:
        codes:
          description: ten single-use codes
          items:
            type: string
          type: array
      type: object
    RelationRequest:
      description: |-
        The body of a relation.

        *Its Javadoc sat above `MaintenanceRequest` rather than above this record until 2026-09-16,
        so this one had none and that one had two.*
      properties:
        targetId:
          description: the item this one points at
          format: uuid
          type: string
        type:
          description: '`ACCESSORY_OF`, `PART_OF`, `REPLACEMENT_FOR` or `RELATED`'
          maxLength: 20
          minLength: 0
          type: string
      required:
      - targetId
      - type
      type: object
    RelationView:
      description: One relation, as the item at either end sees it.
      properties:
        id:
          description: the relation
          format: uuid
          type: string
        inbound:
          description: |-
            whether the item that was asked is the TARGET rather than the source. A client
            renders "accessories" for one and "accessory of" for the other, from the same row
          type: boolean
        sourceId:
          description: the item the relation is stated from
          format: uuid
          type: string
        targetId:
          description: the item it points at
          format: uuid
          type: string
        type:
          description: what kind of relation
          enum:
          - ACCESSORY_OF
          - PART_OF
          - REPLACEMENT_FOR
          - RELATED
          type: string
      type: object
    ReminderRuleView:
      description: A stored rule.
      properties:
        channelKey:
          description: which channel
          type: string
        enabled:
          description: whether it fires
          type: boolean
        id:
          description: its id
          format: uuid
          type: string
        name:
          description: what a person calls it
          type: string
        offsetDays:
          description: days relative to the trigger's date
          format: int32
          type: integer
        savedSearchId:
          description: which things it watches, or `null` for all of them
          format: uuid
          type: string
        trigger:
          description: which date or condition it watches
          enum:
          - WARRANTY_EXPIRY
          - MAINTENANCE_DUE
          - LOAN_DUE
          - MINIMUM_STOCK
          - LICENCE_EXPIRY
          - STOCKTAKE_DISCREPANCY
          type: string
        updatedAt:
          description: when it last changed
          format: date-time
          type: string
        version:
          description: for `If-Match`
          format: int64
          type: integer
      type: object
    RenameLocationRequest:
      description: The body of a rename.
      properties:
        name:
          description: the new name
          maxLength: 300
          minLength: 0
          type: string
      required:
      - name
      type: object
    Report:
      description: One report.
      properties:
        converted:
          description: |-
            always `false`, and present rather than implied: REQ-LIFE-017 asks the
            report to **state** that no conversion took place, and a field a client can render is a
            statement where a missing field is an assumption
          type: boolean
        currencies:
          description: |-
            every currency that appears anywhere in the report, so a client can lay out
            columns before reading a row
          items:
            type: string
          type: array
        dimension:
          description: '`location`, `type` or `tag`'
          type: string
        overlapping:
          description: |-
            whether a thing can appear in more than one row, which is true of tags and
            false of locations and types. A reader who adds up an overlapping column gets a number
            that means nothing, and this is what warns them
          type: boolean
        rows:
          description: one per group, largest first by the figure that is present
          items:
            $ref: '#/components/schemas/Row'
          type: array
      type: object
    ReturnRequest:
      description: The body of a return (REQ-LIFE-005).
      properties:
        returnedOn:
          description: when it came back; never before the handover, which the database checks
          format: date
          type: string
      required:
      - returnedOn
      type: object
    RevisionView:
      description: One entry of a history.
      properties:
        changedAt:
          description: when
          format: date-time
          type: string
        changedBy:
          description: who, or `null` where a system process made the change
          format: uuid
          type: string
        kind:
          description: what happened
          enum:
          - CREATED
          - UPDATED
          - TRASHED
          - RESTORED
          - PURGED
          type: string
        revision:
          description: this entry's number in the entity's history, counting from one
          format: int64
          type: integer
        snapshot:
          description: the state it produced, as JSON text
          type: string
      type: object
    RevokedView:
      description: The tenant that is answering again.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        state:
          description: its state, which is `ACTIVE` by the time this is returned
          type: string
      type: object
    RoleReference:
      description: A role a rule is about.
      properties:
        role:
          description: the built-in role's name, or null
          type: string
        roleDefinitionId:
          description: the tenant-owned role, or null
          format: uuid
          type: string
      type: object
    RoleRequest:
      description: The body of a role change.
      properties:
        role:
          description: |-
            one of `OWNER`, `ADMIN`, `MEMBER`, `CONTRIBUTOR`,
            `VIEWER`, `GUEST`. A name this build does not know grants nothing and is
            refused
          maxLength: 32
          minLength: 0
          type: string
        roleDefinitionId:
          description: |-
            a tenant-owned role extending it (REQ-TEN-006), or omitted for a plain
            built-in role. Where it is given it decides the base, and `role` is ignored
          format: uuid
          type: string
        scopeLocationId:
          description: |-
            a location to confine them to (REQ-TEN-007), or omitted for the whole
            tenant
          format: uuid
          type: string
      required:
      - role
      type: object
    RoleView:
      description: A tenant-owned role.
      properties:
        baseRole:
          description: the built-in role it extends
          type: string
        description:
          description: what it is for, or null
          type: string
        effectivePermissions:
          description: |-
            everything it holds, base included — so a client can show what a
            role means without re-implementing the ladder
          items:
            type: string
          type: array
        id:
          description: the definition
          format: uuid
          type: string
        name:
          description: what the tenant calls it
          type: string
        permissions:
          description: the ids it adds
          items:
            type: string
          type: array
      type: object
    Row:
      description: One group's figures.
      properties:
        id:
          description: the location, type or tag
          format: uuid
          type: string
        label:
          description: what to call it, in the tenant's own words
          type: string
        own:
          $ref: '#/components/schemas/Figures'
          description: the totals for things directly in this group
        ownCount:
          description: how many things are directly in this group
          format: int64
          type: integer
        subtree:
          $ref: '#/components/schemas/Figures'
          description: |-
            the totals including everything beneath it; equal to `own` where the
            dimension has no tree
        subtreeCount:
          description: how many including everything beneath it
          format: int64
          type: integer
      type: object
    RuleRequest:
      description: The body of a reminder rule (REQ-NOTI-001).
      properties:
        channelKey:
          description: which channel, as a plugin manifest names it
          maxLength: 60
          minLength: 0
          type: string
        enabled:
          description: whether it fires; absent means it does
          type: boolean
        name:
          description: what a person calls it
          maxLength: 200
          minLength: 0
          type: string
        offsetDays:
          description: |-
            days relative to the trigger's date: **positive warns early** (14 is a
            fortnight before a warranty ends), **negative waits until after** (-1 fires the day
            after a loan was due), zero fires on the day. Stored as zero for a trigger that has no
            date, so the screen and the behaviour agree
          format: int32
          maximum: 365
          minimum: -365
          type: integer
        savedSearchId:
          description: which things to watch, or absent for everything the trigger finds
          format: uuid
          type: string
        trigger:
          description: |-
            which date or condition it watches. Only a trigger this installation serves is
            accepted; `GET /triggers` says which those are
          enum:
          - WARRANTY_EXPIRY
          - MAINTENANCE_DUE
          - LOAN_DUE
          - MINIMUM_STOCK
          - LICENCE_EXPIRY
          - STOCKTAKE_DISCREPANCY
          type: string
      required:
      - channelKey
      - name
      - trigger
      type: object
    SavedSearchRequest:
      properties:
        filters:
          items:
            maxLength: 200
            minLength: 0
            type: string
          maxItems: 20
          minItems: 0
          type: array
        name:
          maxLength: 200
          minLength: 0
          type: string
        q:
          maxLength: 500
          minLength: 0
          type: string
        sort:
          maxLength: 100
          minLength: 0
          type: string
      required:
      - name
      type: object
    SavedSearchResponse:
      description: |-
        A saved search as the wire spells it.

        The same names a query takes: `q`, `filters`, `sort`. The port's view
        calls the first one `text`, which is what it is; here it is what a client typed, and a
        client that sends `q` and is answered `text` cannot put a saved search back into
        the query bar without translating it.
      properties:
        createdAt:
          description: when it was saved
          format: date-time
          type: string
        filters:
          description: the `filter` parameters verbatim
          items:
            type: string
          type: array
        id:
          description: its identifier
          format: uuid
          type: string
        name:
          description: what it is called
          type: string
        q:
          description: the text to search for, or `null`
          type: string
        sort:
          description: the sort key, or `null`
          type: string
        updatedAt:
          description: when it last changed
          format: date-time
          type: string
        version:
          description: the optimistic-lock version, which is also its ETag
          format: int64
          type: integer
      type: object
    SecondFactorRequest:
      description: |-
        The body of a second-factor answer: a code, or a passkey assertion.

        Exactly one of the two. One body for both because the question is the same one — "prove the
        second factor" — and a client that had to choose an endpoint would be a client that has to know
        which kinds this account has before it asks.
      properties:
        code:
          description: |-
            the six digits from the authenticator app, or one of the recovery codes, or null
            when a passkey is answering. Bounded because it reaches an Argon2id comparison, where an
            unbounded field is an invitation to spend 19 MiB on a megabyte of nothing
          maxLength: 64
          minLength: 0
          type: string
        credential:
          description: |-
            what `navigator.credentials.get()` produced, as JSON, or null when a
            code is answering. Bounded generously: an assertion carries a signature, client data and
            the authenticator's own bytes
          maxLength: 20000
          minLength: 0
          type: string
        passkey:
          description: Whether a passkey is answering.
          type: boolean
      type: object
    ServiceAccountRequest:
      description: What a new service account needs.
      properties:
        description:
          description: what it is for, or null
          maxLength: 1000
          minLength: 0
          type: string
        expiresAt:
          description: |-
            when it stops working. Required — REQ-AUTH-010 asks for an expiry date, and a
            machine credential nobody reviews is one nobody revokes
          format: date-time
          type: string
        name:
          description: what to call it, so a list of tokens is a list somebody can act on
          maxLength: 200
          minLength: 0
          type: string
        role:
          description: the built-in role it holds, one of the six names
          maxLength: 20
          minLength: 0
          type: string
        roleDefinitionId:
          description: a tenant-owned role extending it (REQ-TEN-006), or null
          format: uuid
          type: string
      required:
      - expiresAt
      - name
      - role
      type: object
    ServiceAccountView:
      description: A service account as its tenant sees it.
      properties:
        description:
          description: what it is for, or null
          type: string
        expiresAt:
          description: when it stops working
          format: date-time
          type: string
        id:
          description: the account
          format: uuid
          type: string
        lastUsedAt:
          description: when it last authenticated, or null when it never has
          format: date-time
          type: string
        name:
          description: what it is called
          type: string
        role:
          description: the built-in role it holds
          type: string
        roleDefinitionId:
          description: the tenant-owned role extending it, or null
          format: uuid
          type: string
      type: object
    SessionView:
      description: |-
        Who the caller is after the switch.

        The same shape `GET /api/v1/auth/me` answers with, so a client has one type for "the
        session" however it changed.
      properties:
        email:
          description: the address they signed in with
          type: string
        locale:
          description: their interface language
          type: string
        role:
          description: the role they hold in the new tenant
          type: string
        tenantId:
          description: the tenant this session now acts for
          format: uuid
          type: string
        userId:
          description: the person
          format: uuid
          type: string
      type: object
    SettingRequest:
      description: The value to store.
      properties:
        value:
          description: the value as text, of the type the manifest declares
          maxLength: 4096
          minLength: 0
          type: string
      required:
      - value
      type: object
    SettingView:
      description: One setting a plugin declares, with what this tenant made of it.
      properties:
        defaultValue:
          description: what applies when nothing is set here, or null
          type: string
        key:
          description: the manifest's key
          type: string
        label:
          additionalProperties:
            type: string
          description: what a person sees, by language tag — multilingual data, like a field label
          type: object
        required:
          description: whether the plugin says it cannot work without one
          type: boolean
        set:
          description: whether a value is stored, which is all a surface learns about a secret
          type: boolean
        type:
          description: '`string`, `secret`, `enum`, `integer` or `boolean`'
          type: string
        value:
          description: what this tenant set, and **always null for a secret**
          type: string
        values:
          description: the choices, for an `enum`; empty otherwise
          items:
            type: string
          type: array
      type: object
    SwitchTenantRequest:
      description: The body of a switch.
      properties:
        tenantId:
          description: |-
            the tenant to act for. Must be one the caller is a member of; anything else is
            answered as though it did not exist
          format: uuid
          type: string
      required:
      - tenantId
      type: object
    TagGroupRequest:
      description: The body of a group creation.
      properties:
        displayOrder:
          description: where the group sits among the others
          format: int32
          type: integer
        exclusive:
          description: whether a thing may carry only one tag of this group
          type: boolean
        key:
          description: the stable key
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the group's name per language tag
          type: object
      required:
      - key
      type: object
    TagGroupView:
      description: A group of tags — "condition", "room", "owner" (REQ-CORE-061).
      properties:
        displayOrder:
          description: where the group sits among the others on a form
          format: int32
          type: integer
        exclusive:
          description: |-
            whether a thing may carry only one tag of this group. "Condition" is one of new,
            used or broken; a thing that was both would be a thing whose condition nobody can read
          type: boolean
        id:
          description: the group
          format: uuid
          type: string
        key:
          description: the stable key, which is what an import or an export names
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the group's name per language tag, as the tenant wrote it. Multilingual data rather
            than interface text: the server cannot translate a word a tenant invented (REQ-NFR-032)
          type: object
      type: object
    TagRequest:
      description: The body of a tag creation or change.
      properties:
        colour:
          description: '`#rrggbb`, or omitted'
          maxLength: 7
          minLength: 0
          type: string
        groupId:
          description: the group it belongs to, or omitted
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        name:
          description: the name a person reads and types
          maxLength: 120
          minLength: 0
          type: string
      required:
      - name
      type: object
    TagView:
      description: A tag as everything outside this block sees it.
      properties:
        colour:
          description: '`#rrggbb`, or `null` when the tenant chose none (REQ-CORE-062)'
          type: string
        groupId:
          description: the group it belongs to, or `null`
          format: uuid
          type: string
        icon:
          description: an icon name for clients, or `null`
          type: string
        id:
          description: the tag
          format: uuid
          type: string
        mergedInto:
          description: |-
            what this tag became, or `null` while it is itself. A tag with a value
            here is a tombstone: it is offered nowhere, carries nothing, and exists so a client holding
            its id is redirected rather than told the tag never existed (REQ-CORE-063)
          format: uuid
          type: string
        name:
          description: the name a person reads, unique per tenant among the live ones
          type: string
      type: object
    TemplateList:
      description: |-
        The templates this build ships.

        No cursor and no page, and that is not an oversight: the set is fixed by the release, the
        same for every tenant, and eight entries long. A cursor here would be a cursor over a constant.
      properties:
        templates:
          description: the templates, in the order the shipped file lists them
          items:
            $ref: '#/components/schemas/TemplateView'
          type: array
      type: object
    TemplateView:
      description: One shipped template, as a picker shows it.
      properties:
        fieldCount:
          description: |-
            how many fields it brings, so a person can tell a starting point from a
            catalogue before importing one
          format: int32
          type: integer
        key:
          description: the template's key, which becomes the type's key on import
          type: string
        kind:
          description: whether its items exist physically
          enum:
          - PHYSICAL
          - DIGITAL
          type: string
        labels:
          additionalProperties:
            type: string
          description: its name per language tag
          type: object
      type: object
    TenantMembershipView:
      description: One of the caller's memberships.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name, which is what a switcher shows
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    TenantStateView:
      description: A tenant's state.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        state:
          description: '`ACTIVE`, `SUSPENDED` or `PENDING_DELETION`'
          type: string
      type: object
    TenantView:
      description: A tenant as its member sees it.
      properties:
        id:
          description: the tenant
          format: uuid
          type: string
        name:
          description: its display name
          type: string
        role:
          description: the role the caller holds in it
          type: string
      type: object
    TotpEnrolmentView:
      description: A secret that has just been generated.
      properties:
        provisioningUri:
          description: the `otpauth://` URI a QR code carries
          type: string
        secret:
          description: the shared secret in base32, for somebody typing it in by hand
          type: string
      type: object
    UpdateCategoryRequest:
      description: |-
        What to change about a location category.

        Replaced whole, every field of it: a partial body would make removing a translation
        impossible, since there is no spelling for "drop this language" in a merge.
      properties:
        icon:
          description: an icon name for clients, or omitted
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the name per language tag; omitted or empty leaves it nameless and a client falls
            back to translating the key
          type: object
        mobile:
          description: whether its places travel with their contents
          type: boolean
      type: object
    UpdateItemRequest:
      description: 'The body of an update. `kind` is absent: a physical item does not become a digital
        one.'
      properties:
        attributes:
          description: |-
            the new attribute set as a JSON object, checked against the version the item
            was written against rather than against whatever the type says today
          maxLength: 65536
          minLength: 0
          type: string
        description:
          description: the new description
          maxLength: 20000
          minLength: 0
          type: string
        locationId:
          description: the new location; required while the item is physical
          format: uuid
          type: string
        maintenanceIntervalDays:
          description: |-
            how often it needs servicing, in days, or omitted when
            nothing should remind about it (REQ-LIFE-004). Days and not months, because "every 3
            months from 31 January" has no answer that is not a surprise to somebody
          format: int32
          maximum: 3650
          minimum: 1
          type: integer
        minimumStock:
          description: the new restocking level, or omitted to stop tracking one
          minimum: 0
          type: number
        name:
          description: the new name
          maxLength: 500
          minLength: 0
          type: string
        notes:
          description: the new notes; HTML is removed before they are stored
          maxLength: 20000
          minLength: 0
          type: string
        quantity:
          description: the new quantity; `null` means one
          minimum: 0
          type: number
        quantityUnit:
          description: the new unit
          maxLength: 30
          minLength: 0
          type: string
        valuation:
          $ref: '#/components/schemas/ValuationRequest'
          description: what it cost, what covers it and what replacing it would cost, or omitted
      required:
      - name
      type: object
    UpdateItemTypeRequest:
      description: What to change about an item type.
      properties:
        icon:
          description: the icon, or null to clear it
          maxLength: 64
          minLength: 0
          type: string
        usefulLifeMonths:
          description: |-
            how long a thing of this type is expected to last, for the
            straight-line depreciation of REQ-LIFE-009, or null for a type that is not depreciated.
            Nothing ships with one: how long a household's furniture lasts is a judgement about that
            household, and a figure this application invented would end up in somebody's insurance
            report. Clearing it takes the depreciated values with it on the next run
          format: int32
          maximum: 1200
          minimum: 1
          type: integer
      type: object
    Valuation:
      description: |-
        What an item cost, what covers it, and what it would cost to replace (REQ-LIFE-001/002/014).

        ## Three figures, never derived from one another

        `REQ-LIFE-014` says it about the replacement value in as many words — "independent of
        the current value and never derived from it" — and it holds for all three. A camera bought for
        900 may be worth 200 second-hand and cost 1,100 to buy new today; an insurer asks for the third
        number, a seller for the second and the tax office for the first. Each carries its own as-of
        date, because a valuation without one is a number of unknown age.

        Columns on the item rather than fields of a type version, decided with the owner on
        2026-09-13: `REQ-LIFE-015` asks for totals per location, type and tag across *every*
        type, and an attribute exists only where its type happened to declare it, under whatever name
        that type chose.
      properties:
        currentValue:
          $ref: '#/components/schemas/MoneyJson'
          description: what it is worth now, or `null` (REQ-LIFE-009)
        currentValueAsOf:
          description: the day that figure was true, or `null`
          format: date
          type: string
        currentValueSource:
          description: |-
            who says so — {@link Provenance#MANUAL Provenance#MANUAL}, {@link de.greluc.homeinv.inventory.api.Valuation      Provenance#DEPRECIATION} or {@link Provenance#PLUGIN Provenance#PLUGIN} — or `null`. Not decoration: the
            refresh run rewrites only what it wrote, so a figure somebody typed survives the night
          enum:
          - MANUAL
          - DEPRECIATION
          - PLUGIN
          type: string
        lifetimeWarranty:
          description: |-
            whether it is covered for life, in which case `warrantyUntil` is
            `null`. A flag rather than a date far in the future, because "2099-12-31" is a date
            somebody would eventually have to explain
          type: boolean
        purchase:
          $ref: '#/components/schemas/MoneyJson'
          description: what it cost, or `null`
        purchaseSource:
          description: |-
            where from — a shop, a person, a listing — or `null`. Free text: an
            invoice is an attachment like any other and needs no field of its own
          type: string
        purchasedOn:
          description: when it was bought, or `null`
          format: date
          type: string
        replacement:
          $ref: '#/components/schemas/MoneyJson'
          description: what it would cost to replace, or `null`
        replacementAsOf:
          description: the day that figure was true, or `null`
          format: date
          type: string
        replacementSource:
          description: |-
            who said so — {@link Provenance#MANUAL Provenance#MANUAL} or {@link Provenance#PLUGIN Provenance#PLUGIN} —
            or `null`
          enum:
          - MANUAL
          - DEPRECIATION
          - PLUGIN
          type: string
        warrantyUntil:
          description: when the warranty ends, or `null`
          format: date
          type: string
      type: object
    ValuationRequest:
      description: |-
        What an item cost, what covers it and what replacing it would cost (REQ-LIFE-001/002/014).

        Replaced whole rather than merged, like the attributes and for the same reason: a figure
        left out is one deliberately cleared, and under a merge "remove the purchase price" would have
        no spelling at all.

        Each amount is `{"amount":"49.90","currency":"EUR"`} — a string, never a JSON number,
        because a number is a `double` by the time it has been through a browser.
      properties:
        currentValue:
          $ref: '#/components/schemas/MoneyJson'
          description: what it is worth now, or omitted
        currentValueAsOf:
          description: the day that figure was true
          format: date
          type: string
        lifetimeWarranty:
          description: |-
            whether it is covered for life, in which case `warrantyUntil`
            must be omitted: both is two answers to one question and is refused
          type: boolean
        purchase:
          $ref: '#/components/schemas/MoneyJson'
          description: what it cost, or omitted
        purchaseSource:
          description: where from — a shop, a person, a listing
          maxLength: 300
          minLength: 0
          type: string
        purchasedOn:
          description: when it was bought, or omitted
          format: date
          type: string
        replacement:
          $ref: '#/components/schemas/MoneyJson'
          description: what replacing it would cost, or omitted
        replacementAsOf:
          description: the day that figure was true
          format: date
          type: string
        replacementSource:
          description: '`MANUAL` or `PLUGIN`'
          enum:
          - MANUAL
          - DEPRECIATION
          - PLUGIN
          type: string
        warrantyUntil:
          description: when the warranty ends, or omitted
          format: date
          type: string
      type: object
    ValueListEntryView:
      description: One permitted value.
      properties:
        archived:
          description: whether it is still offered for new input
          type: boolean
        displayOrder:
          description: its position
          format: int32
          type: integer
        id:
          description: the entry
          format: uuid
          type: string
        labels:
          additionalProperties:
            type: string
          description: its readable form per language tag
          type: object
        value:
          description: what is stored in an item's attributes
          type: string
      type: object
    ValueListView:
      description: A value list with its entries.
      properties:
        entries:
          description: its entries in display order, archived ones included
          items:
            $ref: '#/components/schemas/ValueListEntryView'
          type: array
        id:
          description: the list
          format: uuid
          type: string
        key:
          description: its stable key
          type: string
        labels:
          additionalProperties:
            type: string
          description: its name per language tag
          type: object
      type: object
    VersionView:
      description: One version and the fields it declares.
      properties:
        fields:
          description: every field, in display order, inherited ones included once published
          items:
            $ref: '#/components/schemas/FieldDefinitionView'
          type: array
        id:
          description: the version
          format: uuid
          type: string
        ownerId:
          description: the item type or location category it belongs to
          format: uuid
          type: string
        published:
          description: whether it is frozen and referenceable
          type: boolean
        versionNumber:
          description: its position in that owner's series, starting at one
          format: int32
          type: integer
      type: object
    VisibilityRequest:
      description: The one condition that decides whether a client shows a field.
      properties:
        field:
          description: the key of the field watched
          maxLength: 64
          minLength: 0
          type: string
        operator:
          description: '`equals`, `notEquals`, `present` or `absent`'
          maxLength: 16
          minLength: 0
          type: string
        value:
          description: the JSON text compared against, for the two operators that compare
          maxLength: 256
          minLength: 0
          type: string
      required:
      - field
      - operator
      type: object
    VisibilityRule:
      description: |-
        When a field is shown: one condition, over one other field of the same item (REQ-CORE-028).

        ## Why it is this small

        ADR-0020 permits "a simple condition over another field of the same item" and gives the example
        that decides the shape: show `warrantyUntil` when `hasWarranty` is true. It permits no
        conjunction, no nesting and no reference to a second item — because each of those is a step toward
        an expression language that would have to evaluate identically in Java, TypeScript and Kotlin, and
        the line against that is the core of that decision.

        A rule is presentation only. A hidden field is not cleared, not exempted from `required`
        and not removed from the generated schema: hiding a value is not the same as not having one, and a
        schema that changed shape with the data would be a schema a client could not cache.
      properties:
        field:
          description: |-
            the key of the field this one watches, which must be another field of the same type
            version — a rule pointing at itself is a refused definition
          type: string
        operator:
          description: how the watched value is compared
          enum:
          - EQUALS
          - NOT_EQUALS
          - PRESENT
          - ABSENT
          type: string
        value:
          description: |-
            what it is compared against, as the JSON text of a scalar (`true`, `3`,
            `"new"`). Ignored by {@link Operator#PRESENT Operator#PRESENT} and {@link Operator#ABSENT Operator#ABSENT}
          type: string
      type: object
info:
  contact:
    email: lucas.greuloch@gmail.com
    name: Lucas Greuloch (greluc)
    url: https://github.com/greluc/Home-Inventory
  description: |-
    The HTTP surface of a self-hosted Home Inventory instance.

    This document is generated from the implementation and committed (ADR-0049); it describes what the code does rather than what it was meant to do. Errors follow RFC 9457 on every endpoint, and a client branches on the `type` URI, which is registered in `docs/reference/problem-types.yaml` and documented under `api/problems/` (REQ-API-003).

    Paths are versioned. Within a major version a field may be added and an optional one may appear, and nothing a client already reads changes meaning (REQ-API-008).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: Home Inventory API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: |-
        Verifies credentials and establishes a session.

        Any session that existed before the login is invalidated and a new one created. That is what
        prevents session fixation: an id an attacker planted beforehand is never the id the
        authenticated session ends up with.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: the credentials
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: who the caller now is
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor required (`second-factor-required`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Rate limited (`rate-limited`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Verifies credentials and establishes a session
  /api/v1/auth/logout:
    post:
      description: |-
        Ends the session.

        Always `204`, whether or not there was a session. A client cleaning up after itself
        should not have to care, and the answer says nothing about whether the caller was logged in.
      operationId: logout
      responses:
        '204':
          description: No Content
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Ends the session
  /api/v1/auth/me:
    get:
      description: Who the caller is.
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: the session view
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Who the caller is.
  /api/v1/auth/mfa:
    post:
      description: |-
        Answers the second factor and finishes the login (REQ-AUTH-002).

        The pending login is consumed whether or not the code is right: a wrong one costs the
        password again. An attacker holding a stolen cookie therefore gets one guess per password,
        rather than as many as they like against a session that keeps waiting.
      operationId: completeLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
        description: the code, which may be a TOTP code or a recovery code
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          description: who the caller now is
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`), or Second factor invalid (`second-factor-invalid`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Answers the second factor and finishes the login (REQ-AUTH-002)
  /api/v1/auth/mfa/enrolment:
    get:
      description: |-
        What the caller's account holds.

        /**
        What the caller's account holds.
      operationId: enrolment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentView'
          description: the enrolment
        '401':
          content:
            application/problem+json:
