          description: Not acceptable (`not-acceptable`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The sessions this account has open (REQ-AUTH-009)
  /api/v1/me/sessions/{handle}:
    delete:
      description: |-
        Ends one session remotely (REQ-AUTH-009).

        Immediately, not within the ten minutes the requirement allows: the session is removed from
        the store every request reads, so the next request that device makes has none.

        Ending the current one is allowed and is simply a sign-out — refusing it would be a rule to
        explain for no benefit, since the caller can sign out anyway.
