  /api/v1/auth/mfa/totp:
    post:
      description: |-
        Begins a TOTP enrolment.

        The secret is returned **once**, here, and is unreadable afterwards: it is sealed under
        the instance's credential key before it is stored. A client that loses it asks again, which
        replaces the unconfirmed enrolment.
      operationId: beginTotp
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolmentView'
