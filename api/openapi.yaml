  /api/v1/me/sessions:
    get:
      description: |-
        The sessions this account has open (REQ-AUTH-009).

        Every device that is signed in, most recently seen first, each with a handle that stands in
        for its session id. The id itself is never returned: it is what the cookie carries, so a list
        of them would be a list of working credentials.

        Bounded like every other collection (`REQ-NFR-010`), and the bound is on the answer rather
        than on a query: the store returns one account's sessions and there is no stable order to page
        through. Somebody with more open sessions than the limit sees the most recently used ones,
        which are the ones a person deciding what to end is looking for.
      operationId: sessions
      parameters:
      - description: how many at most; capped at 200
        in: query
        name: limit
        required: false
        schema:
          default: 50
          exclusiveMinimum: 0
          format: int32
          maximum: 200
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OpenSession'
                type: array
          description: the open sessions
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '405':
          content:
            application/problem+json:
              schema:
