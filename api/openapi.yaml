  /api/v1/items:
    get:
      description: |-
        The tenant's items, filtered by a query (REQ-SRCH-001, 08 §8.2).

        On the collection and not on a path of its own. A search is a view of the items, so it
        answers where the items are — which is what the chapter has described since the first commit,
        while the implementation answered at `/api/v1/search` until 2026-09-14. The old path is
        gone rather than aliased: two paths for one question is the drift this chapter exists to
        prevent, and a saved search lives at `/saved-searches`, where 08 §8.1 has always put it.

        The grammar arrives in pieces. `q`, `filter`, `facet`, `sort`, `cursor` and `limit` work;
        `fields` is not here yet. A parameter that is not implemented is absent rather than accepted
        and ignored, because silently ignoring a filter is how somebody ships a report over the wrong
        rows.

        `SEARCH_QUERY` and not `ITEM_READ`: a listing is an enumeration surface whether
        or not it carries a query, and reading one thing you were pointed at is a different capability
        from finding out what exists. `GUEST` holds the first and not the second.
      operationId: listItems
      parameters:
      - description: what to look for; omitted lists everything, paged the same way
        in: query
        name: q
        required: false
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - description: '`de` or `en`, deciding which generated vector is searched'
        in: query
        name: language
        required: false
        schema:
          default: de
          maxLength: 5
          minLength: 0
          type: string
      - description: |-
          which dimensions to count beside the rows, comma-separated:
          `facet=tag,location`. Each is counted without its own filter, so a sidebar still
          shows where one could click next (REQ-SRCH-002)
        in: query
        name: facet
        required: false
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - description: |-
          what to order by, a leading minus for descending: `-updatedAt`, `name`,
          `attr.manufacturer`. One key only — several are refused rather than reduced to the
          first (REQ-SRCH-004). Omitted returns the default order, oldest first
        in: query
        name: sort
        required: false
        schema:
          maxLength: 100
          minLength: 0
          type: string
      - description: an opaque cursor from a previous response, or omitted for the first page
        in: query
        name: cursor
        required: false
        schema:
          maxLength: 500
          minLength: 0
          type: string
      - description: how many at most
        in: query
        name: limit
        required: false
        schema:
          default: 50
          exclusiveMinimum: 0
          format: int32
          maximum: 200
          type: integer
      - description: 'A condition, repeatable and conjunctive - every one given must hold, while `in`
          widens within a single one. Four dimensions: `attr.<key>` for a field the type marks searchable,
          `type` for a type key, `tag` for a tag name and `location` for a location id. The operator may
          be left out for equality, so `type:power-tool` and `tag:in:broken,repair` read as they look;
          `location:subtree:<uuid>` takes a place and everything under it. An attribute additionally takes
          `gt`, `gte`, `lt` and `lte`, and a range over a field that carries a unit names it last - `attr.purchasePrice:gte:100:EUR`
          - and is refused without it.'
        in: query
        name: filter
        schema:
          items:
            maxLength: 200
            type: string
          maxItems: 20
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageItemView'
          description: one page of items
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden (`forbidden`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: The tenant's items, filtered by a query (REQ-SRCH-001, 08 §8
    post:
      description: |-
        Creates an item, or returns the one that is already there.

        `201` when this request created it, `200` when an identical creation had already
        happened — which is what makes a client's retry safe (REQ-CORE-001). A different item under the
        same id is a `409`.
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
        description: the item to create
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemView'
          description: An identical item already existed under this id; this is that item.
        '201':
