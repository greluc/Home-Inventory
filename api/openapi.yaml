          minimum: 0
          type: integer
      type: object
    FieldConstraints:
      description: |-
        The declarative limits a field puts on its values — the whole of them (ADR-0020).

        Every member is expressible in JSON Schema and evaluable with the value in hand, which is what
        lets a client offline reach the same verdict as the server (REQ-CORE-027). There is deliberately
        nothing here that reads another item, calls out, or evaluates an expression: those are the three
        things ADR-0020 excludes, and the place they belong is a plugin.

        A `null` member is no constraint at all. A record rather than a map, so that a typo in a
        constraint name is a refused field definition rather than a limit that silently does nothing.
      properties:
        empty:
          description: Whether this declares no limit whatsoever.
          type: boolean
        max:
          description: the largest permitted number, by the same rule
          type: number
        maxLength:
          description: |-
            the most characters. Absent, the 64 KiB ceiling on the whole attribute set is the
            only limit, which is a limit on the wrong thing
          format: int32
          type: integer
        min:
          description: |-
            the smallest permitted number, for `integer`, `decimal`, `money` and
            `quantity` — compared against the amount, never against the unit
          type: number
        minLength:
          description: the fewest characters, for the text-shaped kinds
          format: int32
          type: integer
        pattern:
          description: |-
            a regular expression the whole value must match, for `text`, `
            multiline`, `url`, `email` and `secret`. Anchored by the validator, so
            `[0-9]+` means the entire value and not a digit somewhere in it
          type: string
        referenceKind:
          description: what a `reference` field may point at
          enum:
          - ITEM
          - LOCATION
          - VALUE_LIST
          type: string
        unit:
          description: |-
            the one unit a `quantity` field accepts, or the one ISO 4217 code a `
            money` field accepts. Declaring it is what makes a total over the field meaningful:
            REQ-CORE-032 forbids a mixed-unit sum, and a field that accepts any unit can only be summed
            per unit
          type: string
      type: object
    FieldDefinitionView:
      description: |-
        One field of one type version, as everything outside `catalog` sees it.

        A view and not the entity (REQ-NFR-022): `inventory` needs to know that `
        purchasePrice` is money and is searchable; it has no business holding a row it could write back.
      properties:
        constraints:
          $ref: '#/components/schemas/FieldConstraints'
          description: |-
            the declarative limits, never `null` — {@link FieldConstraints#NONE FieldConstraints#NONE} when
            the definition carries none
        dataType:
          description: what kind of value it holds
          enum:
          - TEXT
          - MULTILINE
          - INTEGER
          - DECIMAL
          - MONEY
          - BOOLEAN
          - DATE
          - DATETIME
          - ENUM
          - MULTI_ENUM
          - URL
          - EMAIL
          - QUANTITY
          - REFERENCE
          - SECRET
          - FILE
          type: string
        defaultValue:
          description: the JSON text of the value a new item starts with, or `null`
          type: string
        deprecated:
          description: whether it is hidden from new input while its values remain (REQ-CORE-026)
          type: boolean
        displayOrder:
          description: the position within that group; ties are broken by key, so the order is total
          format: int32
          type: integer
        facetable:
          description: whether it is mirrored for counting
          type: boolean
        group:
          description: the form section the tenant put it in, or `null`
          type: string
        helpTexts:
          additionalProperties:
            type: string
          description: the explanatory line per language tag, empty when the tenant wrote none
          type: object
        id:
          description: the definition, stable across the life of the version it belongs to
          format: uuid
          type: string
        key:
          description: |-
            the attribute key — `isbn`, `purchasePrice` — which is what appears in
            `item.attributes` and in `item_attr_index.field_key`
          type: string
        labels:
          additionalProperties:
            type: string
          description: |-
            the field's name per language tag, as the tenant wrote it. Multilingual data rather
            than interface text: the server cannot translate a word a tenant invented (REQ-NFR-032)
          type: object
        required:
          description: |-
            whether a value must be present. A deprecated field is never required, whatever
            this says — see {@link de.greluc.homeinv.catalog.api.FieldDefinitionView#effectivelyRequired #effectivelyRequired()}
          type: boolean
        searchable:
          description: whether it is mirrored into the side table for filtering
          type: boolean
        sensitive:
          description: |-
            whether reading it needs a permission of its own and it is encrypted at rest
            (ADR-0019)
          type: boolean
        sortable:
          description: whether it is mirrored for ordering
          type: boolean
        valueListId:
          description: |-
            the list an `enum` or `multi-enum` draws from, `null`
            otherwise
          format: uuid
          type: string
        visibility:
          $ref: '#/components/schemas/VisibilityRule'
          description: |-
            the one condition that decides whether a client shows this field, or `
            null` when it is always shown
      type: object
    FieldRemovalPreview:
      description: What a field removal would destroy (REQ-CORE-026).
      properties:
        affected:
          description: how many items or locations carry a value under that key today
          format: int64
          type: integer
        fieldId:
          description: the field
          format: uuid
          type: string
        key:
          description: its attribute key
          type: string
      type: object
    FieldRequest:
      description: A field, as it is added or changed.
      properties:
        constraints:
          $ref: '#/components/schemas/ConstraintsRequest'
          description: the declarative limits
        dataType:
          description: the token of one of the sixteen kinds, for example `multi-enum`
          maxLength: 16
          minLength: 0
          type: string
        defaultValue:
          description: the JSON text of the starting value
          maxLength: 4096
          minLength: 0
          type: string
        displayOrder:
          description: the position within the group
          format: int32
          type: integer
        facetable:
          description: whether it is mirrored for counting
          type: boolean
        group:
          description: the form section
          maxLength: 64
          minLength: 0
          type: string
        helpTexts:
          additionalProperties:
            type: string
          description: the explanatory line per language tag
          type: object
        key:
          description: the attribute key; ignored when changing
          maxLength: 64
          minLength: 0
          type: string
        labels:
          additionalProperties:
            type: string
          description: the field's name per language tag; at least one
          type: object
        required:
          description: whether a value must be present
          type: boolean
        searchable:
          description: whether it is mirrored for filtering
          type: boolean
        sensitive:
          description: whether reading it needs a permission of its own
          type: boolean
        sortable:
          description: whether it is mirrored for ordering
          type: boolean
        valueListId:
          description: the list an enumeration draws from
          format: uuid
          type: string
        visibility:
