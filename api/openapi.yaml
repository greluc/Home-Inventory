              schema:
                $ref: '#/components/schemas/Problem'
          description: Second factor enrolled (`second-factor-enrolled`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Begins a TOTP enrolment
  /api/v1/auth/mfa/totp/confirmation:
    post:
      description: |-
        Confirms an enrolment with a code, and issues the recovery codes.

        The codes are returned **once**, here. They are stored as Argon2id hashes, so nothing —
        this application included — can show them again.
      operationId: confirmTotp
