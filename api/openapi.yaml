  /media/{tenantId}/{sha256}/{variant}:
    get:
      description: |-
        Serves the bytes of one variant, to whoever presents a valid signature.

        No session and no tenant context: the signature carries the authorisation, and the tenant is
        part of what it covers, so a URL cannot be replayed with a different tenant in the path.

        Every response is `Content-Disposition: attachment` and
        `X-Content-Type-Options: nosniff`. Even for an image: a file served inline from a hostname
        runs in that hostname's origin if a browser can be persuaded to treat it as a document, and the
        dedicated media hostname exists precisely so that the answer to "what if it is" is "nothing of
        ours".
      operationId: serveMedia
      parameters:
      - description: the tenant, from the path and covered by the signature
        in: path
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
      - description: the content address
        in: path
        name: sha256
        required: true
        schema:
          pattern: '[0-9a-f]{64}'
          type: string
      - description: '`thumb`, `preview` or `full`'
        in: path
        name: variant
        required: true
        schema:
          pattern: thumb|preview|full
          type: string
      - description: the user the link was signed for, from the query and covered by the signature
        in: query
        name: u
        required: true
        schema:
          format: uuid
          type: string
      - description: the expiry from the query
        in: query
        name: expires
        required: true
        schema:
          format: int64
          type: integer
      - description: the signature from the query
        in: query
        name: signature
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                format: binary
                type: string
          description: the bytes, or `404` when the signature does not verify
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found (`not-found`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Serves the bytes of one variant, to whoever presents a valid signature
