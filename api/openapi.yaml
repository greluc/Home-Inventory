          description: Validation failed (`validation-failed`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Finishes registering a passkey.
  /api/v1/auth/mfa/passkeys/{passkeyId}/removal:
    post:
      description: |-
        Removes one passkey.

        Asks for the second factor to have been proved recently (REQ-AUTH-011) rather than for a
        code in the body, which is how the TOTP removal beside it works: an account whose only factor
        is a passkey has no code to type, and the re-confirmation takes either kind.
      operationId: removePasskey
      parameters:
      - description: which one
        in: path
        name: passkeyId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: No Content
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthenticated (`unauthenticated`)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Second factor stale (`second-factor-stale`)
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not found (`not-found`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error (`internal-error`)
      summary: Removes one passkey
  /api/v1/auth/mfa/recovery-codes:
    post:
      description: Issues a fresh set of recovery codes, retiring whatever is left of the old one.
      operationId: reissueRecoveryCodes
      responses:
        '200':
          content:
            application/json:
              schema:
