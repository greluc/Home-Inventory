  /api/v1/auth/password-reset:
    post:
      description: |-
        Asks for a password reset, and says nothing about whether there was anything to reset
        (REQ-SEC-018).

        Always `204`. An address with an account gets a message with a link good for thirty
        minutes; an address without one gets nothing, and the two answers are identical — a reset
        endpoint that said "no such account" would be a way to ask the instance who is registered on it
        (REQ-SEC-110).

        Throttled on its own counters rather than the login ones: what this protects is somebody
        else's mailbox, and a flood of requests must not lock the account holder out of signing in.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        description: the address
        required: true
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Malformed request (`malformed-request`)
        '405':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Method not allowed (`method-not-allowed`)
        '406':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not acceptable (`not-acceptable`)
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Payload too large (`payload-too-large`)
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported media type (`unsupported-media-type`)
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Validation failed (`validation-failed`)
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Rate limited (`rate-limited`)
        '500':
          content:
            application/problem+json:
              schema:
