# REUSE configuration — https://reuse.software
#
# Why this file exists: the core is AGPL-3.0-or-later, but the plugin API and
# the SDKs are Apache-2.0 so that plugin authors can choose their own licence
# ([ADR-0018](docs/adr/0018-licensing.md)). That separation is only worth
# anything if it is machine-checkable, and REUSE is how it gets checked.
#
# Files that carry their own SPDX header do not need an entry here. This file
# covers what cannot carry one (licence texts, generated data, binary assets)
# and the directory-wide defaults.

version = 1
SPDX-PackageName = "Home Inventory"
SPDX-PackageSupplier = "Lucas Greuloch <lucas.greuloch@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/greluc/Home-Inventory"

# --- The core: AGPL ---------------------------------------------------------

[[annotations]]
path = [
  "app/**",
  "web/**",
  "design-system/**",
  "deploy/**",
  "api/**",
  "blobstore/**",
  "egress-proxy/**",
  # The plugins this project builds itself. AGPL like the rest of the
  # first-party code; the CONTRACT they are written against stays Apache
  # so that a third party may choose (ADR-0072, ADR-0018).
  "plugins/**",
  "website/**",
  ".github/**",
  "tools/**",
  # The build itself. These carry no header of their own — a comment in a
  # `.properties` or a `.gitignore` is a line somebody eventually deletes as
  # noise — so they are declared here, which is what REUSE.toml is for
  # (REQ-CON-007).
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradle/libs.versions.toml",
  ".dockerignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- The Gradle wrapper, which is Gradle's and not ours ----------------------
# Checked in on purpose: the wrapper is how a contributor gets the right Gradle
# without installing one (CLAUDE.md, "always through the wrapper"). The jar is a
# binary that can carry no header.

[[annotations]]
path = ["gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# --- The plugin contract: Apache-2.0, deliberately ---------------------------
# Anything a plugin author compiles against must stay permissive. A file that
# ends up here by accident makes the promise in ADR-0018 false, which is why CI
# checks this boundary rather than trusting it.

[[annotations]]
path = [
  "plugin-api/**",
  "plugin-sdk/**",
  "proto/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "Apache-2.0"

# --- Documentation ----------------------------------------------------------

[[annotations]]
path = ["docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Third-party text, kept verbatim ----------------------------------------

[[annotations]]
path = [
  "LICENSES/**",
  "LICENSE",
  # The Apache modules carry their own copy, which REQ-CON-007 asks for by name:
  # a plugin author who vendors `plugin-api` or `proto` gets the licence with the
  # code rather than having to know that the root of some other repository holds
  # a different one.
  "plugin-api/LICENSE",
  "proto/LICENSE",
  "plugin-sdk/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "Organization for Ethical Source and Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Third-party assets vendored into the design system ------------------------
# These must come AFTER the `design-system/**` rule above: where several
# annotations match a file, the last one wins. Without these two blocks the
# AGPL default would swallow them and declare somebody else's permissively
# licensed work as AGPL — a false statement, and the reason ADR-0000 A4 existed.

[[annotations]]
path = ["design-system/assets/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# Lucide is a Feather fork and its licence file is genuinely two licences: ISC
# for the set, MIT for the icons inherited from Feather. `assets/icons/
# LUCIDE-LICENSE.txt` carries both verbatim, the Feather icon list included.

[[annotations]]
path = ["design-system/assets/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Lucide Contributors",
  "2013-present Cole Bemis",
]
SPDX-License-Identifier = "ISC AND MIT"

# --- Third-party data vendored into the application ---------------------------
# The breached-password list REQ-SEC-011 checks against. Verbatim from SecLists
# (`Passwords/Common-Credentials/Pwdb_top-100000.txt`), MIT, vendored because
# the core has no outbound route and may not fetch it at run time (ADR-0026,
# ADR-0067). Plain text: a compressed file is a binary in a repository that is
# otherwise text, and git compresses the blob either way.

[[annotations]]
path = ["app/src/main/resources/security/breached-passwords.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Daniel Miessler, Jason Haddix, g0tmi1k and SecLists contributors"
SPDX-License-Identifier = "MIT"

# --- Project meta -----------------------------------------------------------

[[annotations]]
path = [
  "README.md", "CONTRIBUTING.md", "SECURITY.md", "SECURITY.asc", "CHANGELOG.md",
  "PLUGINS.md", "CLAUDE.md", "cla/**",
  ".gitignore", ".gitattributes", ".editorconfig", "REUSE.toml",
  "renovate.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- The licence notices every distributed artifact carries -------------------
# REQ-CON-013. These files are aggregates of other people's licence texts,
# generated by `tools/notices.py` from what each artifact actually carries, and
# they must come AFTER the directory defaults above: the last matching
# annotation wins, and the AGPL default would otherwise declare a copy of
# somebody else's MIT notice as AGPL — the same false statement the two blocks
# above exist to prevent.
#
# `LicenseRef-ThirdPartyNotices` is what says "many, and they are named inside".
# Each file lists the licence of every component in it, per component, which is
# more precise than any single identifier here could be — and SPDX's own
# `NOASSERTION` is not a licence identifier, so `reuse lint` rejects it (tried
# first, on 2026-09-22). `LICENSES/LicenseRef-ThirdPartyNotices.txt` states
# exactly what the reference means.

[[annotations]]
path = [
  "app/src/main/resources/third-party-notices.json",
  "web/public/third-party-notices.json",
  "plugins/oidc/src/main/resources/THIRD-PARTY-NOTICES.txt",
  "blobstore/THIRD-PARTY-NOTICES.txt",
  "egress-proxy/THIRD-PARTY-NOTICES.txt",
  "plugins/*/THIRD-PARTY-NOTICES.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "The respective copyright holders, named per component in the file"
SPDX-License-Identifier = "LicenseRef-ThirdPartyNotices"

# The canonical texts those notices reproduce, and the notices of the handful of
# components that publish none inside their artifact. Both are verbatim
# third-party text: never edited, and never "corrected" to this project's style
# (CLAUDE.md, the second carve-out of REQ-CON-014).

[[annotations]]
path = ["tools/notices/licences/**", "tools/notices/overrides/**"]
precedence = "override"
SPDX-FileCopyrightText = "The respective licence stewards and copyright holders, named in each file"
SPDX-License-Identifier = "LicenseRef-ThirdPartyNotices"
