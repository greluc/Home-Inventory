#
# The manifest `plugin-blobstore-nextcloud` ships as its reference.
#
# THE ONE THE CORE READS IS THE ONE THE OPERATOR MOUNTS, generated from
# `deploy/services.yaml` beside the container, the network segment and the
# egress allowlist (REQ-PLG-013). That matters most here: `spec.capabilities`
# carries the `host:port` of every Nextcloud this deployment may reach, and a
# tenant that configures an instance outside that list gets a refusal from the
# proxy rather than a connection (ADR-0027).

apiVersion: home-inv.plugin/v1

metadata:
  id: de.greluc.homeinv.plugin.blobstore.nextcloud
  name: "Nextcloud storage"
  version: "0.1.0"
  vendor: "greluc"
  license: "AGPL-3.0-or-later"
  homepage: "https://github.com/greluc/Home-Inventory"
  descriptions:
    en: "Stores a tenant's media in a Nextcloud folder over WebDAV, with an app password."
    de: "Legt die Medien eines Mandanten per WebDAV in einem Nextcloud-Ordner ab, mit einem App-Passwort."   # spelling-exempt: a manifest's own multilingual DATA

spec:
  contract: ">=1.0.0 <2.0.0"
  runtime: out-of-process

  implements:
    - port: BlobStore
      # Below the S3 plugin's 100, so that an operator who installs both gets a
      # deterministic answer rather than whichever was registered first. A
      # tenant that wants the other one uninstalls or disables this.
      priority: 90

  capabilities:
    # A `tcp:` target and not a `hosts:` one: what runs inside the tunnel is
    # HTTPS this plugin terminates itself, so the proxy sees a host and a port
    # and never a URL (O11, ADR-0027).
    - id: network:outbound
      tcp: ["cloud.example.org:443"]
      reason: "Storing and reading this tenant's media in its Nextcloud"
    # Without this the plugin has only the deployment's account to write to, and
    # a tenant that configured its own would be storing in the operator's
    # (ADR-0073, ADR-0074).
    - id: core:setting:read
      reason: "Reading the instance, account and folder this tenant configured"

  settings:
    # PER TENANT, and every one of them optional: a tenant that sets none uses
    # the deployment's account, where the tenant id is already part of every
    # path (ADR-0032). A tenant that wants its own Nextcloud sets `url` and BOTH
    # credential fields -- half a pair is refused rather than mixed with the
    # deployment's other half.
    - key: url
      type: string
      required: false
      label:
        en: "Nextcloud address"
        de: "Nextcloud-Adresse"   # spelling-exempt: a manifest's own multilingual DATA
    - key: username
      type: string
      required: false
      label:
        en: "Account"
        de: "Konto"   # spelling-exempt: a manifest's own multilingual DATA
    # SEALED in the core and opened only into the envelope of this plugin's own
    # calls (ADR-0019, ADR-0073). An APP password, not the account password: it
    # carries no web session, and revoking it revokes exactly this integration.
    - key: appPassword
      type: secret
      required: false
      label:
        en: "App password"
        de: "App-Passwort"   # spelling-exempt: a manifest's own multilingual DATA
    - key: folder
      type: string
      required: false
      label:
        en: "Folder"
        de: "Ordner"   # spelling-exempt: a manifest's own multilingual DATA

  health:
    endpoint: /healthz
    intervalSeconds: 60

  resources:
    # Two chunks of 8 MiB, the connection buffers around them, and the runtime.
    # An upload larger than one chunk is streamed chunk by chunk rather than
    # held, so this does not grow with the size of the object -- which is what
    # lets it fit REQ-NFR-009's per-plugin adder of 64 MB.
    memoryMiB: 64
    timeoutSeconds: 120
