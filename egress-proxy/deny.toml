#
# `cargo deny` runs in CI, for the two reasons it does in `blobstore/`:
#
#   * ADVISORIES — a crate with a known vulnerability fails the build, which is
#     REQ-SEC-075 applied to the dependency tree this service actually links.
#     It matters more here than anywhere: this is the one container with a route
#     out of the deployment.
#   * LICENCES — this binary is AGPL-3.0-or-later, and a crate under a licence
#     that cannot be combined with it would make the licence statement false.
#     An allowlist rather than a denylist, so a licence nobody has considered is
#     a failure rather than a silent acceptance.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every permissive licence that is compatible with AGPL-3.0-or-later when
# combined into it. GPL-2.0-only is deliberately absent: it is the one common
# copyleft licence AGPL-3.0 cannot absorb.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
