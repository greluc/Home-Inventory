[package]
name = "homeinv-egress-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The one route out of a Home Inventory deployment"
license = "AGPL-3.0-or-later"
repository = "https://github.com/greluc/Home-Inventory"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
