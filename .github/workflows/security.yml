name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: zulu
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon :app:compileJava -x test

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          ignore-unfixed: false
          format: sarif
          output: trivy-filesystem.sarif

      - name: Dependencies (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - name: Publish the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

      - name: Build the application image
        run: docker build -f app/Dockerfile -t home-inv:scan .

      - name: Build the web image
        run: docker build -f web/Dockerfile -t home-inv-web:scan .

      - name: Build the blob store image
        run: docker build -f blobstore/Dockerfile -t home-inv-blobstore:scan .

      - name: Build the egress proxy image
        run: docker build -f egress-proxy/Dockerfile -t home-inv-egress-proxy:scan .

      - name: Scan the images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-web:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan the blob store image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-blobstore:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan the egress proxy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-egress-proxy:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
