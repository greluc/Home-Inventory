#
# The gates that look for what is wrong rather than for what is missing.
#
# Separate from `ci.yml` for two reasons that are not organisational. They run on
# a SCHEDULE as well as on a push — a dependency that was clean on Monday has a
# CVE on Thursday and nothing in the repository changed (REQ-SEC-075) — and they
# need `security-events: write` to publish findings, which is a permission the
# rest of CI has no business holding.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  # Daily. The repository does not have to change for the answer to.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # REQ-SEC-051 — a secret that reaches a commit is a secret that is leaked,
  # whether or not the commit is ever pushed. This is the second line; the
  # pre-commit hook in `.pre-commit-config.yaml` is the first.
  # -------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not the tip. A secret that was committed and then
          # removed is still in the history, still fetchable, and still valid.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named rather than relied on. gitleaks finds a `.gitleaks.toml` in the
          # source root on its own, and "on its own" is how a config silently
          # stops being read. It allows exactly three things, each with its
          # reason written out, and each narrowed to the paths it belongs to:
          # the xkcd passphrase the integration tests share, the role passwords
          # the test container is given because production reads its own from
          # mounted secrets, and the illustrative value in a design-system prompt.
          GITLEAKS_CONFIG: .gitleaks.toml

  # -------------------------------------------------------------------------
  # REQ-SEC-076 — CodeQL. It is the only one of the SAST tools here that follows
  # data across method boundaries, which is what finds the class of defect that
  # is invisible in any single file.
  # -------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: zulu
          java-version: '25'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended` rather than the default set. The default is tuned
          # for a low false-positive rate on any repository; this one is a
          # multi-tenant application reachable from the internet, and a finding
          # worth reading is worth a finding that is not.
          queries: security-extended

      - name: Build
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon :app:compileJava -x test

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # -------------------------------------------------------------------------
  # REQ-SEC-075 — vulnerability scanning. "High" and "critical" fail the build,
  # and the daily schedule is the half that matters: a dependency that was clean
  # yesterday is the normal case.
  # -------------------------------------------------------------------------
  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # The dependency manifests: Gradle, npm and Cargo, in one pass over the
      # working tree.
      - name: Dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: sarif
          output: trivy-filesystem.sarif

      - name: Publish the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

      # And the images. A base image carries packages no manifest in this
      # repository mentions, and it is the half a dependency scan cannot see.
      - name: Build the application image
        run: docker build -f app/Dockerfile -t home-inv:scan .

      - name: Build the web image
        run: docker build -f web/Dockerfile -t home-inv-web:scan .

      - name: Build the blob store image
        run: docker build -f blobstore/Dockerfile -t home-inv-blobstore:scan .

      - name: Build the egress proxy image
        run: docker build -f egress-proxy/Dockerfile -t home-inv-egress-proxy:scan .

      - name: Scan the images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-web:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan the blob store image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-blobstore:scan
          severity: HIGH,CRITICAL
          exit-code: '1'

      # It runs on a non-internal segment by design (ADR-0042), which makes it one
      # of exactly two containers an attacker outside the deployment can reach.
      - name: Scan the egress proxy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: home-inv-egress-proxy:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
