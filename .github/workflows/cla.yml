name: CLA

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sign:
    name: Record a signature
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Record it
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/greluc/Home-Inventory/blob/main/cla/individual-cla.md
          custom-notsigned-prcomment: >
            Thank you for this. Before it can be merged, this project asks for a
            signed Contributor Licence Agreement — once, not per pull request.
            Read [`cla/individual-cla.md`](https://github.com/greluc/Home-Inventory/blob/main/cla/individual-cla.md),
            or [`cla/entity-cla.md`](https://github.com/greluc/Home-Inventory/blob/main/cla/entity-cla.md)
            if you are contributing on behalf of an employer, and then comment
            exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Signed, and recorded in `cla-signatures`. Thank you.'
          allowlist: dependabot[bot],renovate[bot]

  check:
    name: A signature is on file
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: cla-signatures

      - name: Has this author signed?
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          signatures="signatures/version1/cla.json"

          if [ "$AUTHOR" = "greluc" ] || [ "$AUTHOR" = "dependabot[bot]" ] \
             || [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "$AUTHOR does not need a signature."
            exit 0
          fi

          if [ ! -f "$signatures" ]; then
            echo "::error::No signature is on file for $AUTHOR, and none has ever been recorded."
            echo "         Read cla/individual-cla.md and comment on this pull request:"
            echo "         I have read the CLA Document and I hereby sign the CLA"
            exit 1
          fi

          if grep -q "\"name\": *\"$AUTHOR\"" "$signatures"; then
            echo "$AUTHOR has signed."
            exit 0
          fi

          echo "::error::No signature is on file for $AUTHOR (REQ-CON-011)."
          echo "         Read cla/individual-cla.md and comment on this pull request:"
          echo "         I have read the CLA Document and I hereby sign the CLA"
          exit 1
