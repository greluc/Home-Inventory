#
# THE CONTRIBUTOR LICENCE AGREEMENT (REQ-CON-011, ADR-0018).
#
# Two jobs, because they answer different questions with different rights.
#
# `sign` records a signature. It runs on a COMMENT and on nothing else — a
# contributor writes the sentence, the action writes their name into
# `signatures/version1/cla.json` on a branch of this repository, and that file is
# the durable record: readable by anybody, outliving whatever tooling collected
# it. It needs write access, which is why it is separated from the check.
#
# `check` blocks a pull request that has no signature. It reads that same file
# and nothing else, so it runs with a read-only token and works on a fork.
#
# WHY NOT `pull_request_target`, WHICH IS THE USUAL TRIGGER HERE
#
# Because `REQ-SEC-078` forbids it, and a rule that bends for the convenient
# case is not a rule. `pull_request_target` runs with this repository's secrets
# against the FORK's code; `issue_comment` runs this repository's workflow file
# and checks nothing out. The signing flow costs one comment and gives up
# nothing: the check still runs on every pull request, and it is the check that
# blocks.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

# Read by default; each job raises only what it needs.
permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sign:
    name: Record a signature
    # A comment on a pull request, saying the sentence. Not on an issue: there is
    # nothing to sign for.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Record it
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/greluc/Home-Inventory/blob/main/cla/individual-cla.md
          custom-notsigned-prcomment: >
            Thank you for this. Before it can be merged, this project asks for a
            signed Contributor Licence Agreement — once, not per pull request.
            Read [`cla/individual-cla.md`](https://github.com/greluc/Home-Inventory/blob/main/cla/individual-cla.md),
            or [`cla/entity-cla.md`](https://github.com/greluc/Home-Inventory/blob/main/cla/entity-cla.md)
            if you are contributing on behalf of an employer, and then comment
            exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Signed, and recorded in `cla-signatures`. Thank you.'
          # Nobody is exempt by role. The maintainer's own commits carry the DCO
          # like everybody else's, and a bot that opened a dependency bump is
          # submitting somebody else's code under its own licence.
          allowlist: dependabot[bot],renovate[bot]

  check:
    name: A signature is on file
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cla-signatures
          # The branch does not exist until the first signature is recorded, and
          # a repository whose first contributor has not signed yet is the
          # ordinary state rather than a broken one.
          continue-on-error: true

      - name: Has this author signed?
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          signatures="signatures/version1/cla.json"

          # The maintainer is the copyright holder: there is nobody for them to
          # grant a licence to. Everybody else signs.
          if [ "$AUTHOR" = "greluc" ] || [ "$AUTHOR" = "dependabot[bot]" ] \
             || [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "$AUTHOR does not need a signature."
            exit 0
          fi

          if [ ! -f "$signatures" ]; then
            echo "::error::No signature is on file for $AUTHOR, and none has ever been recorded."
            echo "         Read cla/individual-cla.md and comment on this pull request:"
            echo "         I have read the CLA Document and I hereby sign the CLA"
            exit 1
          fi

          if grep -q "\"name\": *\"$AUTHOR\"" "$signatures"; then
            echo "$AUTHOR has signed."
            exit 0
          fi

          echo "::error::No signature is on file for $AUTHOR (REQ-CON-011)."
          echo "         Read cla/individual-cla.md and comment on this pull request:"
          echo "         I have read the CLA Document and I hereby sign the CLA"
          exit 1
