#
# Publishes the project website to GitHub Pages.
#
# Two things this workflow exists to prevent, rather than merely to deploy:
#
#  1. **A second copy of the design system.** The site does not carry one. This
#     job copies `design-system/` into the build output, so the published page
#     and the repository can never show different tokens (ADR-0035).
#  2. **A third-party host on the project page.** REQ-PRIV-015 has no exception,
#     and a site advertising a self-hosted, privacy-respecting application must
#     not hand every visitor's address to a CDN. The guard below fails the build
#     rather than trusting review.
#
# NOTE: the actions below are pinned to major-version tags. Pinning them to full
# commit SHAs is the hardened form and should happen when the supply-chain gates
# in .github/workflows/README.md are built.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'design-system/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      # The workflow lands before the site does. Until `website/index.html`
      # exists there is nothing to publish, and a red cross on every push would
      # teach everyone to ignore this workflow.
      - name: Is there a site yet?
        id: guard
        run: |
          if [ -f website/index.html ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No website/index.html yet — nothing to publish.'
          fi

      - name: Assemble the site
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r website/. _site/
          rm -f _site/README.md          # the directory's own notes, not a page

          # The design system, from the one place it lives. Only what a browser
          # needs: no .jsx, no .d.ts, no .prompt.md, no ui_kits, no lint config.
          mkdir -p _site/design-system
          cp design-system/styles.css _site/design-system/
          cp -r design-system/tokens _site/design-system/
          rm -f _site/design-system/tokens/tokens.json      # the source, not a runtime asset
          cp -r design-system/assets _site/design-system/
          mkdir -p _site/design-system/components
          (cd design-system && find components -name '*.css' -print0 \
            | tar --null -cf - -T -) | (cd _site/design-system && tar -xf -)

          # Both licences require their notice in every copy, and publishing the
          # fonts and icons is a copy (REQ-CON-013). These two files are not
          # optional extras.
          test -f _site/design-system/assets/fonts/OFL.txt
          test -f _site/design-system/assets/icons/LUCIDE-LICENSE.txt

          # Jekyll drops every path beginning with an underscore. Pages built by
          # Actions do not run Jekyll, but the file costs nothing and protects
          # against a later switch back to branch-based publishing.
          touch _site/.nojekyll

      # REQ-PRIV-015, enforced rather than asserted. Hyperlinks to other sites
      # are fine — a visitor choosing to click one is not a silent disclosure.
      # What must not exist is a resource the browser fetches on its own.
      - name: No third-party host
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -uo pipefail
          fail=0
          report() { echo "::error file=$1::external resource: $2"; fail=1; }

          # Resource-loading attributes pointing at an absolute URL
          while IFS=: read -r f _ line; do
            [ -n "${f:-}" ] && report "$f" "$line"
          done < <(grep -rnEo '<(script|link|img|iframe|source|video|audio|embed|object)[^>]+(src|href|data)=["'"'"']https?://[^"'"'"']+' _site || true)

          # CSS @import and url()
          while IFS=: read -r f _ line; do
            [ -n "${f:-}" ] && report "$f" "$line"
          done < <(grep -rnEo '(@import[^;]*|url\()["'"'"']?https?://[^)"'"'"']+' _site || true)

          # Anything fetching at runtime, plus the usual CDNs by name
          while IFS=: read -r f _ line; do
            [ -n "${f:-}" ] && report "$f" "$line"
          done < <(grep -rnEo '(fetch\(|importScripts\(|new Worker\()["'"'"']https?://[^"'"'"']+|https?://(unpkg\.com|cdn\.|cdnjs\.|[a-z.]*jsdelivr\.net|esm\.sh|fonts\.googleapis\.com|fonts\.gstatic\.com)[^"'"'"' )]*' _site || true)

          if [ "$fail" -ne 0 ]; then
            echo '::error::The site loads at least one resource from a third-party host. REQ-PRIV-015 allows none.'
            exit 1
          fi
          echo 'No third-party resource references found.'

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
