# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The gates that need no container runtime beyond Docker.
#
# Every job here fails the build rather than warning. A gate that warns is a gate
# that is ignored within a month, and each of these exists because the rule it
# checks is one nobody can hold in their head across a year of changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          # The toolchain decides what the code is compiled against; this is only
          # what Gradle itself runs on. Pinned anyway, so a runner image change
          # cannot alter the build.
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # The integration tests start PostgreSQL and Valkey through Testcontainers,
      # against the same images the deployment uses. H2 is forbidden: JSONB,
      # ltree and row-level security behave differently, which is exactly where
      # the bugs would be (CLAUDE.md, Build).
      - name: Build, test and verify the architecture
        run: ./gradlew --no-daemon build

      # REQ-SEC-076. `max` effort and a `low` threshold, on a codebase where the
      # whole analysis costs seconds — a threshold that hides findings is a
      # threshold that hides the one that mattered. Every suppression in
      # `config/spotbugs-exclude.xml` carries the reason it does not apply.
      - name: SpotBugs with find-sec-bugs
        run: ./gradlew --no-daemon :app:spotbugsMain

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/test
          retention-days: 7

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The document is generated from the implementation and committed
      # (ADR-0049). `:app:test` is what proves the two agree — it reads the
      # document from a running context — so this job lints what that produced
      # rather than regenerating it a second time.
      - name: The document lints against the project ruleset
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml --ruleset api/spectral.yaml

      # REQ-API-003. The `type` URIs are the part of an error a client branches
      # on, and their documents are rendered from the registry rather than
      # written — so a token added to the registry and not rendered, or rendered
      # and not registered, fails here.
      - name: The problem documents match the registry
        run: |
          pip install --quiet pyyaml
          python tools/render_problems.py --check

  deployment:
    name: Deployment descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: pip install pyyaml

      # REQ-NFR-063. The generated files are committed so a reader can see them,
      # which means they can also be edited - and an edit that survives is an
      # edit that has diverged from the matrix everything else reads.
      - name: The generated files match services.yaml
        run: python deploy/generate.py --check

      # REQ-SEC-085 and the forbidden list in the matrix. Checked over the
      # rendered text rather than the matrix, because what runs is the rendered
      # text: a generator bug that dropped `read_only` would leave the matrix
      # perfectly correct.
      # REQ-NFR-055 and REQ-SEC-083…090: non-root inside the container, no
      # capabilities, no host namespace, no privileged port — asserted against
      # the generated descriptions rather than against the matrix they came
      # from, because the generated file is what a runtime actually reads.
      - name: No forbidden setting reaches a runtime description
        run: |
          set -euo pipefail
          files=$(find deploy/quadlet -name '*.container'; echo deploy/compose/compose.yaml)
          fail=0
          check() {
            if grep -nEH "$2" $files > /dev/null 2>&1; then
              echo "::error::forbidden: $1"
              grep -nEH "$2" $files || true
              fail=1
            fi
          }
          check "privileged"              '^\s*privileged\s*:\s*true|Privileged=true'
          check "cap_add"                 '^\s*cap_add|AddCapability='
          check "host pid namespace"      '^\s*pid\s*:\s*.?host|PidsHost'
          check "host network"            'network_mode\s*:\s*.?host|Network=host'
          check "running as root"         'user\s*:\s*.?(root|0:0)|User=(root|0:0)'
          check "SELinux label disabled"  'SecurityLabelDisable\s*=\s*true'
          # REQ-SEC-089: the runtime socket is mounted into NO container. A
          # container that can reach it is a container that can start a
          # privileged one, which makes every rule above decorative.
          check "container socket mount"  '(docker|podman)\.sock'
          # Host ports below 1024 (REQ-NFR-061): TLS terminates at the external
          # reverse proxy, so nothing here needs a privileged port.
          if grep -hoE '(PublishPort=|- ")([0-9]+):' $files | grep -oE '[0-9]+' \
             | awk '$1 < 1024 { print; found=1 } END { exit !found }'; then
            echo "::error::forbidden: a published host port below 1024"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "No forbidden setting in any generated description."
          exit $fail

      - name: Compose accepts every profile
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          for profile in minimal standard ha; do
            docker compose --profile "$profile" config > /dev/null
            echo "profile $profile: valid"
          done

  image:
    name: Application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built but not pushed on a pull request. The point here is that it builds
      # and that what it produces obeys the rules - publishing is a release
      # concern.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: home-inv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ADR-0022: non-root inside the container is one of the two independent
      # levels, and it is the one an image can be held to.
      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv:ci --format '{{.Config.User}}')
          echo "image user: ${user:-<empty>}"
          case "$user" in
            ""|root|0|0:0) echo "::error::the image runs as root"; exit 1 ;;
          esac

      # O29: the ImageProcessor is libvips, driven as a subprocess. An image
      # without it starts perfectly and fails on the first photo.
      #
      # This step asked `vips --version` until 2026-09-12 and passed while every
      # image upload answered 500: libvips was present, and the base image had no
      # AVIF *encoder*, so `heifsave` accepted each request and failed at the last
      # step. "Present" was never the property worth checking — ADR-0052 says every
      # stored image is AVIF, so the check is that the image can produce one, using
      # the same two binaries and the same arguments the adapter uses.
      - name: libvips can write the one format we store (ADR-0052)
        run: |
          docker run --rm --entrypoint sh home-inv:ci -c '
            set -eu
            vips black /tmp/probe.png 64 64
            vipsthumbnail /tmp/probe.png --size 32x32\> -o "/tmp/out.avif[Q=60,strip=true]"
            # The magic bytes, not the extension: a file named .avif that libvips
            # wrote in some other format would pass any check that trusted the name.
            head -c 12 /tmp/out.avif | grep -q ftypavif
            # And it reads back, because the adapter probes what it just wrote.
            test "$(vipsheader -f width /tmp/out.avif 2>/dev/null)" = "32"
          '

  egress-proxy:
    name: Egress proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egress-proxy
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress-proxy

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # The same `-D warnings` the blob store gets, and for a sharper reason:
      # this process parses bytes an unauthenticated caller chose, on the one
      # path that decides whether a connection leaves the deployment at all.
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Advisories and licences
        run: cargo deny check

      - name: Image
        # `-f Dockerfile`, not `-f egress-proxy/Dockerfile`: the working directory is
        # already the crate, and the context is `..` because the Dockerfile COPYs
        # `egress-proxy/` and `proto/` from the repository root.
        run: docker build -f Dockerfile -t home-inv-egress-proxy:ci ..
        working-directory: egress-proxy

      # `scratch` plus one static binary. An allowlist enforcer with a shell in
      # the image is an allowlist enforcer with a way around itself.
      - name: The image contains the binary and nothing else
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint /bin/sh home-inv-egress-proxy:ci -c 'echo reachable'              2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi
          echo "No shell in the runtime image."

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-egress-proxy:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::egress-proxy runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as 10001:10001."

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if the
      # two disagree, which is the difference between a reproducible build and
      # one that happens to work today (REQ-SEC-074).
      - run: npm ci

      - name: Types
        run: npm run typecheck

      # REQ-SEC-076, with `oxlint` in place of ESLint: `typescript-eslint` refuses
      # to load under TypeScript 7 and this client is on it. The requirement
      # records the substitution and the reason.
      - name: Lint
        run: npm run lint

      # REQ-NFR-032 and REQ-NFR-033: the interface is multilingual, the strings
      # live in resource bundles, and both languages are complete. i18next
      # answers a missing key with the key itself, so a typo ships as
      # `item.quntity` on screen and looks like a styling problem; a key missing
      # from German falls back to English and looks translated to anybody
      # testing in English.
      - name: Both languages are complete
        run: npm run i18n:check

      # REQ-NFR-035: times are stored in UTC and displayed in the user's zone.
      # The gate that requirement names is "a test across several time zones",
      # and it earns the plural — a formatter that ignored the zone would pass a
      # test run in one.
      - name: Unit tests
        run: npm test

      # The client is hand-written through stage 0 (REQ-API-002 generates it at
      # stage 1), and a hand-written client drifts silently: a mistyped path is a
      # 404 at run time on a screen nobody opened during review. `api/openapi.yaml`
      # is generated from the running application, so this compares against the
      # implementation.
      - name: Every path it calls is in the API document
        run: npm run contract:check

      - name: Build
        run: npm run build

      # ADR-0038: the policy names the hash of the inline theme bootstrap, and
      # the bootstrap is in the shell. A change to either without the other is a
      # page that fails in the browser with a blocked script - so it fails here
      # instead.
      - name: The served CSP matches the built bundle
        run: npm run csp:check

      - name: The CSP has not been weakened
        run: |
          set -euo pipefail
          policy=$(grep -o 'Content-Security-Policy "[^"]*"' nginx/default.conf)
          echo "$policy"
          for forbidden in "unsafe-inline" "unsafe-eval" "strict-dynamic" "Cross-Origin-Embedder-Policy"; do
            if grep -q "$forbidden" nginx/default.conf; then
              echo "::error::the policy contains $forbidden"
              exit 1
            fi
          done
          # REQ-SEC-061 makes COEP's reappearance a failure (ADR-0040), and
          # `trusted-types default` must stay beside the requirement: without it,
          # policy creation is unrestricted and anything achieving script
          # execution can mint its own (ADR-0038).
          for required in "require-trusted-types-for 'script'" "trusted-types default" "default-src 'none'" "frame-ancestors 'none'"; do
            if ! echo "$policy" | grep -q "$required"; then
              echo "::error::the policy is missing: $required"
              exit 1
            fi
          done
          echo "The policy carries everything it must and nothing it must not."

          # Every copy of the policy has to be the same policy. It is emitted once
          # per location, because nginx inherits `add_header` only where the
          # current level defines none - so a server-level block would reach
          # /api/ and /media/, which send their own headers, and the client would
          # receive two enforced policies fighting each other.
          distinct=$(grep -o 'Content-Security-Policy "[^"]*"' nginx/default.conf | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::the locations do not all send the same policy"
            exit 1
          fi

      # REQ-NFR-078 and 06 §6.7. Five rules for the hop ADR-0042 created, each
      # of which is quiet when wrong: the symptom is never an error, it is a
      # feature that silently stops working or a client that gets markup where
      # it was promised a problem document.
      - name: The web to api hop keeps its contract
        run: |
          set -euo pipefail
          conf=nginx/default.conf
          fail=0

          require() {
            if ! grep -qE "$2" "$conf"; then
              echo "::error::$1"
              fail=1
            fi
          }
          forbid() {
            if grep -qE "$2" "$conf"; then
              echo "::error::$1"
              grep -nE "$2" "$conf" || true
              fail=1
            fi
          }

          # The body limit must be ABOVE the API's, so an oversized upload is
          # refused by `api` as application/problem+json rather than by nginx as
          # an HTML error page (REQ-API-003).
          require "no client_max_body_size: the proxy would reject with markup" \
                  '^\s*client_max_body_size\s+[0-9]+m;'

          # The read timeout must exceed the API's own 30 s ceiling (08 §8.2), or
          # `web` emits its own 504 in place of the handled response.
          require "no proxy_read_timeout above the API ceiling" \
                  'proxy_read_timeout\s+(3[1-9]|[4-9][0-9]|[0-9]{3,})s;'

          # Off, for the SSE stream of REQ-API-011. A buffering proxy holds
          # events until the buffer fills: the feature appears to work in
          # development and silently stops working in the deployment.
          require "proxy_buffering is not switched off for the API" \
                  'proxy_buffering\s+off;'

          # APPENDED, never overwritten. Overwriting makes every client appear to
          # be this container: per-IP rate limiting throttles all tenants as one
          # and every audit entry records the same source (REQ-SEC-103).
          require "X-Forwarded-For is not appended" \
                  'proxy_set_header\s+X-Forwarded-For\s+\$proxy_add_x_forwarded_for;'
          forbid "X-Forwarded-For is overwritten rather than appended" \
                 'proxy_set_header\s+X-Forwarded-For\s+\$remote_addr;'

          # Nothing the API sets may be dropped: ETag, Retry-After, RateLimit-*,
          # Deprecation, Sunset, Link and Content-Disposition each carry a
          # documented contract, and dropping RateLimit-* breaks REQ-SEC-064's
          # acceptance criterion without breaking anything visible.
          forbid "a response header the API sets is hidden" 'proxy_hide_header'

          # `web` terminates no TLS (REQ-NFR-061): two terminations for one
          # hostname would mean two certificate lifecycles.
          forbid "web terminates TLS" '^\s*(ssl_certificate|listen[^;]*ssl)'

          [ "$fail" -eq 0 ] && echo "The hop keeps all five rules."
          exit $fail

  blobstore:
    name: Blob store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blobstore
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blobstore

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # `-D warnings` and not a report. A lint that does not fail is a lint that
      # accumulates, and this is the one process in the deployment that touches
      # every byte of every tenant's media.
      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # REQ-SEC-075 for this dependency tree, and the check that keeps the
      # binary's AGPL-3.0-or-later statement true: a crate under a licence that
      # cannot be combined with it fails, and so does one nobody has considered.
      - name: Advisories and licences
        run: cargo deny check

      - name: Image
        # `-f Dockerfile`, not `-f blobstore/Dockerfile`: the working directory is
        # already the crate, and the context is `..` because the Dockerfile COPYs
        # `blobstore/` and `proto/` from the repository root.
        run: docker build -f Dockerfile -t home-inv-blobstore:ci ..
        working-directory: blobstore

      # `scratch` plus one binary. Anything else in there is something an
      # attacker who reaches this process could run, and something to patch on a
      # CVE announcement for a package this service never used (ADR-0050).
      - name: The image contains the binary and nothing else
        run: |
          set -euo pipefail
          layers=$(docker run --rm --entrypoint /homeinv-blobstore home-inv-blobstore:ci --health \
                   2>&1 || true)
          if docker run --rm --entrypoint /bin/sh home-inv-blobstore:ci -c 'echo reachable' \
             2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi
          echo "No shell in the runtime image."

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-blobstore:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::blobstore runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as $user."

  contributions:
    name: Contribution rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit the pull request adds, not just its tip.
          fetch-depth: 0

      # REQ-CON-003. The DCO trailer is the contributor's statement that they
      # have the right to submit the work; a missing one is not a formatting
      # problem, it is a missing statement (CONTRIBUTING.md, ADR-0018).
      - name: Every commit is signed off and conventionally named
        run: |
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            # A push to main: check the commits it added.
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No base commit to compare against; nothing to check."
            exit 0
          fi

          fail=0
          for commit in $(git rev-list "$base..$head"); do
            subject=$(git log -1 --format=%s "$commit")
            # A merge commit has no author statement to make and no subject to
            # conform to.
            if [ "$(git rev-list --parents -n 1 "$commit" | wc -w)" -gt 2 ]; then
              continue
            fi
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$commit has no Signed-off-by trailer: $subject"
              echo "         Use \`git commit -s\`; never type the trailer by hand."
              fail=1
            fi
            if ! echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::$commit is not a Conventional Commit: $subject"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every commit is signed off and conventionally named."
          exit $fail

      # REQ-SEC-078. `pull_request_target` runs with the BASE repository's
      # secrets against the HEAD repository's code, which is a fork's code with
      # our tokens. There is no use of it in this repository that would be worth
      # that.
      - name: CI permissions are minimal and pull_request_target is absent
        run: |
          set -uo pipefail
          fail=0
          for workflow in .github/workflows/*.yml; do
            # Matched as a TRIGGER rather than as a word: this step names the
            # string in order to refuse it, and a bare grep finds itself.
            if grep -qE '^[[:space:]]*pull_request_target:' "$workflow"; then
              echo "::error file=$workflow::pull_request_target is forbidden (REQ-SEC-078)"
              fail=1
            fi
            if ! grep -qE '^permissions:' "$workflow"; then
              echo "::error file=$workflow::no workflow-level permissions block; the default is"
              echo "         whatever the repository grants, which is more than a job needs"
              fail=1
            fi
            if grep -qE '^permissions:\s*write-all' "$workflow"; then
              echo "::error file=$workflow::write-all is not minimal"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every workflow declares minimal permissions."
          exit $fail

  documentation:
    name: Documentation rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # REQ-CON-014: British English, with two carve-outs that would break things
      # if "corrected" - technical identifiers keep their technology's spelling,
      # and verbatim third-party text is never edited.
      - name: British English in the prose
        run: |
          set -uo pipefail
          # American spellings only, and only ones with no technical meaning here.
          # Three traps are avoided deliberately:
          #
          #  - `color`, `catalog` and `labeling` are absent: they are identifiers in
          #    this codebase - the CSS property, the catalog schema, the labeling
          #    schema.
          #  - `licence` and `centred` are **British** and were on this list by
          #    mistake until the first dry run caught them. `license` is absent too,
          #    because it is the correct British *verb*: "licensed under Apache-2.0".
          #  - a line carrying `spelling-exempt` is skipped, for the few places that
          #    quote the exceptions in order to document them.
          pattern='\b(behaviors?|organiz(e|ed|ing|ation)|analyz(e|ed|ing)|fulfill|defense|centered)\b'
          files=$(git ls-files '*.md' \
            | grep -v '^LICENSE' \
            | grep -v '^LICENSES/' \
            | grep -v '^CODE_OF_CONDUCT.md' \
            | grep -v '^design-system/' \
            | grep -v '^website/')
          if grep -nEHi "$pattern" $files | grep -v 'spelling-exempt'; then
            echo "::error::American spelling in prose (REQ-CON-014)"
            exit 1
          fi
          echo "No American spelling found in the prose."

      # REQ-CON-015. A fact stated twice is checked, not trusted: the number of
      # ADRs, of requirements per area, of design-system modules, the profile
      # memory sums — each is recorded once with the expression that computes it,
      # and every restatement is compared against the computed value. Retired
      # spellings fail wherever they are not explicitly allowed.
      - name: Tracked facts and retired literals
        run: |
          pip install --quiet pyyaml
          python tools/tracked_facts.py

      # A4b in ADR-0000. An ADR is never rewritten when a decision changes: a
      # later one amends it and the older one carries a note saying so. That
      # relation is hand-maintained in three places — both records and the index —
      # and a hand-maintained index is what goes stale while still reading as
      # authoritative. Run by hand on 2026-09-11 it found nine omissions; written
      # as a gate on 2026-09-12 it found four more, including two back-links
      # missing since ADR-0050 and ADR-0052 were written.
      - name: Every ADR amendment is recorded in both directions
        run: python tools/adr_links.py

      # A7 in ADR-0000, and the rule 14 §14.3 states about itself: "a property
      # with no test is a claim". It ships with a BASELINE and fails only on new
      # occurrences, because a bare regex over ten thousand lines of deliberately
      # emphatic prose would be switched off within a week. The list only shrinks.
      - name: No new claim without something that checks it
        run: python tools/unbacked_claims.py

      # REQ-CON-012 and REQ-CON-002. The corpus is English, file names included.
      # A German-language document is not a translation problem — it is a second
      # corpus, and the second one is the one that stops being updated.
      - name: No German-language document
        run: |
          set -uo pipefail
          # Words that are German and are not also English, not identifiers, and
          # not plausible in an English sentence. Deliberately short: a list that
          # produces one false positive is a list somebody switches off.
          pattern='\b(und|oder|nicht|werden|wurde|müssen|sollte|kann|dieser|diese|dieses|einen|einem|eine)\b'
          files=$(git ls-files '*.md' | grep -v '^LICENSES/' | grep -v '^design-system/' \
                  | grep -v '^website/' | grep -v '^CODE_OF_CONDUCT.md')
          if grep -nEHiw "$pattern" $files | grep -v 'spelling-exempt'; then
            echo "::error::a German-language document in the corpus (REQ-CON-012)"
            exit 1
          fi
          echo "The corpus is English."

      # REQ-CON-002: diagrams are Mermaid in plain text. A binary diagram is one
      # nobody can review in a pull request and one that needs a tool to open.
      - name: No binary diagram
        run: |
          set -uo pipefail
          if git ls-files '*.drawio' '*.vsdx' '*.graffle' '*.png' '*.jpg' '*.svg' \
             | grep -vE '^(design-system/assets/|website/)' | grep -q .; then
            echo "::error::a binary or vector diagram outside the asset directories (REQ-CON-002)"
            git ls-files '*.drawio' '*.vsdx' '*.graffle' '*.png' '*.jpg' '*.svg' \
              | grep -vE '^(design-system/assets/|website/)'
            exit 1
          fi
          echo "Every diagram is Mermaid in plain text."

      # Two control characters reached this repository through a shell heredoc: a
      # NUL where a space belonged in a cursor fingerprint, and a backspace where
      # a regex needed a word boundary. Both were invisible in a diff and both
      # changed what the code did.
      - name: No control character in a text file
        run: |
          set -uo pipefail
          fail=0
          for file in $(git ls-files); do
            case "$file" in
              design-system/assets/*|gradle/wrapper/*|*.ttf|*.woff2|*.png|*.jpg|*.ico) continue ;;
            esac
            if LC_ALL=C grep -qP '[\x00\x07\x08\x0b\x0c\x1b]' "$file" 2>/dev/null; then
              echo "::error file=$file::a control character in a text file"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "No stray control characters."
          exit $fail

      # Every relative link in the corpus resolves. A dead link in a document
      # that calls itself the single source of truth is worse than no document.
      #
      # This was four lines of shell until 2026-09-12 and had never passed: under
      # `pipefail`, a Markdown file with no relative links made `grep` exit 1 and
      # took the gate with it — which is most of api/problems/ and
      # CODE_OF_CONDUCT.md — and it reported the dead link from inside a subshell
      # whose failure could not escape, so the job failed without saying what was
      # wrong. The script also resolves against what git tracks rather than
      # against the filesystem, so a wrong-case link fails here and not only on
      # the runner.
      - name: No dead relative link
        run: python tools/dead_links.py

      # A workflow step is a shell script nothing parses until a runner reaches
      # it, which makes a syntax error the most expensive typo here: a push, a
      # queue and several minutes, reported as whatever step was running. Two
      # went out on 2026-09-12, both a quoted heredoc inside an indented block —
      # YAML strips the base indentation and the terminator arrives indented.
      # `bash -n` sees that in a millisecond.
      - name: Every workflow step is valid shell
        run: python tools/workflow_shell.py
