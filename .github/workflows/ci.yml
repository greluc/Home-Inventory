name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and verify the architecture
        run: ./gradlew --no-daemon build

      - name: SpotBugs with find-sec-bugs
        run: ./gradlew --no-daemon :app:spotbugsMain

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/test
          retention-days: 7

      - name: The licence notices describe what the artifacts carry
        run: python3 tools/notices.py --check app plugin-oidc

      - name: Publish the SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            app/build/sbom/
            plugins/oidc/build/sbom/
          retention-days: 90
          if-no-files-found: error

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: The document lints against the project ruleset
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml --ruleset api/spectral.yaml

      - name: The problem documents match the registry
        run: |
          pip install --quiet pyyaml
          python tools/render_problems.py --check

      - name: The persisted-query register matches the client
        run: python tools/persisted_queries.py --check

      - name: The Kotlin client matches the API document
        run: python tools/kotlin_client.py --check

      - name: Every manifest signature is over its manifest
        run: python tools/manifest_signatures.py --check

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: The plugin contract lints
        run: buf lint proto

      - name: The plugin contract does not break
        run: buf breaking proto --against '.git#ref=HEAD~1,subdir=proto'

  deployment:
    name: Deployment descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: pip install pyyaml

      - name: The generated files match services.yaml
        run: python deploy/generate.py --check

      - name: No forbidden setting reaches a runtime description
        run: |
          set -euo pipefail
          files=$(find deploy/quadlet -name '*.container'; echo deploy/compose/compose.yaml)
          fail=0
          check() {
            if grep -nEH "$2" $files > /dev/null 2>&1; then
              echo "::error::forbidden: $1"
              grep -nEH "$2" $files || true
              fail=1
            fi
          }
          check "privileged"              '^\s*privileged\s*:\s*true|Privileged=true'
          check "cap_add"                 '^\s*cap_add|AddCapability='
          check "host pid namespace"      '^\s*pid\s*:\s*.?host|PidsHost'
          check "host network"            'network_mode\s*:\s*.?host|Network=host'
          check "running as root"         'user\s*:\s*.?(root|0:0)|User=(root|0:0)'
          check "SELinux label disabled"  'SecurityLabelDisable\s*=\s*true'
          check "container socket mount"  '(docker|podman)\.sock'
          if grep -hoE '(PublishPort=|- ")([0-9]+):' $files | grep -oE '[0-9]+' \
             | awk '$1 < 1024 { print; found=1 } END { exit !found }'; then
            echo "::error::forbidden: a published host port below 1024"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "No forbidden setting in any generated description."
          exit $fail

      - name: Compose accepts every profile
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          for profile in minimal standard ha; do
            docker compose --profile "$profile" config > /dev/null
            echo "profile $profile: valid"
          done

  image:
    name: Application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: home-inv:ci
          build-args: |
            HOMEINV_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv:ci --format '{{.Config.User}}')
          echo "image user: ${user:-<empty>}"
          case "$user" in
            ""|root|0|0:0) echo "::error::the image runs as root"; exit 1 ;;
          esac

      - name: libvips can write the one format we store (ADR-0052)
        run: |
          docker run --rm --entrypoint sh home-inv:ci -c '
            set -eu
            vips black /tmp/probe.png 64 64
            vipsthumbnail /tmp/probe.png --size 32x32\> -o "/tmp/out.avif[Q=60,strip=true]"
            # The magic bytes, not the extension: a file named .avif that libvips
            # wrote in some other format would pass any check that trusted the name.
            head -c 12 /tmp/out.avif | grep -q ftypavif
            # And it reads back, because the adapter probes what it just wrote.
            test "$(vipsheader -f width /tmp/out.avif 2>/dev/null)" = "32"
          '

  egress-proxy:
    name: Egress proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egress-proxy
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress-proxy

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Advisories and licences
        run: cargo deny check

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: The SBOM, and the notice the binary carries
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --no-build-deps --target x86_64-unknown-linux-musl
          python3 ../tools/notices.py --check egress-proxy

      - name: Publish the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-egress-proxy
          path: egress-proxy/*.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Image
        run: docker build -f Dockerfile -t home-inv-egress-proxy:ci ..
        working-directory: egress-proxy


      - name: The image can say what it is made of
        run: |
          set -euo pipefail
          docker run --rm home-inv-egress-proxy:ci --licences > notice.txt
          first=$(head -1 notice.txt)
          if [ "$first" != "THIRD-PARTY LICENCE NOTICES" ]; then
            echo "::error::egress-proxy does not print its licence notice; it read '$first'"
            exit 1
          fi
          if [ "$(wc -l < notice.txt)" -lt 200 ]; then
            echo "::error::egress-proxy printed a notice of $(wc -l < notice.txt) lines"
            exit 1
          fi
          rm notice.txt
          echo "The image prints its third-party notice."

      - name: The image contains the binary and nothing else
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint /bin/sh home-inv-egress-proxy:ci -c 'echo reachable'              2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi
          echo "No shell in the runtime image."

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-egress-proxy:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::egress-proxy runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as 10001:10001."

  plugins:
    name: Plugin — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: common
            image: false
          - crate: webhook
            image: true
          - crate: smtp
            image: true
          - crate: blobstore-s3
            image: true
          - crate: blobstore-nextcloud
            image: true
    defaults:
      run:
        working-directory: plugins/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ matrix.crate }}

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Advisories and licences
        run: cargo deny check

      - name: Install cargo-cyclonedx
        if: matrix.image
        run: cargo install cargo-cyclonedx --locked

      - name: The SBOM, and the notice the binary carries
        if: matrix.image
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --no-build-deps --target x86_64-unknown-linux-musl
          python3 ../../tools/notices.py --check plugins-${{ matrix.crate }}

      - name: Publish the SBOM
        if: matrix.image
        uses: actions/upload-artifact@v7
        with:
          name: sbom-plugin-${{ matrix.crate }}
          path: plugins/${{ matrix.crate }}/*.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Image
        if: matrix.image
        run: docker build -f Dockerfile -t home-inv-plugin-${{ matrix.crate }}:ci ../..


      - name: The image can say what it is made of
        if: matrix.image
        run: |
          set -euo pipefail
          docker run --rm home-inv-plugin-${{ matrix.crate }}:ci --licences > notice.txt
          first=$(head -1 notice.txt)
          if [ "$first" != "THIRD-PARTY LICENCE NOTICES" ]; then
            echo "::error::plugin-${{ matrix.crate }} does not print its licence notice; it read '$first'"
            exit 1
          fi
          if [ "$(wc -l < notice.txt)" -lt 200 ]; then
            echo "::error::plugin-${{ matrix.crate }} printed a notice of $(wc -l < notice.txt) lines"
            exit 1
          fi
          rm notice.txt
          echo "The image prints its third-party notice."

      - name: The image contains the binary and nothing else
        if: matrix.image
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint /bin/sh home-inv-plugin-${{ matrix.crate }}:ci \
             -c 'echo reachable' 2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi
          echo "No shell in the runtime image."

      - name: The image does not run as root
        if: matrix.image
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-plugin-${{ matrix.crate }}:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::plugin-${{ matrix.crate }} runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as 10001:10001."

  plugin-oidc-image:
    name: Plugin — oidc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image
        run: docker build -f plugins/oidc/Dockerfile -t home-inv-plugin-oidc:ci .

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-plugin-oidc:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::plugin-oidc runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as 10001:10001."

      - name: It starts, and says what it is missing rather than crashing
        run: |
          set -euo pipefail
          if docker run --rm home-inv-plugin-oidc:ci 2>&1 | tee /tmp/oidc.log; then
            echo "::error::plugin-oidc started without an mTLS identity"
            exit 1
          fi
          grep -q "mtls-plugin-oidc" /tmp/oidc.log \
            || { echo "::error::it refused without naming the file it needs"; exit 1; }
          echo "Refuses to start without its identity, and says which file."

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Both languages are complete
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: The generated client matches the API document
        run: npm run client:check

      - name: Build
        run: npm run build

      - name: The served CSP matches the built bundle
        run: npm run csp:check

      - name: The licence notice describes what the bundle carries
        run: python3 ../tools/notices.py --check web

      - name: Publish the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: web/dist/sbom.json
          retention-days: 90
          if-no-files-found: error

      - name: The committed policy is the generated one
        run: git diff --exit-code -- nginx/default.conf

      - name: The CSP has not been weakened
        run: |
          set -euo pipefail
          policy=$(grep -o 'Content-Security-Policy "[^"]*"' nginx/default.conf)
          echo "$policy"
          for forbidden in "unsafe-inline" "unsafe-eval" "strict-dynamic" "Cross-Origin-Embedder-Policy"; do
            if grep -q "$forbidden" nginx/default.conf; then
              echo "::error::the policy contains $forbidden"
              exit 1
            fi
          done
          for required in "require-trusted-types-for 'script'" "trusted-types default" "default-src 'none'" "frame-ancestors 'none'"; do
            if ! echo "$policy" | grep -q "$required"; then
              echo "::error::the policy is missing: $required"
              exit 1
            fi
          done
          echo "The policy carries everything it must and nothing it must not."

          distinct=$(grep -o 'Content-Security-Policy "[^"]*"' nginx/default.conf | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::the locations do not all send the same policy"
            exit 1
          fi

      - name: The web to api hop keeps its contract
        run: |
          set -euo pipefail
          conf=nginx/default.conf
          fail=0

          require() {
            if ! grep -qE "$2" "$conf"; then
              echo "::error::$1"
              fail=1
            fi
          }
          forbid() {
            if grep -qE "$2" "$conf"; then
              echo "::error::$1"
              grep -nE "$2" "$conf" || true
              fail=1
            fi
          }

          require "no client_max_body_size: the proxy would reject with markup" \
                  '^\s*client_max_body_size\s+[0-9]+m;'

          require "no proxy_read_timeout above the API ceiling" \
                  'proxy_read_timeout\s+(3[1-9]|[4-9][0-9]|[0-9]{3,})s;'

          require "proxy_buffering is not switched off for the API" \
                  'proxy_buffering\s+off;'

          require "X-Forwarded-For is not appended" \
                  'proxy_set_header\s+X-Forwarded-For\s+\$proxy_add_x_forwarded_for;'
          forbid "X-Forwarded-For is overwritten rather than appended" \
                 'proxy_set_header\s+X-Forwarded-For\s+\$remote_addr;'

          forbid "a response header the API sets is hidden" 'proxy_hide_header'

          forbid "web terminates TLS" '^\s*(ssl_certificate|listen[^;]*ssl)'

          [ "$fail" -eq 0 ] && echo "The hop keeps all five rules."
          exit $fail

  blobstore:
    name: Blob store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blobstore
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blobstore

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Advisories and licences
        run: cargo deny check

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: The SBOM, and the notice the binary carries
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --no-build-deps --target x86_64-unknown-linux-musl
          python3 ../tools/notices.py --check blobstore

      - name: Publish the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-blobstore
          path: blobstore/*.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Image
        run: docker build -f Dockerfile -t home-inv-blobstore:ci ..
        working-directory: blobstore


      - name: The image can say what it is made of
        run: |
          set -euo pipefail
          docker run --rm home-inv-blobstore:ci --licences > notice.txt
          first=$(head -1 notice.txt)
          if [ "$first" != "THIRD-PARTY LICENCE NOTICES" ]; then
            echo "::error::blobstore does not print its licence notice; it read '$first'"
            exit 1
          fi
          if [ "$(wc -l < notice.txt)" -lt 200 ]; then
            echo "::error::blobstore printed a notice of $(wc -l < notice.txt) lines"
            exit 1
          fi
          rm notice.txt
          echo "The image prints its third-party notice."

      - name: The image contains the binary and nothing else
        run: |
          set -euo pipefail
          layers=$(docker run --rm --entrypoint /homeinv-blobstore home-inv-blobstore:ci --health \
                   2>&1 || true)
          if docker run --rm --entrypoint /bin/sh home-inv-blobstore:ci -c 'echo reachable' \
             2>/dev/null; then
            echo "::error::the runtime image contains a shell"
            exit 1
          fi
          echo "No shell in the runtime image."

      - name: The image does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect home-inv-blobstore:ci --format '{{.Config.User}}')
          if [ "$user" != "10001:10001" ]; then
            echo "::error::blobstore runs as '$user'; it must be 10001:10001 (REQ-SEC-084)"
            exit 1
          fi
          echo "Runs as $user."

  contributions:
    name: Contribution rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit is signed off and conventionally named
        run: |
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No base commit to compare against; nothing to check."
            exit 0
          fi

          fail=0
          for commit in $(git rev-list "$base..$head"); do
            subject=$(git log -1 --format=%s "$commit")
            if [ "$(git rev-list --parents -n 1 "$commit" | wc -w)" -gt 2 ]; then
              continue
            fi
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$commit has no Signed-off-by trailer: $subject"
              echo "         Use \`git commit -s\`; never type the trailer by hand."
              fail=1
            fi
            if ! echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::$commit is not a Conventional Commit: $subject"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every commit is signed off and conventionally named."
          exit $fail

      - name: The community files are present
        run: |
          set -uo pipefail
          fail=0
          for file in README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty (REQ-CON-006)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every community file is present."
          exit $fail

      - name: The changelog is being kept
        run: |
          set -uo pipefail
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [Unreleased] section (REQ-CON-005)"
            exit 1
          fi
          entries=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '^- ')
          if [ "$entries" -eq 0 ]; then
            echo "::error::CHANGELOG.md's [Unreleased] section names no change (REQ-CON-005)"
            exit 1
          fi
          echo "The changelog's Unreleased section names $entries change(s)."

      - name: Licences are declared for every file
        run: |
          set -uo pipefail
          pipx install reuse >/dev/null 2>&1 || pip install --quiet reuse
          reuse lint

      - name: The Apache modules carry their own licence
        run: |
          set -uo pipefail
          fail=0
          for module in plugin-api proto plugin-sdk; do
            if [ ! -s "$module/LICENSE" ]; then
              echo "::error::$module has no LICENSE of its own (REQ-CON-007, ADR-0018)"
              fail=1
            elif ! head -5 "$module/LICENSE" | grep -q 'Apache License'; then
              echo "::error::$module/LICENSE is not the Apache licence (REQ-CON-007)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every Apache module carries its own licence."
          exit $fail

      - name: CI permissions are minimal and pull_request_target is absent
        run: |
          set -uo pipefail
          fail=0
          for workflow in .github/workflows/*.yml; do
            if grep -qE '^[[:space:]]*pull_request_target:' "$workflow"; then
              echo "::error file=$workflow::pull_request_target is forbidden (REQ-SEC-078)"
              fail=1
            fi
            if ! grep -qE '^permissions:' "$workflow"; then
              echo "::error file=$workflow::no workflow-level permissions block; the default is"
              echo "         whatever the repository grants, which is more than a job needs"
              fail=1
            fi
            if grep -qE '^permissions:\s*write-all' "$workflow"; then
              echo "::error file=$workflow::write-all is not minimal"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Every workflow declares minimal permissions."
          exit $fail

  documentation:
    name: Documentation rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: British English in the prose
        run: |
          set -uo pipefail
          pattern='\b(behaviors?|organiz(e|ed|ing|ation)|analyz(e|ed|ing)|fulfill|defense|centered)\b'
          files=$(git ls-files '*.md' \
            | grep -v '^LICENSE' \
            | grep -v '^LICENSES/' \
            | grep -v '^CODE_OF_CONDUCT.md' \
            | grep -v '^design-system/' \
            | grep -v '^website/')
          if grep -nEHi "$pattern" $files | grep -v 'spelling-exempt'; then
            echo "::error::American spelling in prose (REQ-CON-014)"
            exit 1
          fi
          echo "No American spelling found in the prose."

      - name: Tracked facts and retired literals
        run: |
          pip install --quiet pyyaml
          python tools/tracked_facts.py

      - name: Every ADR amendment is recorded in both directions
        run: python tools/adr_links.py

      - name: No new claim without something that checks it
        run: python tools/unbacked_claims.py

      - name: No German-language document
        run: |
          set -uo pipefail
          pattern='\b(und|oder|nicht|werden|wurde|müssen|sollte|kann|dieser|diese|dieses|einen|einem|eine)\b'
          files=$(git ls-files '*.md' | grep -v '^LICENSES/' | grep -v '^design-system/' \
                  | grep -v '^website/' | grep -v '^CODE_OF_CONDUCT.md')
          if grep -nEHiw "$pattern" $files | grep -v 'spelling-exempt'; then
            echo "::error::a German-language document in the corpus (REQ-CON-012)"
            exit 1
          fi
          echo "The corpus is English."

      - name: No binary diagram
        run: |
          set -uo pipefail
          if git ls-files '*.drawio' '*.vsdx' '*.graffle' '*.png' '*.jpg' '*.svg' \
             | grep -vE '^(design-system/assets/|website/)' | grep -q .; then
            echo "::error::a binary or vector diagram outside the asset directories (REQ-CON-002)"
            git ls-files '*.drawio' '*.vsdx' '*.graffle' '*.png' '*.jpg' '*.svg' \
              | grep -vE '^(design-system/assets/|website/)'
            exit 1
          fi
          echo "Every diagram is Mermaid in plain text."

      - name: No control character in a text file
        run: |
          set -uo pipefail
          fail=0
          for file in $(git ls-files); do
            case "$file" in
              design-system/assets/*|gradle/wrapper/*|*.ttf|*.woff2|*.png|*.jpg|*.ico) continue ;;
            esac
            if LC_ALL=C grep -qP '[\x00\x07\x08\x0b\x0c\x1b]' "$file" 2>/dev/null; then
              echo "::error file=$file::a control character in a text file"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "No stray control characters."
          exit $fail

      - name: No dead relative link
        run: python tools/dead_links.py

      - name: Every workflow step is valid shell
        run: python tools/workflow_shell.py
