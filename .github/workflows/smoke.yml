name: Rootless smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'deploy/**'
      - 'app/Dockerfile'
      - 'app/docker/**'
      - 'web/Dockerfile'
      - '.github/workflows/smoke.yml'
      - 'app/src/main/**'
      - 'web/src/**'
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rootless:
    name: ${{ matrix.runtime }} (rootless)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml

      - name: Install the runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          if [ "${{ matrix.runtime }}" = "podman" ]; then
            sudo apt-get install -y podman uidmap passt dbus-user-session aardvark-dns
            podman --version

            version=$(podman --version | awk '{print $3}')
            major=${version%%.*}
            if [ "$major" -lt 5 ]; then
              echo "::error::podman $version is below the 5.0 REQ-NFR-051 requires;"\
                   "quadlet cannot parse the units this deployment generates"
              exit 1
            fi
            test "$(id -u)" -ne 0
            podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          else
            sudo apt-get install -y uidmap dbus-user-session slirp4netns fuse-overlayfs

            profile=/etc/apparmor.d/home.runner.bin.rootlesskit
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              '' \
              '/home/runner/bin/rootlesskit flags=(unconfined) {' \
              '  userns,' \
              '  include if exists <local/home.runner.bin.rootlesskit>' \
              '}' \
              | sudo tee "$profile" >/dev/null
            sudo systemctl restart apparmor.service || true

            sudo systemctl disable --now docker.service docker.socket || true
            sudo rm -f /var/run/docker.sock

            export XDG_RUNTIME_DIR="/run/user/$(id -u)"

            if ! curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh; then
              echo "::warning::the rootless installer reported a failure; its journal follows"
              journalctl --user -n 60 --no-pager -u docker.service || true
              systemctl --user status docker.service --no-pager || true
            fi
            echo "$HOME/bin" >> "$GITHUB_PATH"
            echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
          fi

      - name: Confirm the daemon is rootless
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = "docker" ]; then
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            systemctl --user start docker || true
            for _ in $(seq 1 30); do docker info > /dev/null 2>&1 && break; sleep 1; done
            if ! docker info > /dev/null 2>&1; then
              echo "::error::the rootless daemon did not come up"
              journalctl --user -n 40 --no-pager -u docker.service || true
              exit 1
            fi
            docker info --format '{{.SecurityOptions}}' | grep -q rootless
          fi
          echo "runtime is rootless"

      - name: The descriptions still match the matrix
        run: python deploy/generate.py --check

      - name: Bring the host up to the prerequisites
        run: |
          set -euo pipefail


          sudo loginctl enable-linger "$USER"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          sudo tee /etc/systemd/system/user@.service.d/delegate.conf >/dev/null <<'CONF'
          [Service]
          Delegate=cpu cpuset io memory pids
          CONF
          sudo systemctl daemon-reload
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid

      - name: Build the six images the deployment names
        run: |
          set -euo pipefail
          ${{ matrix.runtime }} build -f app/Dockerfile             --build-arg HOMEINV_BUILD_COMMIT="$(git rev-parse --short=12 HEAD)"             -t ghcr.io/greluc/home-inv:latest .
          ${{ matrix.runtime }} build -f web/Dockerfile -t ghcr.io/greluc/home-inv-web:latest .
          ${{ matrix.runtime }} build -f deploy/images/postgres/Dockerfile \
            -t ghcr.io/greluc/home-inv-postgres:latest .
          ${{ matrix.runtime }} build -f blobstore/Dockerfile \
            -t ghcr.io/greluc/home-inv-blobstore:latest .
          ${{ matrix.runtime }} build -f egress-proxy/Dockerfile \
            -t ghcr.io/greluc/home-inv-egress-proxy:latest .
          ${{ matrix.runtime }} build -f plugins/webhook/Dockerfile \
            -t ghcr.io/greluc/home-inv-plugin-webhook:latest .

      - name: The one command (deploy/setup.sh)
        timeout-minutes: 10
        env:
          HOMEINV_BOOTSTRAP_EMAIL: owner@example.org
        run: ./deploy/setup.sh ${{ matrix.runtime }}

      - name: The whole profile is up (podman)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user list-units 'homeinv-*' --all --no-pager
          systemctl --user is-active --quiet homeinv-minimal.target \
            || { echo "::error::homeinv-minimal.target is not active"; exit 1; }

      - name: The API becomes ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ${{ matrix.runtime }} exec homeinv-api /usr/bin/healthcheck > /dev/null 2>&1; then
              echo "ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never became ready"
          ${{ matrix.runtime }} ps -a || true
          exit 1

      - name: The scanner has its signatures
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1200); do
            if ${{ matrix.runtime }} exec homeinv-clamav clamdcheck.sh > /dev/null 2>&1; then
              echo "the scanner answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the scanner never became ready; uploads would be refused 503"
          ${{ matrix.runtime }} logs homeinv-clamav --tail 50 || true
          exit 1

      - name: The segments are what the matrix claims
        run: sh deploy/smoke/connectivity.sh ${{ matrix.runtime }}

      - name: An item can be created, photographed, stored and found again
        run: sh deploy/smoke/journey.sh http://localhost:8080

      - name: It comes back up against its own volumes
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = "podman" ]; then
            systemctl --user stop 'homeinv-*.service'
            systemctl --user start homeinv-minimal.target
          else
            (cd deploy/compose && docker compose --profile minimal restart)
          fi
          for attempt in $(seq 1 120); do
            if ${{ matrix.runtime }} exec homeinv-api /usr/bin/healthcheck > /dev/null 2>&1; then
              echo "ready again after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come back up against its existing volumes"
          exit 1

      - name: A second bootstrap changes nothing
        if: matrix.runtime == 'docker'
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          docker compose --profile minimal up bootstrap --force-recreate \
            --exit-code-from bootstrap
          said=$(docker logs "$(docker compose --profile minimal ps -aq bootstrap)" 2>&1)
          echo "$said"
          grep -q "already has its owner" <<< "$said" \
            || { echo "::error::the second run did not recognise the existing owner"; exit 1; }

      - name: Nothing inside runs as root
        run: |
          set -euo pipefail
          fail=0
          for container in $(${{ matrix.runtime }} ps --format '{{.Names}}'); do
            uid=$(${{ matrix.runtime }} exec "$container" id -u 2>/dev/null || echo skip)
            [ "$uid" = "skip" ] && continue
            echo "$container: uid $uid"
            if [ "$uid" = "0" ]; then
              echo "::error::$container runs as uid 0"
              fail=1
            fi
          done
          exit $fail

      - name: Logs on failure
        if: failure()
        run: |
          set +e
          if [ "${{ matrix.runtime }}" = "podman" ]; then
            echo "::group::unit states"
            systemctl --user list-units 'homeinv-*' --all --no-pager
            echo "::endgroup::"
            echo "::group::installed files and the generator"
            ls -la "${XDG_CONFIG_HOME:-$HOME/.config}/containers/systemd/"
            ls -la "${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/"
            ls -la /usr/lib/systemd/user-generators/ /usr/libexec/podman/ 2>/dev/null
            /usr/libexec/podman/quadlet -dryrun -user 2>&1 | head -40
            echo "::endgroup::"
            for unit in $(systemctl --user list-units 'homeinv-*' --all --no-legend                           --plain | awk '{print $1}'); do
              echo "::group::$unit"
              systemctl --user status "$unit" --no-pager --lines 0
              journalctl --user -u "$unit" -n 200 --no-pager
              echo "::endgroup::"
            done
          else
            (cd deploy/compose && docker compose --profile minimal logs --tail 200)
          fi
          true

      - name: Tear down
        if: always()
        run: |
          set +e
          if [ "${{ matrix.runtime }}" = "podman" ]; then
            systemctl --user stop 'homeinv-*' 2>/dev/null
            podman rm --force --all 2>/dev/null
            podman volume prune --force 2>/dev/null
          else
            (cd deploy/compose && docker compose --profile minimal down -v)
          fi
          true
