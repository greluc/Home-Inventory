name: Bug report
description: Something does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security problems.** Use
        [private vulnerability reporting](https://github.com/greluc/Home-Inventory/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/greluc/Home-Inventory/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: >-
        Numbered steps. If you can reproduce it from a fresh installation, say
        so — that is the difference between a bug we can fix today and one we
        chase for a week.
      placeholder: |
        1. Create an item of type …
        2. …
        3. Observe …
    validations:
      required: true

  - type: input
    id: traceid
    attributes:
      label: traceId
      description: >-
        Every error response carries one, and it leads straight to the operation
        in the server log. If you have it, it is worth more than a screenshot.
      placeholder: 0af7651916cd43dd8448eb211c80319c

  - type: input
    id: version
    attributes:
      label: Version
      description: The version and commit shown in the UI.
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it
      options:
        - Podman rootless with Quadlet
        - Docker rootless with Compose
        - Kubernetes (Helm)
        - Something else — please say in the description
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Debian 13, Fedora 45, Rocky Linux 10.1, …

  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: ["standard", "minimal", "ha", "not sure"]

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Please redact before pasting. Logs are filtered for secrets, but they
        do contain item names, location names and IP addresses.
      render: text

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue
          required: true
        - label: I removed anything personal or secret from what I pasted
          required: true
