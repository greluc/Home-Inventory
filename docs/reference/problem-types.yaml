# Home Inventory — the `problem.type` registry (RFC 9457)
#
# THIS FILE IS THE SOURCE OF TRUTH FOR THE SET OF PROBLEM TYPES.
#
# 08 §8.2 makes `type` the part of an error response clients branch on:
#   "`type` is a stable, documented URI — clients branch on it, not on the text."
# `REQ-API-003` requires it on every endpoint. Until 2026-09-11 the set was named
# nowhere: three tokens appeared in worked examples across three chapters, and a
# client author had no list to program against. That is the gap this file closes
# (A8 in docs/adr/0000-open-points.md), under the same principle that put
# `deploy/expected/clamav-freshclam.conf` in the repository before its generator:
# "contracts before implementations" (01 §1.5, principle 3).
#
# It is generated INTO the OpenAPI document, not derived from it. `oasdiff`
# guards the result: a removed token or a changed status code is a BREAKING
# change and needs `/api/v2` (08 §8.3); a NEW token is a minor change, exactly
# like a new enum value in a response.
#
# ---------------------------------------------------------------------------
# THE NAMESPACE IS FIXED, NOT PER DEPLOYMENT
#
# `https://home-inv.example/problems/<token>` — the spelling 08 §8.2 already
# uses, taken here as the namespace rather than as a stand-in for the
# deployment's own host.
#
# It has to be fixed, or "stable" means nothing: a client that talks to two
# instances would see two different `type` URIs for the same condition and could
# not branch on either. The URI is an IDENTIFIER, not a fetch target — RFC 9457
# permits that explicitly — and `home-inv.example` is a documentation-reserved
# name (RFC 2606), so it can never collide with a host somebody actually runs.
#
# DECIDED 2026-09-11 as open point O23, and decided deliberately rather than
# inherited: the spelling appeared in ONE worked example, and treating an example
# as a decision is the drift this file exists to end.
#
# The reserved name stays. Three reasons, in order of weight:
#
#   1. `.example` is reserved by RFC 2606 and can never be registered by anyone.
#      A real domain can lapse and be bought by someone else — while it is baked
#      into every client already shipped. Clients MUST NOT dereference the URI
#      automatically (RFC 9457), so that would not be an immediate compromise; it
#      would be somebody else owning an identifier of ours, permanently.
#   2. No host has to stay alive. A dereferenceable URL would commit the project
#      to serving those paths for as long as the API version lives — v1 stays
#      served at least 12 months past deprecation (ADR-0011) — which is an
#      ongoing obligation taken on by a one-person, part-time project for a
#      convenience.
#   3. The human-readable documentation is THIS FILE and the OpenAPI document,
#      which is where an integrator actually looks. RFC 9457 encourages the URI to
#      resolve to documentation; it does not require it.
#
# Rejected: `https://greluc.github.io/Home-Inventory/problems/<token>`. Besides
# (2), it would carry the repository's LONG form into an identifier every client
# bakes in, where the project uses the short form `home-inv` everywhere by rule —
# the repository name is the single documented long-form exception, and this
# would have quietly made it a second one. Also rejected: a URN
# (`urn:home-inv:problem:<token>`), which is clean and host-free but unfamiliar
# to API consumers and offers no path to a documentation page either.
# ---------------------------------------------------------------------------
#
# `status` is part of the contract. 08 §8.3 lists "changing the status code of an
# existing case" as breaking, so it is recorded per entry and compared in CI.
#
# `since` records the stage the condition first occurs in, so an entry cannot be
# required by a test before the feature that raises it exists.

schemaVersion: 1
updated: 2026-09-13
namespace: "https://home-inv.example/problems/"

# ---------------------------------------------------------------------------
# IN USE — the token appears verbatim in the corpus, with its status code.
# ---------------------------------------------------------------------------
registered:

  - token: validation-failed
    status: 422
    since: 0
    summary: >
      The request was syntactically valid but violates a domain rule — most often
      an attribute that does not match its type version's JSON Schema.
    carries:
      - "`errors[]`, one entry per failing field, each with `pointer`, `code`,
         `message` and where applicable `expected` (08 §8.2)"
    sources:
      - "08 §8.2, the worked error example: `https://home-inv.example/problems/validation-failed`"
      - "05 §5.1 error cases: attribute violates the type definition → 422 with a field path"
      - "11 §11.3: a sync push result of `REJECTED` carries `problem.type` `…/validation-failed`"
      - "REQ-CORE-005, REQ-API-003"

  - token: quota-exceeded
    status: 403
    since: 1
    summary: >
      A tenant quota would be exceeded by this operation — item count, stored
      bytes, plugin count or API calls.
    carries:
      - "the current and the permitted amount (05 §5.1, REQ-TEN-009)"
    sources:
      - "05 §5.1: `403` with `type: .../quota-exceeded`, current and permitted amount"
      - "REQ-TEN-009, 04 §4.3 `tenancy` (`QuotaGuard`)"

  - token: cursor-expired
    status: 410
    since: 3
    summary: >
      The device's sync cursor is older than the tenant's `change_log` retention.
      The device must perform a full seeding.
    carries:
      - "no resumption hint — by design; the client restarts from `/sync/bootstrap`"
    sources:
      - "11 §11.3: `410 Gone` with `type: …/cursor-expired` → the device performs a full seeding"
      - "REQ-SYNC-009, 07 §7.6 (retention 30–365 days, default 90)"

# ---------------------------------------------------------------------------
# ASSIGNED HERE — the CONDITION and its STATUS CODE are fixed by the corpus; only
# the spelling was missing. Assigning it is the work A8 describes. Every entry
# names the place that fixed the condition, so none of this is invention.
# ---------------------------------------------------------------------------
assigned:

  - token: malformed-request
    status: 400
    since: 0
    summary: "The request could not be parsed, or an unknown field was present."
    notes: >
      `REQ-SEC-029` makes unknown fields a REJECTION rather than something
      ignored, so this covers more than a JSON syntax error.
    sources: ["08 §8.2 status list: `400` syntax", "REQ-SEC-029"]

  - token: unauthenticated
    status: 401
    since: 0
    summary: "No valid credential was presented."
    sources: ["08 §8.2 status list: `401` not authenticated"]

  - token: forbidden
    status: 403
    since: 0
    summary: >
      The caller is authenticated and the resource is one they may know exists,
      but the action is not permitted.
    notes: >
      **Not** used for a foreign or invisible resource — that is `not-found`
      below, and the distinction is a security property, not a style choice
      (`REQ-SEC-025`).
    sources: ["08 §8.2: `403` authenticated but not permitted", "REQ-SEC-026"]

  - token: not-found
    status: 404
    since: 0
    summary: >
      The resource does not exist, **or** exists and is not visible to this
      caller. One token, deliberately, for both.
    notes: >
      **This entry is a security control and must not be split.** `REQ-SEC-025`
      requires foreign or invisible objects to be indistinguishable from absent
      ones, and `REQ-IDENT-014` requires the same of `/c/{code}`: an unknown code
      and a missing permission must give the same answer. Two tokens here would
      turn the error body into the existence oracle the status code was chosen to
      avoid. A CI test asserts the two cases produce byte-identical responses.
    sources:
      - "08 §8.2: `404` not present **or not visible**"
      - "05 §5.1: location belongs to another tenant → `404`, **not** `403`, so as not to reveal existence"
      - "REQ-SEC-025, REQ-IDENT-014"

  - token: idempotency-key-conflict
    status: 409
    since: 1
    summary: >
      The `Idempotency-Key` was already used with a **different** payload. The
      same key with the same payload returns the original response instead.
    sources:
      - "08 §8.2 concurrency table: a repeat with a different payload → `409`"
      - "05 §5.1 error cases, REQ-API-005"

  - token: resource-exists
    status: 409
    since: 0
    summary: >
      A creating `POST` supplied an `id` that already exists in this tenant with
      **different** content. The same id with the same content returns `200`
      instead, which is what makes a retried creation safe.
    notes: >
      Registered 2026-09-11, during the stage-0 implementation. The contract
      specified the same-content case and left the differing one unspecified,
      and `idempotency-key-conflict` does not cover it: that token is about the
      `Idempotency-Key` header, which is stage 1 (REQ-API-005), while
      client-chosen ids are stage 0 (REQ-CORE-001). Mapping it to
      `validation-failed` was rejected because a client branching on the status
      could then not tell a conflict from a bad field.
    sources:
      - "REQ-CORE-001: creation with a client-generated ID returns `201`; the same ID with the same content returns `200`"
      - "08 §8 client-generated IDs, REQ-API-003"

  - token: type-key-taken
    status: 409
    since: 1
    summary: >
      A key the tenant chose for a type, a location category, a field or a value
      is already in use for the same kind of thing.
    notes: >
      Distinct from `name-taken`, which is about a location's name among its
      siblings, and from `resource-exists`, which is about a client-chosen id. A
      key is neither: it is the stable identifier a tenant gives a definition, it
      appears inside every item that uses the field, and it is unique per tenant
      rather than per parent. A client branching on the status has to be able to
      tell "pick another key" from "pick another id".
    sources:
      - "REQ-CORE-020: types are creatable and editable in the running system"
      - "07 §7.3: `UNIQUE (tenant_id, key)` on every definition table"

  - token: version-frozen
    status: 409
    since: 1
    summary: >
      A published type version was edited. A published version is a snapshot: the
      items written against it carry its schema, and changing it would change what
      they mean.
    notes: >
      The answer carries the version id, so a client can offer the one thing that
      does work — starting a new draft from it. `409` rather than `422`: nothing
      about the request is malformed, and the same body against a draft succeeds.
    sources:
      - "REQ-CORE-025: types are versioned; an item references a type version"
      - "ADR-0020: a type change devalues no existing data"

  - token: constraint-loosened
    status: 422
    since: 1
    summary: >
      An inheriting type widened a field it inherits. An inheriting type may
      tighten a field and may not loosen one.
    notes: >
      Named at publish time rather than when the field is written, because a draft
      is allowed to be incoherent while it is being edited; publishing is the
      moment it has to hold. The answer names the field and the property that was
      widened — `required`, `max`, `the pattern` — because "it loosens something"
      leaves a person to find it.
    sources:
      - "REQ-CORE-024: an inheriting type may tighten fields but not loosen them"

  - token: name-taken
    status: 409
    since: 0
    summary: >
      A location's name is already carried by a live sibling. Names are unique
      among siblings, case-insensitively, so that the tree a person reads matches
      the tree the database holds.
    notes: >
      Registered 2026-09-12, during the stage-0 implementation, after
      `deploy/smoke/journey.sh` was run twice against one deployment and the second
      run was answered `500`: the partial unique index `location_sibling_name` was
      enforced by the migration and answered for nowhere. Distinct from
      `resource-exists`, which is about a client-chosen **id** — a client branching
      on the status has to tell "that identifier is taken" from "that name is
      taken", and only one of the two is fixed by choosing a different id. Mapping
      it to `validation-failed` was rejected for the reason written out under
      `resource-exists`.
    sources:
      - "REQ-CORE-064: names are unique among siblings"
      - "07 §7.1: `location_sibling_name`, partial so a tombstone does not block re-use"

  - token: bundle-cycle
    status: 409
    since: 1
    summary: >
      Putting that item into that bundle would make the bundle contain itself —
      directly, or through a chain of bundles.
    notes: >
      Its own token rather than `invalid-move`, which says the same thing about
      the tree of PLACES. A client acts on the two in different screens — one is
      where things are kept, the other what a thing is part of — and a shared
      token would have to be told apart by reading the detail text, which is what
      a stable `type` exists to avoid. Registered with REQ-CORE-007's
      implementation. An item may be in several bundles, so the loop can be long
      and is visible from neither end of the request that would close it; the
      check is a reachability walk and the answer names no intermediate step,
      because the way out is the same whatever the chain was.
    sources:
      - "REQ-CORE-007: an item can be a bundle containing other items"
      - "04 §4.4: a bundle does not contain itself"

  - token: item-lent
    status: 409
    since: 1
    summary: >
      The item is out on loan, and what was asked cannot be done while somebody
      else has it.
    notes: >
      TWO requests get it and the caller does the same thing about both, which is
      why it is one token: lending something that is already out would open a
      second loan on one object, and trashing it would throw away the only record
      of who to ask for it back. A `409` and not a `422` -- nothing about the
      request is malformed and the identical one succeeds once the thing is back.
      Its own token rather than `validation-failed`, because no field is wrong and
      a client showing a field error would point at nothing. Registered with
      REQ-LIFE-005's implementation, when an item could first be out.
    sources:
      - "REQ-LIFE-005: a lent item is recognisable as such and not deletable"
      - "07 §7.8 `inventory.loan`: at most one open loan per item"

  - token: item-state
    status: 409
    since: 1
    summary: >
      The item is in a state where what was asked cannot be done -- it has been
      sold, disposed of or trashed.
    notes: >
      SEPARATE from `item-lent`, because a caller acts differently on the two:
      "somebody has it" is answered by asking for it back, "you sold it in March"
      is not answered at all. A client forced to read the detail text to tell them
      apart would be doing the work a stable `type` exists to remove -- the
      argument `bundle-cycle` makes against sharing `invalid-move`. Registered
      with REQ-LIFE-007's implementation, when an item first had a state it could
      not come back from.
    sources:
      - "REQ-LIFE-007: sale and disposal change the state"
      - "04 §4.4: ACTIVE -> LENT -> ACTIVE, ACTIVE -> SOLD/DISPOSED"

  - token: unserved-trigger
    status: 422
    since: 1
    summary: >
      A reminder rule names a trigger that nothing in this installation can
      answer.
    notes: >
      REQ-NOTI-003 names six triggers and two of them have no source: a stocktake
      is stage 2 and no licence expiry date is stored. A rule naming one is
      refused when it is WRITTEN, by the person who can still choose another --
      accepted and then silently never firing is the failure a reminder feature
      cannot afford, and it would look like working software until the day
      somebody needed it. The same argument REQ-SRCH-008 makes about refusing an
      unparseable filter when it is saved rather than when it is run. A 422 and
      not a 409, because what is wrong is the value of a field. The detail names
      the triggers that do work, since picking one of them is the way out.
    sources:
      - "REQ-NOTI-003: triggers at least warranty expiry, maintenance interval, return date, minimum stock, licence expiry, stocktake discrepancy"
      - "REQ-NOTI-001: reminder rules are data, not code"

  - token: no-document-renderer
    status: 409
    since: 1
    summary: >
      A document was asked for and nothing installed can render one.
    notes: >
      A 409 and not a 501. The report exists and its figures are served by the
      two endpoints beside this one, as data and as a table; what is missing is
      a DocumentRenderer plugin, which an operator installs. A 501 would say
      this application cannot do it, which is not what is wrong -- and an empty
      file would be a worse answer than a refusal somebody can act on. The
      detail says where the figures are.
    sources:
      - "REQ-LIFE-016: an insurance report is producible as a PDF and as a table"
      - "ADR-0070: a document is described, not programmed, and rendering it is a plugin's job"

  - token: export-not-ready
    status: 409
    since: 1
    summary: >
      The export archive was asked for before it had been built.
    notes: >
      A 409 and not a 404: the job is there and the caller is looking at the
      right thing, it is simply not finished. A 404 would send somebody looking
      for a job they can see in their own list. The detail names the state
      instead, because "still running" and "it failed" lead a caller somewhere
      different -- one waits, the other asks again. Registered with
      REQ-PORT-005's implementation, when an export first became a job rather
      than a response.
    sources:
      - "REQ-PORT-005: export runs asynchronously as a job resource with progress"
      - "08 §8.1: /export-jobs is a resource"

  - token: invalid-move
    status: 409
    since: 1
    summary: >
      A location cannot be moved where the request asks: into itself or into
      something it contains, or under a category that has said which categories it
      takes and did not name this one.
    notes: >
      ONE token for both, because the caller does the same thing about either:
      choose a different target. The depth ceiling is deliberately *not* here — it
      stays `validation-failed` carrying `maxDepth`, which is what creating a
      location too deep has always answered, and a client that already handles one
      needs no second branch for the other. Registered with REQ-CORE-043's
      implementation, when moving a subtree first became possible and the tree
      stopped being acyclic by construction.
    sources:
      - "REQ-CORE-045: cycles in the tree are impossible"
      - "REQ-CORE-047: a category may restrict its permitted child categories"

  - token: invitation-already-open
    status: 409
    since: 1
    summary: >
      This tenant already has an unused invitation for the address, or the person
      at that address is already a member of it.
    carries:
      - "`invitationId`, when the conflict is an open invitation, so a client can offer to withdraw it"
    notes: >
      Two live invitations to one address would be two working tokens, and
      withdrawing the one an administrator remembers would leave the other one
      open. Registered with REQ-TEN-004's implementation.
    sources:
      - "REQ-TEN-004: invitations are single-use, time-limited and bound to an address"

  - token: last-owner
    status: 409
    since: 1
    summary: >
      The change would leave the tenant without an owner — the last one cannot be
      demoted or removed.
    notes: >
      A tenant with no owner is stranded rather than degraded: nobody can invite
      into it, promote anybody or delete it, and the instance operator cannot
      either, because operating the instance grants nothing inside a tenant
      (ADR-0057). The way out is to make somebody else an owner first.
    sources:
      - "REQ-TEN-005, REQ-TEN-011, ADR-0057"

  - token: invitation-unusable
    status: 410
    since: 1
    summary: >
      The invitation cannot be used: no such token, or it has been used, withdrawn
      or has run out.
    notes: >
      ONE token for all four conditions, deliberately. Distinguishing them would
      let whoever holds a link learn that somebody was invited to this instance,
      which is exactly what the single use is meant to end rather than advertise.
      `410` rather than `404` because the caller followed a link meant for them and
      "this no longer works" is true of every one of the four.
    sources:
      - "REQ-TEN-004: reuse is rejected"

  - token: invitation-not-yours
    status: 403
    since: 1
    summary: >
      The invited address already has an account, and the caller is not signed in
      as it.
    notes: >
      Holding the token proves the mailbox, which is enough to create the account
      the invitation names — nobody else exists to be harmed. It is not enough to
      attach a membership to an account that already belongs to somebody: a
      forwarded or intercepted link would otherwise put a stranger into a tenant
      they never joined. The way through is to sign in as the invited address.
    sources:
      - "REQ-TEN-004, REQ-SEC-020 (no linking by address alone)"

  - token: role-escalation
    status: 403
    since: 1
    summary: >
      Somebody tried to grant, or withdraw, a role carrying permissions they do not
      hold themselves.
    carries:
      - "`actorRole` and `targetRole`, so a client can say which grant was refused"
    notes: >
      Distinct from `forbidden`, which says the caller's role does not permit the
      operation at all. Here the caller may administer members and reached past
      their own ladder rung, which is a different thing to tell somebody and a
      different thing to see in a log.
    sources:
      - "REQ-TEN-010: nobody can grant permissions they do not hold themselves"

  - token: second-factor-stale
    status: 403
    since: 1
    summary: >
      The operation needs the second factor proved again; the code goes to
      `POST /api/v1/auth/mfa/step-up`.
    notes: >
      REQ-AUTH-011 asks for the factor again before granting permissions,
      deleting a tenant and exporting; fifteen minutes from the last accepted
      code, whether at the login or at the step-up. Its own token beside
      `second-factor-missing` because the two ask for different things: setting an
      authenticator up, and entering a code from the one that is there. Reading a
      sensitive field is on the same list and is NOT answered with this: the field
      is removed and the answer stays 200, because a list with one sensitive
      column would otherwise become unreadable.
    sources:
      - "REQ-AUTH-011, 12 §12.4"

  - token: registration-closed
    status: 403
    since: 1
    summary: >
      This instance creates no accounts; the invitation is good, but the address
      behind it has none.
    notes: >
      `HOMEINV_REGISTRATION_MODE=closed` (REQ-AUTH-004). The invitation is NOT
      consumed: somebody who already has an account can accept the same one, and
      the way out is an account from the operator. Its own token rather than a
      plain `forbidden`, because what the caller should do about it is specific
      and the refusal is about the instance rather than about them.
    sources:
      - "REQ-AUTH-004, 12 §12.4"

  - token: second-factor-missing
    status: 403
    since: 1
    summary: >
      The role this session holds requires a second factor and the account has
      none; the way out is to enrol one.
    notes: >
      A 403 rather than a 401: the caller is authenticated, and what is missing is
      not a credential for this request but an authenticator on the account.
      REQ-AUTH-003 makes the factor mandatory for OWNER and ADMIN and for any role
      that reads a sensitive field; the membership is still granted — refusing it
      would leave a tenant nobody owns, because creating one makes an owner and
      the first owner of an instance is made by a one-shot with nobody to ask for
      a code. It is also the answer to granting sensitive field visibility to a
      role whose members have none, where the detail says how many and never who.
      `/api/v1/auth/**` and `/api/v1/me/**` keep answering, so the way out and the
      switch to another tenant are always reachable.
    sources:
      - "REQ-AUTH-003, 12 §12.4"

  - token: second-factor-required
    status: 401
    since: 1
    summary: >
      The password was accepted and the account is protected by a second factor;
      the code goes to `POST /api/v1/auth/mfa`.
    notes: >
      A 401 like a wrong password, and its own token because it is the one case
      where the client does something other than ask for the password again.
      Saying this much costs nothing: whoever sees it has already presented the
      right password for the address. The half-done login lives in the session
      for five minutes and is consumed by the first answer, right or wrong.
    sources:
      - "REQ-AUTH-002, 12 §12.4"

  - token: second-factor-invalid
    status: 401
    since: 1
    summary: >
      The code presented is not valid.
    notes: >
      ONE token for a wrong code, a code from a time step already spent, a
      recovery code already used and an account with no second factor at all —
      the treatment `invitation-unusable` gets, for the same reason. Telling them
      apart would say whether a guess was close, and "already used" would confirm
      that the code existed.
    sources:
      - "REQ-AUTH-002, 12 §12.4"

  - token: second-factor-enrolled
    status: 409
    since: 1
    summary: >
      The account already has a confirmed second factor.
    notes: >
      Enrolling again would replace a working authenticator with an unproven one,
      and somebody who then lost the new QR code would be locked out with a valid
      app on their phone. The way out is to remove the old one, which asks for a
      code.
    sources:
      - "REQ-AUTH-002"

  - token: deletion-pending
    status: 409
    since: 1
    summary: >
      The tenant has already been asked to be erased; the grace period is running.
    carries:
      - "`eraseAfter`, the instant the erasure begins (REQ-TEN-011)"
    notes: >
      Not a second revocation token: two live ones would be two ways to withdraw
      one request, and withdrawing with the one somebody remembers would leave the
      other working.
    sources:
      - "REQ-TEN-011, 05 §5.9"

  - token: revocation-unusable
    status: 410
    since: 1
    summary: >
      The revocation link cannot be used: no such token, already used, or the
      grace period is over.
    notes: >
      ONE token for all three, the same treatment `invitation-unusable` gets and
      for the same reason: telling them apart would let whoever holds a link learn
      that a tenant here was asked to be erased.
    sources:
      - "REQ-TEN-011, 05 §5.9"

  - token: precondition-failed
    status: 412
    since: 1
    summary: "The `If-Match` entity tag does not match the resource's current version."
    sources: ["08 §8.2: a mismatch → `412`", "REQ-API-004"]

  - token: precondition-required
    status: 428
    since: 1
    summary: >
      A mutating request on a single resource arrived without `If-Match`. There
      is no blind overwrite.
    sources: ["08 §8.2: a missing header → `428 Precondition Required`", "REQ-API-004"]

  - token: rate-limited
    status: 429
    since: 0
    summary: "A per-user, per-tenant or per-IP rate limit was reached."
    carries:
      - "`Retry-After` and the `RateLimit-*` headers (08 §8.2, REQ-SEC-064)"
    notes: >
      Login and code resolution have their own, stricter limits and use this same
      token — the limit that was hit is an operational detail, not a contract.


      CORRECTED 2026-09-12: this read `since: 1` while `ApiExceptionHandler` has
      emitted it since stage 0, because REQ-SEC-014's login throttle is a stage-0
      requirement and answers with it. The general rate limit of REQ-SEC-064 is
      stage 1; the token is not, and `since` records where the condition first
      occurs.
    sources: ["08 §8.2 security table", "REQ-SEC-064"]

  - token: malware-detected
    status: 422
    since: 0
    summary: >
      The malware scan found something. The blob is deleted from the store and the
      object is `INFECTED`, permanently unretrievable and never derived from.
    notes: >
      Answered by `GET /api/v1/media/{id}` and NOT by the upload. The scan runs in
      the worker (ADR-0024, ADR-0054), so the upload is answered `202` before any
      verdict exists and the retrieval is where a client learns the outcome. This
      entry named the upload until 2026-09-12, which no asynchronous scan could
      have delivered. The audit entry and the administrator's notification moved
      to REQ-SEC-108 and stage 1 with the machinery they need.
    sources:
      - "ADR-0024, fail-closed table: a finding → `422`"
      - "ADR-0054: the status moves from the POST to the GET"
      - "REQ-SEC-092"

  - token: scan-unavailable
    status: 503
    since: 0
    summary: >
      There is no verdict for this object yet — it is `PENDING_SCAN`, or the
      scanner could not be reached and it is `SCAN_FAILED`. Either way it is
      unretrievable, and the retry queue will ask again (ADR-0054).
    notes: >
      This is the one `503` that is not a degradation but a refusal, and that is
      deliberate: the scan is **fail-closed** (ADR-0024). It is also the only
      degradation level in 13 §13.6 that blocks a user function entirely, which is
      why it is a problem type and not a `degradedReason`.
    sources: ["ADR-0024: scanner unreachable → `503`", "REQ-SEC-092, REQ-MED-013"]

  - token: payload-too-large
    status: 413
    since: 0
    summary: >
      The request body exceeds the JSON limit, or a bulk operation exceeds its entry
      limit.
    carries:
      - "the limit that was exceeded, so a client can chunk rather than guess"
    notes: >
      DECIDED 2026-09-11 as open point O24. 08 §8.2's status list did not include 413 and
      nothing else named one, so this sat in `pending` — while REQ-NFR-078 (stage 0)
      requires an oversized body to be rejected by `api` as application/problem+json and
      NOT by `web` as an nginx HTML page. A requirement due at stage 0 cannot depend on an
      undecided status code. 413 is RFC 9110 §15.5.14 and the only defensible answer; the
      status list in 08 §8.2 now carries it.
    sources:
      - "08 §8.2 security table: JSON max. 1 MB, bulk operations max. 500 entries"
      - "REQ-SEC-065, REQ-NFR-078, RFC 9110 §15.5.14"

  - token: method-not-allowed
    status: 405
    since: 0
    summary: "The path exists and does not support this method."
    notes: >
      ADDED 2026-09-12, with `not-acceptable` and `unsupported-media-type`. All
      three are produced by Spring's own request matching before a handler runs,
      and all three are reachable today: `POST /api/v1/items/{id}` is a 405.
      Without a token each of them was an error response with a shape of its own,
      which is precisely what `REQ-API-003` forbids.
    carries:
      - "`Allow`, naming the methods the path does support (RFC 9110 §15.5.6)"
    sources: ["RFC 9110 §15.5.6", "REQ-API-003"]

  - token: not-acceptable
    status: 406
    since: 0
    summary: >
      The caller's `Accept` header allows no representation this endpoint can
      produce.
    notes: >
      Every endpoint answers `application/json`, and errors `application/problem+json`
      — which RFC 9457 §3 makes acceptable to a client that asked for JSON, and
      which is sent regardless, because an error that cannot be represented is
      still an error the caller has to be told about.
    sources: ["RFC 9110 §15.5.7", "RFC 9457 §3", "REQ-API-003"]

  - token: unsupported-media-type
    status: 415
    since: 0
    summary: "The request's `Content-Type` is not one this endpoint reads."
    notes: >
      About the header, not about the bytes. An upload whose *content* is a type
      this system does not store is `validation-failed` with a `422`, decided by
      `MediaTypeDetector` after sniffing — a different condition with a different
      answer, and deliberately a different token (REQ-MED-004).
    sources: ["RFC 9110 §15.5.16", "REQ-API-003"]

  - token: internal-error
    status: 500
    since: 0
    summary: >
      Something failed that the application does not have a specific answer for.
      The request may be repeatable; nothing about what went wrong is disclosed.
    carries:
      - "`traceId`, and nothing else — the operator's log line is the detail"
    notes: >
      ADDED 2026-09-12. `REQ-API-003` requires one error format on every endpoint,
      and until this existed an unexpected exception left through Spring Boot's
      own `/error` handler as `{"timestamp": ..., "error": ...}` — a second,
      undocumented shape, on the one path a client is least able to anticipate.


      The `detail` is a fixed sentence. An exception message is written for an
      operator and regularly contains a query, a path or an identifier, and the
      `traceId` is what connects the caller's report to the line that has all of
      it (`REQ-NFR-042`).
    sources: ["08 §8.2: every error is problem+json", "REQ-API-003, REQ-NFR-042"]

  - token: plugin-unavailable
    status: 503
    since: 1
    summary: >
      A plugin the requested ACTION depends on cannot be reached — its circuit is open,
      its deadline expired, or it is disabled.
    notes: >
      DECIDED 2026-09-11 as open point O25, and the decision is the boundary rather than
      the code. The registry noted that both a problem type and a `degradedReason` were
      defensible, and they are — for different cases:

        * the ACTION cannot be performed (print to a printer plugin, deliver through a
          channel plugin, store through a BlobStore plugin) -> this token, 503. Nothing
          happened, and the client must be told so;
        * the action SUCCEEDED and something derived from it is poorer (no enrichment
          proposals, an upload queued rather than stored remotely) -> a 200 with
          meta.degraded and the matching degradedReason in degraded-reasons.yaml.

      Stated that way the two registries stop overlapping: a problem type means the
      request did not do what it said; a degradedReason means it did, less well. The
      `scan-unavailable` entry above is the same shape, and is the reason ADR-0024 makes
      it a refusal rather than a degradation.
    sources:
      - "05 §5.8: the circuit breaker fails immediately and visibly instead of piling up"
      - "13 §13.6, one-plugin row; ADR-0006, REQ-PLG-007"

  - token: tenant-inaccessible
    status: 403
    since: 1
    summary: >
      The tenant is suspended, or pending deletion within its grace period. One token for
      both states, deliberately.
    notes: >
      DECIDED 2026-09-11 as open point O26. Two tokens would tell a caller which of the
      two states a tenant is in, and that is an existence-and-status oracle over a
      boundary the rest of the design closes carefully (REQ-SEC-025, REQ-IDENT-014, and
      the `not-found` entry above, which must not be split for the same reason). A member
      of the tenant learns the state from the administration UI, where they are already
      authenticated and entitled to it; the API says only that the tenant cannot be acted
      on.

      403 rather than 404: the caller is a member and the tenant's existence is not a
      secret from them. 503 was rejected — suspension is not a transient condition and
      Retry-After would be a lie.
    sources:
      - "04 §4.3 `tenancy`: Tenant states; 05 §5.9: access blocked immediately"
      - "REQ-TEN-011, REQ-SEC-082"

  - token: federated-flow-unknown
    status: 410
    since: 1
    summary: >
      The sign-in this callback belongs to is unknown, expired or already
      finished; start again from the sign-in page.
    notes: >
      The `state` parameter carries a single-use handle to server-side flow state
      (ADR-0029), and this is what a replayed callback gets — which is the property
      REQ-AUTH-005 is verified by. Also what an expired one gets, after ten minutes.
      410 rather than 400: the handle was well-formed and is gone, and the caller's
      way out is to begin again rather than to correct anything.

      It says nothing about whether the handle ever existed. A token that
      distinguished "never seen" from "already spent" would let somebody probe for
      sign-ins in flight.
    sources:
      - "REQ-AUTH-005, ADR-0029"

  - token: federated-identity-unlinked
    status: 403
    since: 1
    summary: >
      The provider verified who you are and no account here is linked to that
      identity; sign in and link it from your account settings.
    notes: >
      The refusal REQ-AUTH-006 exists for. A verified address that matches an
      existing account is NOT permission to sign in as it, so an unlinked identity is
      refused even when the address is one this instance knows — and the message is
      the same either way, because a different one would be an account oracle.

      An instance with `HOMEINV_REGISTRATION_MODE=open` may instead CREATE an account
      here (REQ-AUTH-004); this token is what the other two modes answer.
    sources:
      - "REQ-AUTH-005, REQ-AUTH-006, REQ-SEC-020"

  - token: federated-address-taken
    status: 409
    since: 1
    summary: >
      This instance creates accounts, and the address the provider verified
      already has one; sign in with it and link the provider deliberately.
    notes: >
      Only reachable on an `open` instance, where the alternative would have been to
      create a second account on an address that already has one. Linking the
      existing account instead is a decision for the person who owns it, taken while
      signed in and re-confirmed (REQ-AUTH-006) — never a consequence of somebody
      arriving with a token that carries the same string.
    sources:
      - "REQ-AUTH-004, REQ-AUTH-006"

  - token: federated-address-unverified
    status: 403
    since: 1
    summary: >
      The provider did not confirm the address it reported, so no account can
      be created from it.
    notes: >
      An unverified address is a claim about somebody else: a provider that lets a
      person type any address and hands it on unverified would otherwise create an
      account here in that person's name. The core treats an unverified address as
      absent, which is what the `IdentityProvider` port's own contract says.

      It refuses only the CREATION. An identity already linked to an account signs in
      whatever the address says, because the link is on `(issuer, subject)`.
    sources:
      - "REQ-AUTH-004, REQ-AUTH-006"

  - token: federated-identity-linked-elsewhere
    status: 409
    since: 1
    summary: >
      That provider identity is already linked to another account here.
    notes: >
      A link is unique on `(issuer, subject)` instance-wide: two accounts on one
      foreign identity would make every later sign-in ambiguous, and an ambiguity
      resolved by taking the first row is an account takeover with an ordering bug in
      front of it. The way out is to unlink it on the account that holds it.
    sources:
      - "REQ-AUTH-005, REQ-AUTH-006"
