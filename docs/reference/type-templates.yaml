  - key: software-licence
    kind: DIGITAL
    labels:
      en: Software licence
      de: Softwarelizenz
    # REQ-CORE-004's four fields are the first four here, and they are the reason
    # this template exists: "a digital item has no physical location but instead a
    # carrier/account, licence key, expiry date and seat count". The licence key
    # is `sensitive` and therefore stored encrypted (ADR-0019) — and therefore not
    # searchable, sortable or facetable, which the type editor would refuse.
    #
    # It is NOT required (decided 2026-09-13): a licence is often recorded before
    # the key is to hand, and a required field somebody may not read is a field
    # they cannot supply — a lock in the wrong place.
    fields:
      - key: carrier
        labels: { en: Carrier or account, de: Träger oder Konto }
        dataType: text
        searchable: true
        facetable: true
      - key: licenceKey
        labels: { en: Licence key, de: Lizenzschlüssel }
        dataType: secret
        sensitive: true
      - key: expiresOn
        labels: { en: Expires on, de: Läuft ab am }
        dataType: date
        sortable: true
      - key: seats
        labels: { en: Seats, de: Sitzplätze }
        dataType: integer
        sortable: true
      - key: vendor
        labels: { en: Vendor, de: Anbieter }
        dataType: text
        searchable: true
        facetable: true
      - key: edition
        labels: { en: Edition, de: Edition }
        dataType: text
        facetable: true
      - key: licenceType
        labels: { en: Licence type, de: Lizenzart }
        dataType: text
        facetable: true
      - key: purchasedOn
        labels: { en: Purchased on, de: Gekauft am }
        dataType: date
        sortable: true
      - key: purchasePrice
        labels: { en: Purchase price, de: Kaufpreis }
        dataType: money
        sortable: true
      - key: renewal
        labels: { en: Renews automatically, de: Verlängert sich automatisch }
        dataType: boolean
        facetable: true
      - key: portalUrl
        labels: { en: Vendor portal, de: Anbieterportal }
        dataType: url
      - key: supportEmail
        labels: { en: Support address, de: Support-Adresse }
        dataType: email

