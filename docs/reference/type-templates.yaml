# Home Inventory — the shipped item type templates (REQ-CORE-030)
#
# THIS FILE IS THE SOURCE OF TRUTH FOR WHAT A TEMPLATE CONTAINS.
#
# `REQ-CORE-030` names eight templates — book, tool, appliance, furniture,
# clothing, software licence, document, food — and says what a tenant may do with
# one: "importable and fully editable". It says nothing about which fields each
# brings, and that is what this file decides, in one place a person can read
# rather than scattered across a seeding class nobody opens.
#
# The same treatment `docs/reference/permissions.yaml` and
# `docs/reference/problem-types.yaml` get, for the same reason: a list that lives
# only in code is a list that changes without anybody noticing it changed.
#
# ---------------------------------------------------------------------------
# A TEMPLATE IS A STARTING POINT, NOT A CONTRACT
#
# Importing one creates an ordinary item type with an ordinary published version.
# Nothing afterwards remembers it came from here: the tenant renames fields, adds
# its own, deprecates the ones it does not want, and the template is not consulted
# again. That is what "fully editable" means, and it is why a template may be
# generous — a field nobody fills costs an empty row on a form, while a field
# nobody has costs somebody the work of adding it.
#
# Decided 2026-09-13, with the owner: the templates are DETAILED, 8–12 fields
# each, rather than minimal.
#
# ---------------------------------------------------------------------------
# THE RULES A FIELD HERE OBEYS
#
#   * `key` is the attribute key, stable and lower camel case. It appears inside
#     every item written against the type, so it is chosen once.
#   * `labels` carries `en` and `de`. A tenant's own name for a field is data and
#     lives in the row; these are the names the template arrives with.
#   * `sensitive: true` means the value is stored encrypted (ADR-0019). Such a
#     field may NOT also be searchable, sortable or facetable — the index would
#     hold ciphertext and match nothing — and the type editor refuses the
#     combination, so this file may not state it either.
#   * `searchable`, `sortable`, `facetable` decide what `item_attr_index` mirrors.
#     Marked where a person would plausibly filter or sort by the value, and left
#     off free text, which full-text search covers anyway.
#   * `unit` belongs to `quantity` and `money` carries its currency per value, so
#     no template states a currency.

schemaVersion: 1
updated: 2026-09-13

