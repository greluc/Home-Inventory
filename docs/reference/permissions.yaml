# Home Inventory — the permission catalogue and the built-in role ladder
#
# THE REGISTRY FOR `<block>:<resource>:<action>` (04 §4.3, REQ-SEC-022…025).
#
# Why this file exists and is not merely documentation:
#
#   * a permission id ends up in a tenant-owned role definition (stage 1), in an
#     audit entry, and in the log line of every denial. All three outlive the Java
#     constant that produced them, so the ID is DATA and is written down where
#     data lives;
#   * `AuthorizationRegistryTest` compares this file against
#     `de.greluc.homeinv.authorization.api.Permission` and `…api.Role` on every
#     build. A permission added in code and not here fails, and so does the
#     reverse — the same drift mechanism `problem-types.yaml` uses for the RFC
#     9457 tokens.
#
# THE LADDER IS A FLOOR, NOT THE FINAL WORD. Stage 1 adds tenant-owned roles that
# EXTEND these (04 §4.3); they grant combinations of the same permissions. A
# tenant never defines a new permission — that would be a tenant defining what
# the application does, which is the line ADR-0020 draws.

schemaVersion: 1
updated: 2026-09-13

# ---------------------------------------------------------------------------
# PERMISSIONS
#
# `<block>:<resource>:<action>`. The block segment is the building block that
# owns the resource, which is what makes the id readable without a lookup: a
# reviewer seeing `inventory:item:delete` in an audit entry knows where to look.
# ---------------------------------------------------------------------------
permissions:
  - id: inventory:item:read
    since: 0
    description: Read one item, or list them.
  - id: inventory:item:create
    since: 0
    description: Create an item.
  - id: inventory:item:update
    since: 0
    description: Change an item's fields.
  - id: inventory:item:delete
    since: 0
    description: >
      Delete an item. Two-stage from stage 1 (REQ-CORE-009), which is what makes
      granting it to MEMBER reasonable rather than reckless.


  - id: inventory:item:purge
    since: 1
    description: >
      Remove an item for good, with its attachments. The second stage of
      REQ-CORE-009 and the one that cannot be undone, which is why it is not
      `inventory:item:delete`: trashing is a decision a person can change their
      mind about, and somebody may be trusted with that and not with this.
  - id: locations:location:read
    since: 0
    description: Read a location and its subtree.
  - id: locations:location:create
    since: 0
    description: Create a location.
  - id: locations:location:update
    since: 0
    description: Rename or move a location.
  - id: locations:location:delete
    since: 0
    description: >
      Delete a location. Refused while it still holds anything, so this cannot
      orphan an item.

  - id: search:index:query
    since: 0
    description: >
      Search across the tenant's items. Deliberately separate from
      `inventory:item:read`: reading a list you were pointed at and finding
      anything in the tenant are different capabilities, because a search surface
      is also an enumeration surface.

  - id: search:saved-search:write
    since: 1
    description: >
      Create or change a saved search (`REQ-SRCH-008`). Separate from
      `search:index:query`, which is reading: a saved search belongs to the
      tenant and everybody in it sees the same list, so adding one is a change to
      what everybody sees. Reading them needs only the query permission — a list
      of questions is not more sensitive than the answers.

  - id: search:saved-search:delete
    since: 1
    description: >
      Delete a saved search (`REQ-SRCH-008`). Its own permission because it takes
      a list away from everybody, which is an administrator's to do and not a
      member's. Removal is outright: nothing points at a saved search, so a
      tombstone would be retention without a reason, and the revision log answers
      who removed it.

  - id: media:object:read
    since: 0
    description: Read a media object's metadata and obtain a signed URL for it.
  - id: media:object:create
    since: 0
    description: Upload a media object and attach it.
  - id: media:object:delete
    since: 0
    description: Detach or delete a media object.

  - id: catalog:type:read
    since: 1
    description: >
      Read the tenant's type system — types, location categories, their fields
      and the JSON Schema of a version. Held by every role including the share
      link: a client that cannot read the definitions cannot label the values it
      is already showing, so withholding this hides nothing and breaks the form.
  - id: catalog:type:create
    since: 1
    description: Create an item type or a location category.
  - id: catalog:type:update
    since: 1
    description: >
      Change a type, add a field, tighten an inherited one, publish a version.
      The editing capability of REQ-CORE-020 — "without a release and without a
      restart" — and therefore the one a tenant administrator is given and a
      member is not.
  - id: catalog:type:delete
    since: 1
    description: >
      Archive a type, or finally remove a deprecated field. The second destroys
      the values under that field, which is why REQ-CORE-026 makes it show the
      affected set first and why it is not `catalog:type:update`.

  - id: catalog:value-list:read
    since: 1
    description: Read a value list and its entries, which an enumeration field draws on.
  - id: catalog:value-list:create
    since: 1
    description: Create a value list.
  - id: tagging:tag:read
    since: 1
    description: Read the tenant's tags and the groups they sit in.
  - id: tagging:tag:create
    since: 1
    description: Create a tag or a tag group.
  - id: tagging:tag:update
    since: 1
    description: >
      Rename a tag, recolour it, move it between groups, or merge two. Editing the
      vocabulary, which is a different capability from using it.
  - id: tagging:tag:assign
    since: 1
    description: >
      Put a tag on an item or a place, or take one off. Held by everybody who
      works with the inventory, including a contributor who may not edit the tag
      list itself.

  - id: catalog:value-list:update
    since: 1
    description: >
      Add an entry, relabel one, or archive one. There is no delete: an entry an
      item already carries may not be removed, for the reason ADR-0020 gives for
      never dropping a field.

  - id: tenancy:tenant:read
    since: 1
    description: Read the tenant's own record — its name and its settings.
  - id: tenancy:tenant:update
    since: 1
    description: Rename the tenant, or change its settings.

  - id: tenancy:member:read
    since: 1
    description: See who else is in this tenant, and in what role.
  - id: tenancy:member:invite
    since: 1
    description: Invite somebody into the tenant, and list the invitations that are open.
  - id: tenancy:member:update
    since: 1
    description: >
      Change a member's role. Bounded by REQ-TEN-010 on top of the permission: it
      does not let somebody grant a role whose permissions they do not hold, and
      OWNER is grantable only by an OWNER.
  - id: tenancy:member:remove
    since: 1
    description: Remove somebody from the tenant, and withdraw an unused invitation.


  - id: identity:service-account:administer
    since: 1
    description: >
      Issue, list and revoke the tenant's machine tokens (REQ-AUTH-010). A token
      carries one of the six roles, so whoever may hand one out may hand out that
      role — which is why ADMIN and OWNER hold this and nobody else does, and why
      issuing one asks for the second factor again (REQ-AUTH-011).

  - id: tenancy:tenant:delete
    since: 1
    description: >
      Ask for the tenant to be erased (REQ-TEN-011). The one permission OWNER
      holds and ADMIN does not, and the reason the two are finally different sets
      rather than only different in what they may grant: erasing a tenant is the
      act nobody can undo once the grace period is over.

# ---------------------------------------------------------------------------
# BUILT-IN ROLES
#
# The same six the `tenancy.membership` check constraint allows. Stage 0 only
# ever WROTE `OWNER` — the person who created the instance — but the whole ladder
# was defined at once, because a permission set that arrives one role at a time is
# one nobody ever reviews as a whole.
#
# THREE BANDS, and the line between them is what somebody is trusted with rather
# than how senior they are:
#
#   * CONTENT — the things in the inventory. Items, places, photos, tags. MEMBER
#     holds all of it, deletion and final removal included.
#   * CONFIGURATION — the shape those things have, and who may touch them. The
#     type system, the value lists, the members. ADMIN's.
#   * OWNERSHIP — the tenant itself. OWNER's.
#
# MEMBER held every permission there was until 2026-09-13, because stage 0 had no
# type system and no member administration to withhold. It now holds the content
# band; configuring the tenant is ADMIN's. ADMIN and OWNER hold the same
# permissions until REQ-TEN-011 adds tenant deletion; what already separates them
# is REQ-TEN-010 — only an OWNER may make somebody an OWNER, because ownership is
# a relationship rather than a permission set.
# ---------------------------------------------------------------------------
roles:
  - name: GUEST
    rationale: A share link. Reads what it was pointed at and cannot go looking.
    grants:
      - inventory:item:read
      - locations:location:read
      - media:object:read
      - catalog:type:read
      - catalog:value-list:read
      - tagging:tag:read

  - name: VIEWER
    rationale: >
      Adds search. That is the difference between being shown things and being
      able to find them, and it is a deliberate step rather than an oversight.
    grants:
      - inventory:item:read
      - locations:location:read
      - media:object:read
      - search:index:query
      - catalog:type:read
      - catalog:value-list:read
      - tagging:tag:read
      - tenancy:tenant:read

  - name: CONTRIBUTOR
    rationale: >
      Somebody helping with a stocktake. May add and may correct; may delete
      nothing, so a misunderstanding costs a duplicate rather than a loss.
    grants:
      - inventory:item:read
      - inventory:item:create
      - inventory:item:update
      - locations:location:read
      - locations:location:create
      - locations:location:update
      - media:object:read
      - media:object:create
      - search:index:query
      - catalog:type:read
      - catalog:value-list:read
      - tagging:tag:read
      - tagging:tag:assign
      - tenancy:tenant:read

  - name: MEMBER
    rationale: >
      The whole content band: everything in the inventory, deletion and final
      removal included, and the tag vocabulary — a tag is something people write
      rather than something the tenant is configured with. Not the type system:
      deciding what an item may look like is configuration, and that is ADMIN's.
    grants:
      - inventory:item:read
      - inventory:item:create
      - inventory:item:update
      - inventory:item:delete
      - inventory:item:purge
      - locations:location:read
      - locations:location:create
      - locations:location:update
      - locations:location:delete
      - media:object:read
      - media:object:create
      - media:object:delete
      - search:index:query
      - catalog:type:read
      - catalog:value-list:read
      - tagging:tag:read
      - tagging:tag:create
      - tagging:tag:update
      - tagging:tag:assign
      - search:saved-search:write
      - tenancy:tenant:read
      - tenancy:member:read

  - name: ADMIN
    rationale: >
      The content band plus configuration: the type system, the value lists, and
      the members — inviting, promoting, removing. Equal to OWNER in permissions
      until REQ-TEN-011 adds tenant deletion; what already separates them is
      REQ-TEN-010.
    grants:
      - inventory:item:read
      - inventory:item:create
      - inventory:item:update
      - inventory:item:delete
      - inventory:item:purge
      - locations:location:read
      - locations:location:create
      - locations:location:update
      - locations:location:delete
      - media:object:read
      - media:object:create
      - media:object:delete
      - search:index:query
      - catalog:type:read
      - catalog:type:create
      - catalog:type:update
      - catalog:type:delete
      - catalog:value-list:read
      - catalog:value-list:create
      - catalog:value-list:update
      - tagging:tag:read
      - tagging:tag:create
      - tagging:tag:update
      - tagging:tag:assign
      - search:saved-search:write
      - search:saved-search:delete
      - tenancy:tenant:read
      - tenancy:tenant:update
      - tenancy:member:read
      - tenancy:member:invite
      - tenancy:member:update
      - tenancy:member:remove
      - identity:service-account:administer

  - name: OWNER
    rationale: >
      The person the tenant belongs to. Equal to ADMIN in permissions today and
      not in authority: only an OWNER may make somebody an OWNER (REQ-TEN-010),
      and tenant deletion (REQ-TEN-011) will be the permission the two sets differ
      by.
    grants: all

# ---------------------------------------------------------------------------
# ENTITLEMENTS
#
# NOT permissions, and kept apart from them for a reason rather than for tidiness
# (ADR-0057). A permission is evaluated against the role a session holds IN THE
# TENANT IT ACTS FOR; an entitlement is a flag on the account itself, read where
# there is no tenant at all — creating one's first tenant, administering the
# instance. No tenant can grant one: a tenant that could hand out "may create a
# tenant" would be handing out the right to create a second one.
#
# The ids are shaped like permission ids on purpose. They end up in the same
# audit entries and the same denial log lines, and a reader should not have to
# know which of the two mechanisms produced one to know what was refused.
#
# `AuthorizationRegistryTest` compares this list against
# `de.greluc.homeinv.authorization.api.Entitlement` on every build, the same way
# it does for the permissions above.
# ---------------------------------------------------------------------------
entitlements:
  - id: instance:operator
    since: 1
    name: INSTANCE_OPERATOR
    description: >
      Administers the instance itself: grants entitlements, sets instance-wide
      quota defaults, installs plugins, and impersonates (REQ-SEC-072). Granted
      to the bootstrap account, and by an existing operator to anybody else.
    notable: >
      Grants nothing inside any tenant. Row-level security answers to
      `app.tenant_id` and not to who asked, so an operator who is not a member of
      a tenant reads none of its rows — which is why impersonation is its own
      audited, time-limited act rather than a side effect of this flag.

  - id: instance:tenant:create
    since: 1
    name: CREATE_TENANT
    description: >
      Creates tenants (REQ-TEN-002), bounded by the account's tenant limit or by
      the instance-wide `HOMEINV_TENANTS_PER_USER` default.
    notable: >
      Deliberately NOT implied by `instance:operator`, so that administering an
      instance does not silently accumulate tenants of one's own.
