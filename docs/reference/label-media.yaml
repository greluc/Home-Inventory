sheets:
  - id: avery-zweckform-3474
    vendor: Avery Zweckform
    articleNumber: "3474"
    name: Multi-purpose labels 70 × 37 mm
    kind: SHEET
    pageSize:  { width: 210.0, height: 297.0 }
    grid:      { columns: 3, rows: 8 }          # 24 per sheet
    label:     { width: 70.0, height: 37.0, cornerRadius: 0.0 }
    margin:    { left: 0.0, top: 0.5, right: 0.0, bottom: 0.5 }
    pitch:     { x: 70.0, y: 37.0 }             # marginless, no gaps
    verified: true
    verifiedOn: 2026-09-11
    sources:
      - "Avery Zweckform product page 3474 — 70 × 37 mm, 24 labels per sheet"
      - "glabels zweckform-iso-templates.xml: nx=3 ny=8 x0=0 y0=0 dx=70mm dy=37mm round=0"
    notes: >
      A marginless format: 3 × 70 mm = 210 mm is the full sheet width, hence no
      side margins and no column gaps. Vertically 297 − 8 × 37 = 1 mm remains,
      split evenly top and bottom. Two independent sources agree, so this entry
      is fully evidenced.

  - id: avery-zweckform-3667
    vendor: Avery Zweckform
    articleNumber: "3667"
    name: Multi-purpose labels 48.5 × 16.9 mm
    kind: SHEET
    pageSize:  { width: 210.0, height: 297.0 }
    grid:      { columns: 4, rows: 16 }         # 64 per sheet
    label:     { width: 48.5, height: 16.9, cornerRadius: 0.0 }
    margin:    { left: 8.0, top: 13.3, right: 8.0, bottom: 13.3 }   # DERIVED
    pitch:     { x: 48.5, y: 16.9 }                                  # DERIVED
    verified: false
    sources:
      - "Avery Zweckform Fachshop / Viking — 48.5 × 16.9 mm, 64 labels per sheet"
    notes: >
      The label size and the count are evidenced; the grid and the margins are
      NOT. 4 × 16 is the only plausible split of 64 at this width, but whether
      the 16 mm of leftover width sit as side margins or as column gaps cannot
      be decided from the available sources. Before release: check against the
      manufacturer's data sheet, or measure with the calibration sheet.

