# Home Inventory — label geometries (LabelMedia)
#
# The starter catalogue for the `LabelMediaCatalog` (see 10 §10.5). This file is
# the seed source: during implementation it is loaded into `labeling.label_media`
# and is extendable in the UI afterwards (extension level 1).
#
# NOTE — `verified` is not decoration but the central statement of each entry:
#   verified: true   Dimensions, grid, margins AND pitch come from the
#                    manufacturer's data sheet or a verified template file.
#                    The source and the verification date are in the entry.
#   verified: false  At least one value is derived or comes from a retail
#                    source. The calibration sheet is mandatory before any
#                    bulk print.
#
# Why the distinction matters (REQ-LBL-004, REQ-LBL-007):
#   From label size and count the grid can be guessed, but NOT how the leftover
#   space is distributed. With 64 labels of 48.5 mm across 210 mm of width,
#   16 mm are left over — that could be 8 mm of margin on each side, OR gaps
#   between the columns, OR both. All three look identical on the first label
#   and diverge from the fourth column onwards. That is exactly why nothing is
#   marked verified that was merely calculated.
#
# Unit: millimetres. The origin is the top-left corner of the sheet.

schemaVersion: 1
