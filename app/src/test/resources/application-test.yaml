spring:
  datasource:
    username: homeinv_app
    password: test-app

  data:
    redis:
      username: ""
      password: ""

  rabbitmq:
    username: guest
    password: guest

  flyway:
    enabled: true
    user: homeinv_migrator
    password: test-migrator
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

homeinv:
  rate-limit:
    per-user-per-minute: 1000000
    per-tenant-per-minute: 1000000
    per-address-per-minute: 1000000
    auth-per-minute: 1000000
  graphql:
    free-form: ANYONE
  security:
    url-signing-key-file: build/resources/test/db/test-url-signing.key
    credential-key-file: build/resources/test/db/test-credential.key
    data-encryption-master-key-file: build/resources/test/db/test-data-encryption.key
    data-encryption-master-key-version: 2
    data-encryption-previous-master-key-file: build/resources/test/db/test-data-encryption-previous.key

  public-base-url: "http://app.localhost:8080"
  media-base-url: "http://media.localhost:8080"

  trusted-proxies: "127.0.0.1/32,::1/128"

  ingress-host: "web.invalid"

springdoc:
  api-docs:
    enabled: true
  cache:
    disabled: true
