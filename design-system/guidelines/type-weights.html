<!-- @dsCard group="Type" viewport="700x150" name="Weights & families" subtitle="Three weights only — 400 / 500 / 600. Nothing heavier." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weights & families</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}</style>
</head>
<body>
<div class="r" style="gap:20px">
<div class="g" style="gap:2px"><span style="font-size:18px;font-weight:400">Regular 400</span><span class="x">Body text, values</span></div>
<div class="g" style="gap:2px"><span style="font-size:18px;font-weight:500">Medium 500</span><span class="x">Labels, table names, buttons</span></div>
<div class="g" style="gap:2px"><span style="font-size:18px;font-weight:600">SemiBold 600</span><span class="x">Headings, column heads, active tab</span></div>
<div class="g" style="gap:2px"><span style="font-size:18px;font-family:var(--font-mono)">Plex Mono 400</span><span class="x">Codes, IDs, expressions</span></div>
</div>
</body>
</html>
