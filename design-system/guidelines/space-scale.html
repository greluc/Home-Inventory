<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base with a 2px half-step" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}.b{display:grid;gap:4px;justify-items:center}.bar{background:var(--accent-tint);border:1px solid var(--accent-fg);height:28px}</style>
</head>
<body>
<div class="r" style="align-items:flex-end;gap:10px"><div class="b"><div class="bar" style="width:2px"></div><span class="n">2</span><span class="x">025</span></div><div class="b"><div class="bar" style="width:4px"></div><span class="n">4</span><span class="x">050</span></div><div class="b"><div class="bar" style="width:6px"></div><span class="n">6</span><span class="x">075</span></div><div class="b"><div class="bar" style="width:8px"></div><span class="n">8</span><span class="x">100</span></div><div class="b"><div class="bar" style="width:12px"></div><span class="n">12</span><span class="x">150</span></div><div class="b"><div class="bar" style="width:16px"></div><span class="n">16</span><span class="x">200</span></div><div class="b"><div class="bar" style="width:20px"></div><span class="n">20</span><span class="x">250</span></div><div class="b"><div class="bar" style="width:24px"></div><span class="n">24</span><span class="x">300</span></div><div class="b"><div class="bar" style="width:32px"></div><span class="n">32</span><span class="x">400</span></div><div class="b"><div class="bar" style="width:40px"></div><span class="n">40</span><span class="x">500</span></div><div class="b"><div class="bar" style="width:48px"></div><span class="n">48</span><span class="x">600</span></div><div class="b"><div class="bar" style="width:64px"></div><span class="n">64</span><span class="x">800</span></div></div>
</body>
</html>
