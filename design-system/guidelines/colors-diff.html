<!-- @dsCard group="Colors" viewport="700x160" name="Diff colours" subtitle="Base / mine / theirs in the conflict resolver — plus an icon and a word, always" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diff colours</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}.d{flex:1 1 0;min-width:150px;display:grid;gap:4px;padding:8px;border-radius:var(--radius-1)}</style>
</head>
<body>
<div class="r">
<div class="d" style="background:var(--diff-base-bg);border:1px solid var(--diff-base-border);color:var(--diff-base-fg)"><span class="lb">Common ancestor</span><span style="font-size:13px">Drill</span><span class="n">--diff-base-*</span></div>
<div class="d" style="background:var(--diff-mine-bg);border:1px solid var(--diff-mine-border);color:var(--diff-mine-fg)"><span class="lb">This device</span><span style="font-size:13px">Cordless drill GSB 18V-55</span><span class="n">--diff-mine-*</span></div>
<div class="d" style="background:var(--diff-theirs-bg);border:1px solid var(--diff-theirs-border);color:var(--diff-theirs-fg)"><span class="lb">Server</span><span style="font-size:13px">Drill, blue</span><span class="n">--diff-theirs-*</span></div>
</div>
</body>
</html>
