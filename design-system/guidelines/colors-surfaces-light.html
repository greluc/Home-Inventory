<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — light" subtitle="Authored independently: paper greys, white cards on a tinted page" -->
<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<title>Surfaces — light</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}</style>
</head>
<body>
<div class="r"><div class="sw"><div class="ch" style="background:var(--surface-sunken)"></div><span class="v">sunken</span><span class="n">--surface-sunken</span><span class="x">#edeff1</span></div><div class="sw"><div class="ch" style="background:var(--surface-base)"></div><span class="v">base · the page</span><span class="n">--surface-base</span><span class="x">#f4f5f6</span></div><div class="sw"><div class="ch" style="background:var(--surface-raised)"></div><span class="v">raised · cards</span><span class="n">--surface-raised</span><span class="x">#ffffff</span></div><div class="sw"><div class="ch" style="background:var(--surface-overlay)"></div><span class="v">overlay</span><span class="n">--surface-overlay</span><span class="x">#ffffff</span></div><div class="sw"><div class="ch" style="background:var(--surface-input)"></div><span class="v">input well</span><span class="n">--surface-input</span><span class="x">#ffffff</span></div><div class="sw"><div class="ch" style="background:var(--surface-selected)"></div><span class="v">selected row</span><span class="n">--surface-selected</span><span class="x">#e7effb</span></div></div>
</body>
</html>
