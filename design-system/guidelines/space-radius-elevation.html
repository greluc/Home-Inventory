<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & elevation" subtitle="Square or barely rounded; two elevation steps, both functional" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Radii & elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}.e{flex:1 1 0;min-width:130px;display:grid;gap:6px;padding:12px;background:var(--surface-raised);border:1px solid var(--border-default)}</style>
</head>
<body>
<div class="r" style="gap:12px">
<div class="e" style="border-radius:var(--radius-0)"><span class="v">0 — Tabellenzeile, Statusleiste</span><span class="n">--radius-0</span></div>
<div class="e" style="border-radius:var(--radius-1)"><span class="v">2 — Button, Input, Chip</span><span class="n">--radius-1</span></div>
<div class="e" style="border-radius:var(--radius-2)"><span class="v">3 — Karte, Modal, Foto</span><span class="n">--radius-2</span></div>
<div class="e" style="border-radius:var(--radius-2);box-shadow:var(--elev-2);background:var(--surface-overlay)"><span class="v">elev-2 — nur Overlay</span><span class="n">--elev-2</span></div>
<div class="e" style="border-radius:var(--radius-pill);padding:8px 16px;justify-items:center"><span class="v">pill</span><span class="x">nur Scan-Modus, Avatar, Zähler</span></div>
</div>
</body>
</html>
