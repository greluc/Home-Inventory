<!-- @dsCard group="Colors" viewport="700x150" name="Semantic states — light" subtitle="Designed, not dimmed: different hues, verified separately" -->
<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<title>Semantic states — light</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}</style>
</head>
<body>
<div class="r"><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-success-bg);border:1px solid var(--state-success-border);color:var(--state-success-fg);font-weight:600;font-size:11px">Erfolg</div><span class="n">state.success</span><span class="x">5.05 · 4.62</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-warning-bg);border:1px solid var(--state-warning-border);color:var(--state-warning-fg);font-weight:600;font-size:11px">Warnung</div><span class="n">state.warning</span><span class="x">5.92 · 5.43</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-danger-bg);border:1px solid var(--state-danger-border);color:var(--state-danger-fg);font-weight:600;font-size:11px">Fehler</div><span class="n">state.danger</span><span class="x">5.93 · 5.11</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-conflict-bg);border:1px solid var(--state-conflict-border);color:var(--state-conflict-fg);font-weight:600;font-size:11px">Konflikt</div><span class="n">state.conflict</span><span class="x">6.70</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-degraded-bg);border:1px solid var(--state-degraded-border);color:var(--state-degraded-fg);font-weight:600;font-size:11px">Notbetrieb</div><span class="n">state.degraded</span><span class="x">6.24</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-offline-bg);border:1px solid var(--state-offline-border);color:var(--state-offline-fg);font-weight:600;font-size:11px">Offline</div><span class="n">state.offline</span><span class="x">7.95 — farblos</span></div><div class="sw" style="min-width:104px"><div class="ch" style="display:grid;place-items:center;background:var(--state-restricted-bg);border:1px solid var(--state-restricted-border);color:var(--state-restricted-fg);font-weight:600;font-size:11px">Gesperrt</div><span class="n">state.restricted</span><span class="x">3.75 + Schraffur</span></div></div>
</body>
</html>
