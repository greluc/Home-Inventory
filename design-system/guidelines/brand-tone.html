<!-- @dsCard group="Brand" viewport="700x190" name="Voice" subtitle="Say the state, then the way out. No apologies, no exclamation marks." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:14px;background:var(--surface-base);font-size:12px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:96px;display:grid;gap:4px}.ch{height:40px;border-radius:var(--radius-1);border:1px solid var(--border-subtle)}.n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0}.v{font-size:11px;color:var(--text-secondary);font-weight:500}.x{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:10px}.lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}.q{flex:1 1 0;min-width:220px;display:grid;gap:6px;padding:10px;border:1px solid var(--border-default);border-radius:var(--radius-1);background:var(--surface-raised)}.y{color:var(--state-success-fg);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}.no{color:var(--state-danger-fg);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}</style>
</head>
<body>
<div class="r" style="gap:10px">
<div class="q"><span class="y">Do</span><span style="font-size:13px">Offline — changes are stored locally and reconciled at the next connection.</span><span class="no" style="margin-top:4px">Not this</span><span style="font-size:13px;color:var(--text-muted)">Oops! No connection 😕</span></div>
<div class="q"><span class="y">Do</span><span style="font-size:13px">This field is not visible to your role.</span><span class="no" style="margin-top:4px">Not this</span><span style="font-size:13px;color:var(--text-muted)">••••••••••••</span></div>
<div class="q"><span class="y">Do</span><span style="font-size:13px">2 items are waiting for a decision.</span><span class="no" style="margin-top:4px">Not this</span><span style="font-size:13px;color:var(--text-muted)">A synchronisation error occurred!</span></div>
</div>
</body>
</html>
