[package]
name = "homeinv-blobstore"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The in-deployment BlobStore for Home Inventory"
license = "AGPL-3.0-or-later"
repository = "https://github.com/greluc/Home-Inventory"
publish = false

[dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "net"] }
tokio-stream = "0.1"
futures-core = "0.3"
sha2 = "0.11"
hex = "0.4"
rustls-pki-types = { version = "1", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["std", "v7"] }
async-stream = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
