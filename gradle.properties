# Java 25 is the language level (ADR-0001). Gradle itself runs on whatever JDK
# launches it; the toolchain below decides what the code is compiled against, so
# a contributor on JDK 21 builds the same bytes as CI.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is OFF, and not by preference.
# `com.google.protobuf` 0.9.5 holds a `Project` and a `SourceDirectorySet` in its
# task state, which the configuration cache cannot serialise, so every build that
# generates the plugin contract fails while it is on. Turning it on again is a
# one-line change once the plugin supports it:
# <https://github.com/google/protobuf-gradle-plugin/issues/717>.
# The build cache above is unaffected and stays on.
org.gradle.configuration-cache=false

# Keep the daemon small enough to run beside a container stack on a laptop.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
