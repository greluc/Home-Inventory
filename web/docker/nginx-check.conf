#
# A minimal nginx configuration used at BUILD time only, to check that the
# generated site configuration parses.
#
# It exists because `nginx -t` does everything a start does, upstream name
# resolution included, and `api` does not resolve inside a container build. The
# Dockerfile rewrites that one name to a literal address and points this file at
# the result, so every other line is verified — which is what a build can verify.
#
# It is never used at run time. The image's own nginx.conf is.

events {}

http {
    include /tmp/check-site.conf;
}
