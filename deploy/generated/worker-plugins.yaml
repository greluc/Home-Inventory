      # carries the `host:port` of every object store this deployment may reach, and
      # a tenant that configures an endpoint outside that list gets a refusal from the
      # proxy rather than a connection (ADR-0027).

      apiVersion: home-inv.plugin/v1

      metadata:
        id: de.greluc.homeinv.plugin.blobstore.s3
        name: "S3 object storage"
        version: "0.1.0"
        vendor: "greluc"
        license: "AGPL-3.0-or-later"
        homepage: "https://github.com/greluc/Home-Inventory"
        descriptions:
          en: "Stores a tenant's media in an S3-compatible bucket, signed with Signature Version 4."
          de: "Legt die Medien eines Mandanten in einem S3-kompatiblen Bucket ab, signiert mit Signature Version 4."   # spelling-exempt: a manifest's own multilingual DATA

      spec:
        contract: ">=1.0.0 <2.0.0"
        runtime: out-of-process

        implements:
          - port: BlobStore
            priority: 100

        capabilities:
          # A `tcp:` target and not a `hosts:` one: what runs inside the tunnel is
          # HTTPS this plugin terminates itself, so the proxy sees a host and a port
          # and never a URL (O11, ADR-0027). The port is part of the allowance --
          # "the object store, on any port" is not what an operator meant.
          - id: network:outbound
            tcp: ["objects.example.org:443"]
            reason: "Storing and reading this tenant's media in its bucket"
          # Without this the plugin has only the deployment's bucket to write to, and
          # a tenant that configured its own account would be storing in the
          # operator's (ADR-0073, ADR-0074).
          - id: core:setting:read
            reason: "Reading the bucket and keys this tenant configured"

        settings:
