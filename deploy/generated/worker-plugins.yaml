# GENERATED FROM ../services.yaml — DO NOT EDIT.
#
# Run `python deploy/generate.py` after changing the matrix. CI regenerates
# this file and fails on any difference, so an edit here is lost and noticed
# rather than lost and not (REQ-NFR-063).

#
# WHAT THE OPERATOR INSTALLED. The core reads this and nothing else: it
# fetches nothing and it installs nothing, because installation is an
# operator's act outside the running system (REQ-PLG-013).
#
# Each entry carries its manifest INLINE. The alternative -- a path per
# entry and a file per plugin -- is a path that can be right here and
# wrong in the mount, and nothing would say which.

plugins:
  - id: de.greluc.homeinv.plugin.webhook
    endpoint: "plugin-webhook:8200"
    fingerprint: "@FINGERPRINT:mtls-plugin-webhook@"
    publicKey: "@PUBKEY:cosign-plugin-webhook@"
    manifestInline: |
      # SPDX-FileCopyrightText: Lucas Greuloch
      # SPDX-License-Identifier: AGPL-3.0-or-later
      #
      # The manifest `plugin-webhook` ships as its reference.
      #
      # THE ONE THE CORE READS IS THE ONE THE OPERATOR MOUNTS. A registration names a
      # manifest file on the deployment's own filesystem, generated from
      # `deploy/services.yaml` beside the container, the network segment and the
      # egress allowlist (REQ-PLG-013). That is not a formality: `spec.capabilities`
      # below carries the HOSTS this plugin may reach, and which receivers a
      # deployment allows is the operator's decision rather than the plugin author's.
      #
      # So this file is the template and the documentation of what to declare. The
      # `hosts` entry is deliberately an example that reaches nothing real.

      apiVersion: home-inv.plugin/v1

      metadata:
        id: de.greluc.homeinv.plugin.webhook
        name: "Webhook"
        version: "0.1.0"
        vendor: "greluc"
        license: "AGPL-3.0-or-later"
        homepage: "https://github.com/greluc/Home-Inventory"
        descriptions:
          en: "Delivers a notification to a URL as a signed JSON POST."
          de: "Stellt eine Benachrichtigung als signierten JSON-POST an eine URL zu."   # spelling-exempt: a manifest's own multilingual DATA

      spec:
        contract: ">=1.0.0 <2.0.0"
        runtime: out-of-process

        implements:
          - port: NotificationChannel
            priority: 100

        capabilities:
          # WHERE THIS DEPLOYMENT MAY SEND. Compiled into the egress proxy's allowlist,
          # which is the enforcement point: no container runtime can express a hostname
          # rule of its own (ADR-0027). A tenant that configures a webhook to a host
          # outside this list is refused by the proxy, visibly, with a message naming
          # the host -- and adding one is an operator's edit to `deploy/services.yaml`,
          # not something the running system can do to itself (REQ-PLG-013).
          - id: network:outbound
            hosts: ["hooks.example.org"]
            reason: "Delivering notifications to the receivers this deployment allows"
          # WHAT THE TENANT CONFIGURED may be sent to this plugin. Since ADR-0073 this
          # is what the capability means: not "the plugin may fetch its settings" --
          # nothing fetches -- but "the core may send them". Without it the signing
          # secret never leaves the core and this plugin delivers nothing.
          #
          # THERE IS NO `settings:` BLOCK BELOW, AND THIS CAPABILITY IS STILL THE GATE.
          # The signing secret is per webhook TARGET and not per tenant (ADR-0077): one
          # secret for a tenant would let every receiver that tenant configured forge a
          # delivery to every other one. It therefore lives beside the target, in
          # `notification.webhook_target`, and the core lays it over this plugin's
          # settings in the envelope of the one call that delivers to that target --
          # under this capability, which a tenant can still withdraw. A `settings:`
          # entry for it would show an administrator a field that changes nothing.
          - id: core:setting:read
            reason: "Sending the signing secret a tenant agreed with the receiver of one target"

        health:
          endpoint: /healthz
          intervalSeconds: 60

        resources:
          # A socket in, a socket out, and no state. The budget is the one ADR-0072
          # argues the language choice from: five JVMs would not have fitted
          # REQ-NFR-009's sum of reservations, and this is what the alternative costs.
          memoryMiB: 32
          timeoutSeconds: 15
