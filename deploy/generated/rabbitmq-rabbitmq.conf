#
# The broker's first user. RabbitMQ 4 refuses to start when it finds the
# deprecated RABBITMQ_DEFAULT_* variables, so the credential travels as a
# configuration file - rendered by deploy/setup.sh, which substitutes the
# value from deploy/secrets/mq-password and never commits it.
#
# `guest` is loopback-only by design and is left alone: api and worker
# connect over the network and could never have used it (ADR-0044).

default_user = homeinv
default_pass = @SECRET:mq-password@

# The management plugin listens on 15672 and is not published anywhere.
# It stays on because the image is the `-management` tag and removing it
# would mean a different image, not a smaller one.
loopback_users.guest = true
