# Home Inventory — the service matrix
#
# THIS FILE IS THE SOURCE OF TRUTH FOR THE DEPLOYMENT TOPOLOGY.
#
# The Quadlet units under deploy/quadlet/ and compose.yaml under deploy/compose/
# are GENERATED from it; the Helm chart under deploy/helm/ is VALIDATED against
# it. Editing a generated artifact by hand fails the drift check in CI
# ([ADR-0021](../docs/adr/0021-podman-quadlet.md), REQ-NFR-063).
#
# Why it exists: two hand-maintained descriptions of the same topology diverge —
# not if, but when. And the failure shows up at an operator's site, on the
# runtime we did not test, which is the worst place to find it (risk R13).
#
# Status: seed. The values below follow the architecture but nothing generates
# from them yet, because there is no code to deploy. Image digests are marked
# TODO deliberately — a tag here would defeat the digest-pinning rule.

version: 1

defaults:
  # Applies to every service unless overridden below. The security keys are
  # requirements, not preferences (REQ-SEC-085) — but "non-root" means "not uid 0",
  # NOT "uid 10001 everywhere". See the note on `user` below.
  user: "10001:10001"           # first-party images only — third-party images override it
  readOnlyRootFilesystem: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
  restart: on-failure           # crash handling
  startOnBoot: true             # → Quadlet: WantedBy=default.target
                                # → Compose: restart: unless-stopped
                                # The two runtimes express "come back after a reboot"
                                # differently; the generator maps this key, and that is
                                # exactly the kind of divergence this file exists to absorb.
                                #
                                # THE TWO KEYS COLLIDE UNDER COMPOSE, and the generator
                                # resolves it rather than leaving it to chance: Compose
                                # has ONE `restart` field, so it cannot express both
                                # "on-failure" and "come back after a reboot".
                                # startOnBoot WINS — `restart: unless-stopped`, which
                                # restarts on failure too and additionally survives a
                                # reboot. What is lost is the narrower semantics of
                                # on-failure: under Compose a container stopped by the
                                # operator stays stopped, but one that exits 0 on its own
                                # is restarted, where Quadlet's Restart=on-failure would
                                # leave it. No shipped service exits 0 on its own, so the
                                # difference is theoretical — but an undocumented
                                # generator decision is how the two paths drift (risk R13).
  autoUpdate: disabled          # images are digest-pinned; updates are deliberate

# WHY EVERY THIRD-PARTY SERVICE OVERRIDES `user` AND `tmpfs`
#
# REQ-SEC-085 requires a non-root user and a read-only root filesystem. It does
# not require one specific uid, and applying 10001 to an upstream image breaks it:
#
#   postgres     runs as uid 70 (alpine). initdb refuses to start under a uid with
#                no /etc/passwd entry, and the unix socket needs /var/run/postgresql.
#   opensearch   runs as uid 1000 and writes to config/, logs/ and /tmp.
#   rabbitmq     runs as uid 999 and writes to /etc/rabbitmq and /var/log/rabbitmq.
#   valkey       runs as uid 999.
#   clamav       runs as uid 100 and writes to /run/clamav and /tmp.
#
# 06 §6.5 already records that these images use different inside-UIDs — this file
# has to say so too, or the generated units describe a stack that cannot start.
# Each service therefore names its own uid and its own writable paths; the CI check
# asserts "uid != 0 and readOnlyRootFilesystem: true", not a fixed number.

networks:
  # NO segment gives the core a route out of the deployment (ADR-0026). "edge"
  # means "has published ports", not "can call out" — a published port is
  # forwarded into the container namespace and needs no outward route.
  # See A5 in ADR-0000: that this holds under rootless Podman/pasta and rootless
  # Docker is a verification item, with a named fallback if it does not.
  #
  # ZONE 4 IS NOT ONE ROOM (ADR-0037). There used to be a single `plugins`
  # segment holding every plugin, clamav, the proxy, api and worker. On it, a
  # plugin holding NO capability at all could read the core's management port
  # (per-tenant metrics), stop the fail-closed scanner and thereby block every
  # upload, and use another plugin's forwarding port on the proxy. One segment
  # per plugin costs n generated networks and closes all three structurally.
  # MEASURED 2026-09-11, and it contradicted the design (A5, ADR-0042): under
  # Docker a container on an `internal: true` network gets NO port mapping at all
  # — `docker port` is empty and the port is unreachable — while a non-internal
  # network, the only kind that publishes, ALWAYS grants outbound. "Publishes a
  # port" and "has no route out" cannot both hold for one container. So exactly
  # two segments are non-internal, each with exactly one member, and both members
  # hold no data, no credential and no domain logic.
  edge:
    internal: false             # web only. Publishes 8080 and proxies to api over
                                # `internal`. api publishes NOTHING and is not here.
    members: [web]
  egress:
    internal: false             # egress-proxy only — the route the chokepoint needs.
    members: [egress-proxy]     # It sat on internal segments alone until 2026-09-11,
                                # which meant the one component whose job is the
                                # outbound call could not make one.
  internal:
    internal: true              # no route out of the deployment, at all.
                                # The management listener binds HERE and nowhere
                                # else — see api.ports below.
  scanner:
    internal: true
    members: [worker, clamav, egress-proxy]
    egressVia: egress-proxy     # freshclam only, to the deployment allowlist
                                # entry below (ADR-0036). `api` is deliberately
                                # absent: the scan runs in the worker, never in
                                # the request path (ADR-0024).
  # One segment per installed plugin, GENERATED from the plugin services below.
  # Template, not a literal entry — there is no plugin service in this seed yet.
  "plugin-<id>":
    generated: perPlugin
    internal: true              # plugin containers get NO gateway of their own
    members: ["plugin-<id>", api, worker, egress-proxy]
    egressVia: egress-proxy     # the single exception, and it is a container,
                                # not a route: the plugin reaches it by HTTPS_PROXY
                                # and it applies that plugin's manifest allowlist
                                # (ADR-0027). A hostname rule is not expressible
                                # in netavark, Compose or standard NetworkPolicy,
                                # which is exactly why this is a proxy and not a
                                # network flag.
                                # The proxy has one interface per segment and
                                # identifies the caller by the interface the
                                # connection arrived on — not by a source address
                                # it claims, which is what it did while every
                                # plugin shared one segment.

volumes:
  pgdata:   { service: postgres }
  osdata:   { service: opensearch }
  mqdata:   { service: rabbitmq }
  kvdata:   { service: valkey }
  cvddata:  { service: clamav }

services:

  web:
    role: static
    image: { name: ghcr.io/greluc/home-inv-web, digest: "TODO" }
    networks: [edge, internal]
    # THE INGRESS (ADR-0042). It is the only container with a published port, and
    # it proxies /api, /graphql, /c/, /.well-known and the SSE stream to `api`
    # over `internal`. api itself publishes nothing and is not on `edge`, which is
    # stricter than the previous shape and costs one host port rather than adding
    # a container.
    #
    # It also serves the application shell AND every security header — CSP, HSTS,
    # COOP, CORP, Referrer-Policy, Permissions-Policy (ADR-0038; COEP is
    # deliberately absent, ADR-0040). Letting the operator's reverse proxy serve
    # the bundle instead is NOT supported: the header set would live outside this
    # repository and REQ-SEC-060's CI comparison would have nothing to compare.
    # The CSP authorises the one inline script — the theme bootstrap that beats
    # first paint — by HASH, not by a nonce, because nothing that emits a static
    # document can mint one.
    #
    # It has an outbound route, because `edge` must be non-internal for the port
    # to work at all. That is acceptable for exactly the reason it is acceptable
    # for egress-proxy: it holds no data, no secret and no domain logic
    # (REQ-SEC-102).
    # nginx-unprivileged listens on 8080 inside. ONE published host port for the
    # whole deployment, and therefore one firewall rule — see 06 §6.3. It used to
    # be two, 8080 for api and 8081 for web, until api stopped publishing.
    ports: [{ container: 8080, host: 8080 }]
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    dependsOn: [api]
    # Raised from 32/128Mi: it is on the request path for every API call now, not
    # only for static files.
    resources: { memoryReservation: 64Mi, memoryLimit: 256Mi }
    health: { command: "/healthcheck", interval: 15s }
    profiles: [minimal, standard, ha]

  api:
    role: api
    image: { name: ghcr.io/greluc/home-inv, digest: "TODO" }
    networks: [internal]                         # NOT edge: api publishes nothing and
                                                 # is reached through web (ADR-0042)
    networksByPlugin: all                        # plus one membership per installed
                                                 # plugin segment, generated (ADR-0037)
    ports:
      - { container: 8080, host: null }          # reached by web over `internal`
      - { container: 8090, host: null, bindTo: internal }
                                                 # management: /actuator, /livez, /readyz
                                                 # NOT published AND bound to the internal
                                                 # segment only. host: null hides it from
                                                 # the host; it does NOT hide it from a
                                                 # container on the same segment, and api
                                                 # sits on every plugin segment. Without
                                                 # bindTo, any plugin could read the
                                                 # per-tenant metrics of 13 §13.3 without
                                                 # holding a single capability
                                                 # (ADR-0037, REQ-SEC-099).
    env:
      SPRING_PROFILES_ACTIVE: "api,${HOMEINV_PROFILE}"
      MANAGEMENT_SERVER_PORT: "8090"
      MANAGEMENT_SERVER_ADDRESS: "${INTERNAL_ADDR}"           # bindTo, resolved by the generator
      HOMEINV_TRUSTED_PROXIES: "${HOMEINV_TRUSTED_PROXIES}"   # required, REQ-SEC-063
    # NO db-migration-password. It is mounted into the one-shot `migrate` service
    # and nowhere else (ADR-0041, REQ-SEC-101): homeinv_migrator owns the tables
    # and can rewrite an RLS policy, and mounting it into a long-running,
    # internet-facing process for that process's whole life undoes part of what
    # ADR-0003 buys. api VALIDATES the schema at startup and refuses to start
    # against one it does not expect.
    secrets: [db-password, data-key, jwt-key]
    tmpfs: ["/tmp"]
    dependsOn: [postgres, valkey, migrate]      # migrate must have exited 0
    resources: { memoryReservation: 768Mi, memoryLimit: 1536Mi, cpuQuota: "200%" }
    health: { command: "/usr/bin/healthcheck", interval: 15s, startPeriod: 90s, notify: healthy }
    profiles: [minimal, standard, ha]

  worker:
    role: worker
    image: { name: ghcr.io/greluc/home-inv, digest: "TODO" }   # the SAME image as api
    networks: [internal, scanner]
    networksByPlugin: all                        # plus one membership per installed
                                                 # plugin segment, generated (ADR-0037)
    ports:
      - { container: 8090, host: null, bindTo: internal }      # same reasoning as api
    env:
      SPRING_PROFILES_ACTIVE: "worker,${HOMEINV_PROFILE}"
      MANAGEMENT_SERVER_PORT: "8090"
      MANAGEMENT_SERVER_ADDRESS: "${INTERNAL_ADDR}"
      HOMEINV_DB_MIGRATE_ON_START: "false"       # validates the schema, never changes it
    secrets: [db-password, data-key]
    tmpfs: ["/tmp"]
    # rabbitmq exists only in standard and ha (see its own `profiles`). A flat
    # dependsOn would generate Requires=homeinv-rabbitmq.service into the minimal
    # profile, where that unit does not exist — the stack would not start.
    dependsOn: [postgres, clamav]
    dependsOnByProfile:
      standard: [rabbitmq]
      ha:       [rabbitmq]
    resources: { memoryReservation: 512Mi, memoryLimit: 1536Mi, cpuQuota: "200%" }
    health: { command: "/usr/bin/healthcheck", interval: 15s, startPeriod: 90s, notify: healthy }
    profiles: [minimal, standard, ha]

  migrate:
    role: migrate
    lifecycle: oneShot            # → Quadlet: [Service] Type=oneshot, RemainAfterExit=yes
                                  # → Compose: restart: "no", and api/worker depend on it
                                  #            with condition: service_completed_successfully
                                  # → Helm:    the pre-upgrade Job that already existed
                                  # Success is exit 0. api and worker do not start otherwise.
    image: { name: ghcr.io/greluc/home-inv, digest: "TODO" }   # the SAME image again
    networks: [internal]          # it talks to PostgreSQL and to nothing else
    env:
      SPRING_PROFILES_ACTIVE: "migrate"
      HOMEINV_DB_MIGRATE_ON_START: "true"
    # THE ONLY SERVICE THAT GETS THE MIGRATION CREDENTIAL (ADR-0041, REQ-SEC-101).
    # No data-key, no jwt-key: Flyway performs DDL and reads no tenant data.
    secrets: [db-migration-password]
    tmpfs: ["/tmp"]
    dependsOn: [postgres]
    resources: { memoryReservation: 256Mi, memoryLimit: 512Mi }
    profiles: [minimal, standard, ha]
    notes: >
      Four documents described this migration three different ways — at startup
      (05 §5.11), as its own step (06 §6.12), as a Kubernetes Job (06 §6.8) — and
      this file described none of them: no core service held db-migration-password,
      so the generated units described a stack that could not migrate. One one-shot
      service on all three runtimes settles it, and keeps homeinv_migrator out of
      every long-running process. It has no health check because it is not expected
      to stay alive; the generator omits the key for lifecycle: oneShot rather than
      failing the "every service declares a health check" rule.

  postgres:
    image: { name: docker.io/library/postgres, tag: "18-alpine", digest: "TODO" }
    user: "70:70"                 # the image's own postgres user; 10001 breaks initdb
    networks: [internal]
    volumes: [{ name: pgdata, path: /var/lib/postgresql/data }]
    tmpfs: ["/tmp", "/var/run/postgresql"]          # the unix socket lives here
    secrets: [db-password, db-migration-password]
    resources: { memoryReservation: 1Gi, memoryLimit: 2Gi }
    health: { command: "pg_isready", interval: 10s }
    profiles: [minimal, standard, ha]
    notes: >
      Requires the ltree extension. The application role has no DDL rights and no
      BYPASSRLS; migrations run under a separate role (REQ-SEC-002, REQ-SEC-003).
      The two roles are created by an init script, not by the image — the image
      only knows POSTGRES_PASSWORD_FILE for the superuser.

  valkey:
    image: { name: docker.io/valkey/valkey, tag: "8-alpine", digest: "TODO" }
    user: "999:1000"              # the image's own valkey user
    networks: [internal]
    volumes: [{ name: kvdata, path: /data }]
    tmpfs: ["/tmp"]
    resources: { memoryReservation: 128Mi, memoryLimit: 256Mi }
    health: { command: "valkey-cli ping", interval: 10s }
    profiles: [minimal, standard, ha]
    notes: >
      AOF persistence is on. Valkey holds sessions, rate-limit counters and the
      short-lived OIDC state — all recoverable by re-login or by retrying the
      login. Idempotency records deliberately do NOT live here: they are written to
      PostgreSQL in the same transaction as the record they protect (ADR-0009), so
      a Valkey outage cannot produce a duplicate.

  clamav:
    image: { name: docker.io/clamav/clamav, tag: "stable", digest: "TODO" }
    user: "100:101"               # the image's own clamav user
    networks: [scanner]           # NOT a plugin segment: on the old shared one, a
                                  # plugin could reach clamd and stop it, and with a
                                  # fail-closed scan that blocks every upload in the
                                  # instance (ADR-0037, REQ-SEC-098).
    volumes: [{ name: cvddata, path: /var/lib/clamav }]
    tmpfs: ["/tmp", "/run/clamav", "/var/log/clamav"]
    resources: { memoryReservation: 1Gi, memoryLimit: 1536Mi }
    health: { command: "clamdcheck.sh", interval: 60s, startPeriod: 300s }
    profiles: [minimal, standard, ha]
    egress:
      via: egress-proxy
      allowlistEntry: clamav-signature-mirror    # the deployment allowlist, ADR-0036
      configuredBy: freshclam.HTTPProxyServer    # NOT HTTPS_PROXY — freshclam reads
                                                 # its proxy from its own config file
    files:
      # A6, decided 2026-09-11. Generated from the egress block above and delivered
      # read-only through each runtime's file-mount mechanism, because a read-only
      # root filesystem and no bind mounts (ADR-0022) leave no other way in.
      # It is NOT a secret; only the delivery path is shared with secrets.
      - target: /etc/clamav/freshclam.conf
        generatedFrom: egress
        expected: expected/clamav-freshclam.conf   # the fixture CI compares against
        deliveredBy:
          podman: "secret type=mount"
          docker: "secret"
          kubernetes: "ConfigMap"
        notes: >
          A thin first-party image with the setting baked in was rejected: it would
          put our rebuild, trivy scan and cosign signature between the scanner and
          its daily signature updates — the exact dependency ADR-0036 removes.
    notes: >
      Mandatory in every profile — the malware scan cannot be deselected
      (ADR-0024). It is why the minimal profile needs about 3.4 GB rather than 1.5.
      Its signature updates were the one dependency nothing traced: this segment is
      internal, the proxy did not run in `minimal`, and the proxy's allowlist was
      generated from plugin manifests, which a scanner does not have. All three are
      fixed in ADR-0036; without them stage 0 would ship a mandatory, fail-closed
      scanner whose signatures freeze at the image build date.

  egress-proxy:
    image: { name: ghcr.io/greluc/home-inv-egress-proxy, digest: "TODO" }
    networks: [scanner, egress]   # `egress` is non-internal and is its route out.
                                  # Without it this container sat only on internal
                                  # segments and could not make the very call it
                                  # exists to make (measured 2026-09-11, ADR-0042).
    networksByPlugin: all         # one interface per plugin segment, generated
    ports:
      - { container: 8118, host: null }   # HTTP/CONNECT, one listener per segment
                                          # interface. Never published to the host.
    tmpfs: ["/tmp", "/var/run"]
    resources: { memoryReservation: 16Mi, memoryLimit: 32Mi }
    health: { command: "/healthcheck", interval: 30s }
    profiles: [minimal, standard, ha]
                                  # EVERY profile since ADR-0036. `minimal` runs no
                                  # plugin, but it does run the mandatory scanner,
                                  # and that scanner's signatures have to come from
                                  # somewhere. Listing it as [standard, ha] is what
                                  # left `minimal` with a fail-closed scan and no
                                  # way to update what it scans against.
    allowlist:
      # SOURCE 1 — per plugin, from granted manifests. Reloaded on grant/revoke.
      fromGrantedManifests: true
      # SOURCE 2 — the deployment allowlist (ADR-0036). Fixed, shipped with the
      # image, consented to by nobody. CLOSED in the same sense as the
      # instance-wide table list in 07 §7.1: a new entry needs a row here and a
      # sentence saying why that service cannot be a plugin.
      deployment:
        - id: clamav-signature-mirror
          caller: clamav
          reason: >
            ClamAV is in-deployment infrastructure with no manifest, no capability
            grant and no per-tenant consent, so it cannot use source 1. The mirror
            sits behind a CDN with rotating addresses, which is precisely why
            ADR-0027 chose hostname allowlisting over CIDR.
    notes: >
      The single route out of the deployment (ADR-0027). Plugin containers get no
      gateway of their own and reach it via HTTPS_PROXY; clamav reaches it via
      freshclam's own proxy setting. Its allowlist has the two sources above. It
      speaks HTTP and CONNECT only, and never terminates TLS — it sees host and
      port, never content, so a compromise here does not yield any plugin's
      credentials. It refuses private, link-local and cloud-metadata ranges
      outright and resolves names itself rather than trusting the caller. A
      redirect to an undeclared host fails because it needs a new CONNECT the
      allowlist rejects — NOT because the proxy inspects the redirect, which under
      CONNECT it cannot see. Every attempt is logged with caller, target and
      outcome; that log is the source for the per-resolver disclosure REQ-ENR-009
      requires.
      The caller is identified by the SEGMENT INTERFACE the connection arrived on,
      one per plugin (ADR-0037). It used to be identified by source address on a
      shared segment, where plugin A could also use plugin B's forwarding port.
      It has two modes: HTTP/CONNECT for the usual targets, and plain TCP
      forwarding to an exact host:port for non-HTTP ones — plugin-smtp being the
      case that forced it (ADR-0027 §3). TCP mode forwards bytes only, so STARTTLS
      and implicit TLS both pass through untouched, each per-plugin listener binds
      to that plugin's interface alone, and both modes write the same access log.

  opensearch:
    image: { name: docker.io/opensearchproject/opensearch, tag: "3", digest: "TODO" }
    user: "1000:1000"             # the image's own opensearch user
    networks: [internal]
    volumes: [{ name: osdata, path: /usr/share/opensearch/data }]
    tmpfs: ["/tmp", "/usr/share/opensearch/logs", "/usr/share/opensearch/config"]
    secrets: [opensearch-admin-password]
    env:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/opensearch-admin-password
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"     # mlock needs a capability we drop; heap is
                                         # bounded by the memory limit instead
    hostPrerequisites:
      - key: vm.max_map_count
        value: 262144
        notes: >
          A HOST sysctl. It cannot be set from inside a rootless container, and the
          service user has no sudo — so it is a one-time root action at install time
          (a drop-in under /etc/sysctl.d), not something the stack can arrange for
          itself. The setup script checks it and aborts with a clear message; see
          06 §6.3. This is the one place where "rootless all the way down" needs a
          root action once, and saying so is better than letting the operator find
          out from an OpenSearch stack trace.
    resources: { memoryReservation: 1536Mi, memoryLimit: 2Gi }
    health: { command: "curl -fsS -k https://localhost:9200/_cluster/health", interval: 20s, startPeriod: 120s }
    profiles: [standard, ha]
    notes: "Not backed up — rebuildable from PostgreSQL (ADR-0008)."

  rabbitmq:
    image: { name: docker.io/library/rabbitmq, tag: "4-management-alpine", digest: "TODO" }
    user: "999:999"               # the image's own rabbitmq user
    networks: [internal]
    volumes: [{ name: mqdata, path: /var/lib/rabbitmq }]
    tmpfs: ["/tmp", "/var/log/rabbitmq", "/etc/rabbitmq"]
    resources: { memoryReservation: 256Mi, memoryLimit: 512Mi }
    health: { command: "rabbitmq-diagnostics -q ping", interval: 20s, startPeriod: 60s }
    profiles: [standard, ha]

secrets:
  # Passed as files, never as environment values holding the secret itself.
  # A missing secret aborts startup — there is no generated default (REQ-NFR-046).
  db-password:               { required: true }
  db-migration-password:
    required: true
    services: [migrate, postgres]
    notes: >
      Two mounts, and the difference between them is the point (ADR-0041,
      REQ-SEC-101). `migrate` USES it: it connects as homeinv_migrator and runs
      Flyway, then exits. `postgres` only CREATES the role with it, once, in its
      first-initialisation script — the image itself knows only
      POSTGRES_PASSWORD_FILE for the superuser. No long-running APPLICATION
      service holds it: not api, not worker. That is what the CI check asserts,
      and it is the property that keeps a compromise of the internet-facing
      process away from the one role that can rewrite an RLS policy.
  data-key:                  { required: true, notes: "Envelope encryption master key (ADR-0019). Backed up separately from the data." }
  jwt-key:                   { required: true, notes: "Ed25519 pair; two active versions during rotation." }
  opensearch-admin-password: { required: true, profiles: [standard, ha], notes: "Required by OpenSearch since 2.12; no default exists." }
  # Credentials for outbound targets (object storage, SMTP, OIDC) are deliberately
  # absent here: those connections leave the core entirely — see ADR-0026. They
  # belong to the plugin services that make them, and are added with those
  # services in the same change.

forbidden:
  # Checked in CI against every generated artifact and the Helm chart
  # (REQ-SEC-084). Listed here so the check has one place to read from.
  - privileged
  - cap_add
  - "pid: host"
  - "network_mode: host"
  - "user: root"                    # uid 0 in any form, not the literal string only
  - "SecurityLabelDisable=true"
  - container socket mounts
  - host ports below 1024
  - bind mounts into host directories

required:
  # The positive counterpart to `forbidden`, so the CI check reads both from one
  # place (REQ-SEC-085). Stated as properties, not as values: a fixed uid would be
  # wrong for every upstream image — see the note at the top of this file.
  - every service runs as a non-root user (uid != 0)
  - every service sets readOnlyRootFilesystem, and declares the paths it needs writable
  - every service drops all capabilities and sets no-new-privileges
  - every service declares a memory limit, and a health check unless lifecycle is oneShot
  - every image is referenced by digest
  - db-migration-password is mounted only into `migrate` (which uses it) and
    `postgres` (which creates the role with it at first init) — into no
    long-running application service
  # Topology properties, checked by the connectivity test rather than by reading
  # this file (ADR-0037, REQ-SEC-098/099)
  - every plugin sits on its own segment, alone among plugins
  - no plugin segment contains clamav
  - no management listener is reachable from a plugin segment
  - every outbound connection, from a plugin or from clamav, passes egress-proxy
  # ADR-0042. Verified by running the stack, not by reading this file.
  - exactly two containers sit on a non-internal segment — `web` and
    `egress-proxy` — and neither holds data, a credential or domain logic
  - api and worker sit on no non-internal segment and reach no external host
  - exactly one host port is published in the whole deployment

budget:
  # Stated because the sum of limits deliberately exceeds the VM, and a figure
  # nobody can derive from the table is worse than none (06 §6.7).
  minimal:  { reservations: ~3.4Gi, limits: ~6.9Gi }
  standard: { reservations: ~5.4Gi, limits: ~9.4Gi, plusPerPlugin: 256Mi }
  vm:       ">= 8Gi"
  note: >
    The reservations are the budget; the limits over-commit on purpose. Each limit
    is sized for that service's own worst case — a 500-code label sheet, an
    OpenSearch reindex, a large re-encode — and those do not coincide. Sizing every
    limit so the sum fits 8 GB would throttle each service to half of what it needs
    when it is the one working. Each container stays bounded, so a runaway service
    cannot take the host; that is what the limits are for. `ha` does not
    over-commit, because it runs on >= 16 GB across several nodes.
