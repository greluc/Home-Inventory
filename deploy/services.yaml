version: 1

defaults:
  user: "10001:10001"
  readOnlyRootFilesystem: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
  restart: on-failure
  startOnBoot: true
  autoUpdate: disabled

networks:
  edge:
    internal: false
  egress:
    internal: false
  internal:
    internal: true
  frontend:
    internal: true
  scanner:
    internal: true
    egressVia: egress-proxy
  "plugin-<id>":
    generated: perPlugin
    internal: true
    members: ["plugin-<id>", api, worker, egress-proxy]
    egressVia: egress-proxy

volumes:
  pgdata:   { service: postgres }
  pgwal:    { service: postgres }
  osdata:   { service: opensearch }
  mqdata:   { service: rabbitmq }
  kvdata:   { service: valkey }
  cvddata:  { service: clamav }
  blobdata: { service: blobstore }

services:

  web:
    role: static
    image: { name: ghcr.io/greluc/home-inv-web }
    networks: [edge, frontend]
    ports: [{ container: 8080, host: 8080 }]
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    dependsOn: [api]
    resources: { memoryReservation: 64Mi, memoryLimit: 256Mi }
    health: { command: "/healthcheck", interval: 15s }
    profiles: [minimal, standard, ha]

  api:
    role: api
    image: { name: ghcr.io/greluc/home-inv }
    networkAliases:
      internal: api-internal
    networks: [internal, frontend]
    networksByPlugin: all
    ports:
      - { container: 8080, host: null }
      - { container: 8090, host: null, bindTo: internal }
      - { container: 8091, host: null }
    env:
      SPRING_PROFILES_ACTIVE: "api"
      SPRING_PROFILES_INCLUDE: "${HOMEINV_PROFILE}"
      HOMEINV_DB_URL: "jdbc:postgresql://postgres:5432/homeinv"
      HOMEINV_DB_USER: "homeinv_app"
      HOMEINV_PLUGINS_FILE: "${HOMEINV_PLUGINS_FILE:-}"
      HOMEINV_TRACING_ENDPOINT: "${HOMEINV_TRACING_ENDPOINT:-}"
      MANAGEMENT_SERVER_PORT: "8090"
      MANAGEMENT_SERVER_ADDRESS: "api-internal"
      HOMEINV_PLUGIN_HOST_PORT: "${HOMEINV_PLUGIN_HOST_PORT:-0}"
      HOMEINV_TRUSTED_PROXIES: "${HOMEINV_TRUSTED_PROXIES}"
      HOMEINV_PUBLIC_BASE_URL: "${HOMEINV_PUBLIC_BASE_URL}"
      HOMEINV_MEDIA_BASE_URL: "${HOMEINV_MEDIA_BASE_URL}"
      HOMEINV_BLOBSTORE_ENDPOINT: "blobstore:8100"
      HOMEINV_BLOBSTORE_FINGERPRINT: "${HOMEINV_BLOBSTORE_FINGERPRINT}"
      HOMEINV_VALKEY_HOST: "valkey"
      HOMEINV_VALKEY_USER: "homeinv"
      HOMEINV_MQ_HOST: "rabbitmq"
      HOMEINV_MQ_USER: "homeinv"
      HOMEINV_SEARCH_USER: "homeinv"
      HOMEINV_SEARCH_ENGINE: "${HOMEINV_SEARCH_ENGINE:-postgresql}"
      HOMEINV_SEARCH_URL: "https://opensearch:9200"
      HOMEINV_SEARCH_FINGERPRINT: "${HOMEINV_SEARCH_FINGERPRINT}"
    files:
      - target: /run/secrets/plugins.yaml
        generatedFrom: plugins
        notes: >
          WHAT THE OPERATOR INSTALLED, generated from the `role: plugin` services
          in this file (REQ-PLG-013). Each entry carries its manifest inline, so
          this is one file rather than one per plugin plus a path in each entry —
          a path is a thing that can be right in the list and wrong in the mount.
          The core reads it at start-up, fetches nothing and installs nothing.
    secrets:
      - db-password
      - data-encryption-master-key
      - jwt-signing-key
      - url-signing-key
      - credential-key
      - valkey-password
      - mq-password
      - search-password
      - mtls-core
    tmpfs: ["/tmp"]
    dependsOn: [postgres, valkey, rabbitmq, migrate, bootstrap, blobstore]
    resources: { memoryReservation: 768Mi, memoryLimit: 1536Mi, cpuQuota: "200%" }
    health: { command: "/usr/bin/healthcheck", interval: 15s, startPeriod: 90s, notify: healthy }
    profiles: [minimal, standard, ha]

  worker:
    role: worker
    image: { name: ghcr.io/greluc/home-inv }
    networkAliases:
      internal: worker-internal
    networks: [internal, scanner]
    networksByPlugin: all
    ports:
      - { container: 8090, host: null, bindTo: internal }
    env:
      SPRING_PROFILES_ACTIVE: "worker"
      SPRING_PROFILES_INCLUDE: "${HOMEINV_PROFILE}"
      HOMEINV_DB_URL: "jdbc:postgresql://postgres:5432/homeinv"
      HOMEINV_DB_USER: "homeinv_app"
      HOMEINV_PLUGINS_FILE: "${HOMEINV_PLUGINS_FILE:-}"
      HOMEINV_TRACING_ENDPOINT: "${HOMEINV_TRACING_ENDPOINT:-}"
      MANAGEMENT_SERVER_PORT: "8090"
      MANAGEMENT_SERVER_ADDRESS: "worker-internal"
      HOMEINV_TRUSTED_PROXIES: "${HOMEINV_TRUSTED_PROXIES}"
      HOMEINV_DB_MIGRATE_ON_START: "false"
      HOMEINV_PUBLIC_BASE_URL: "${HOMEINV_PUBLIC_BASE_URL}"
      HOMEINV_MEDIA_BASE_URL: "${HOMEINV_MEDIA_BASE_URL}"
      HOMEINV_BLOBSTORE_ENDPOINT: "blobstore:8100"
      HOMEINV_BLOBSTORE_FINGERPRINT: "${HOMEINV_BLOBSTORE_FINGERPRINT}"
      HOMEINV_VALKEY_HOST: "valkey"
      HOMEINV_VALKEY_USER: "homeinv"
      HOMEINV_MQ_HOST: "rabbitmq"
      HOMEINV_MQ_USER: "homeinv"
      HOMEINV_SEARCH_USER: "homeinv"
      HOMEINV_SEARCH_ENGINE: "${HOMEINV_SEARCH_ENGINE:-postgresql}"
      HOMEINV_SEARCH_URL: "https://opensearch:9200"
      HOMEINV_SEARCH_FINGERPRINT: "${HOMEINV_SEARCH_FINGERPRINT}"
    files:
      - target: /run/secrets/plugins.yaml
        generatedFrom: plugins
        notes: >
          WHAT THE OPERATOR INSTALLED, generated from the `role: plugin` services
          in this file (REQ-PLG-013). Each entry carries its manifest inline, so
          this is one file rather than one per plugin plus a path in each entry —
          a path is a thing that can be right in the list and wrong in the mount.
          The core reads it at start-up, fetches nothing and installs nothing.
    secrets:
      - db-password
      - data-encryption-master-key
      - url-signing-key
      - credential-key
      - valkey-password
      - mq-password
      - search-password
      - mtls-core
    tmpfs: ["/tmp"]
    dependsOn: [postgres, valkey, rabbitmq, migrate, clamav, blobstore]
    resources: { memoryReservation: 512Mi, memoryLimit: 1536Mi, cpuQuota: "200%" }
    health: { command: "/usr/bin/healthcheck", interval: 15s, startPeriod: 90s, notify: healthy }
    profiles: [minimal, standard, ha]

  migrate:
    role: migrate
    lifecycle: oneShot
    image: { name: ghcr.io/greluc/home-inv }
    networks: [internal]
    env:
      SPRING_PROFILES_ACTIVE: "migrate"
      HOMEINV_DB_MIGRATE_ON_START: "true"
      HOMEINV_DB_URL: "jdbc:postgresql://postgres:5432/homeinv"
      HOMEINV_DB_MIGRATION_USER: "homeinv_migrator"
    secrets: [db-migration-password]
    tmpfs: ["/tmp"]
    dependsOn: [postgres]
    resources: { memoryReservation: 256Mi, memoryLimit: 512Mi }
    profiles: [minimal, standard, ha]
    notes: >
      Four documents described this migration three different ways — at startup
      (05 §5.11), as its own step (06 §6.12), as a Kubernetes Job (06 §6.8) — and
      this file described none of them: no core service held db-migration-password,
      so the generated units described a stack that could not migrate. One one-shot
      service on all three runtimes settles it, and keeps homeinv_migrator out of
      every long-running process. It has no health check because it is not expected
      to stay alive; the generator omits the key for lifecycle: oneShot rather than
      failing the "every service declares a health check" rule.

  bootstrap:
    role: bootstrap
    lifecycle: oneShot
    image: { name: ghcr.io/greluc/home-inv }
    networks: [internal]
    env:
      SPRING_PROFILES_ACTIVE: "bootstrap"
      HOMEINV_DB_URL: "jdbc:postgresql://postgres:5432/homeinv"
      HOMEINV_DB_USER: "homeinv_app"
      HOMEINV_BOOTSTRAP_EMAIL: "${HOMEINV_BOOTSTRAP_EMAIL}"
      HOMEINV_BOOTSTRAP_DISPLAY_NAME: "${HOMEINV_BOOTSTRAP_DISPLAY_NAME}"
      HOMEINV_BOOTSTRAP_LOCALE: "${HOMEINV_BOOTSTRAP_LOCALE}"
      HOMEINV_BOOTSTRAP_TENANT_NAME: "${HOMEINV_BOOTSTRAP_TENANT_NAME}"
    secrets: [db-password, bootstrap-password]
    tmpfs: ["/tmp"]
    dependsOn: [postgres, migrate]
    resources: { memoryReservation: 256Mi, memoryLimit: 512Mi }
    profiles: [minimal, standard, ha]
    notes: >
      Added 2026-09-12 (ADR-0053). A fresh instance had no account and no tenant
      and nothing could create either, so nobody could sign in — stage 0's "an item
      can be created, photographed, stored and found again" was unreachable through
      the product. ADR-0028 already said the registration path is "the operator
      creating the first account directly" and never said how. Shaped like `migrate`
      for `migrate`'s reasons: the same image, a different process, and the most
      privileged action in the system kept out of the one that serves the internet.
      No health check, because it is not expected to stay alive.

  postgres:
    image: { name: ghcr.io/greluc/home-inv-postgres }
    user: "70:70"
    networks: [internal]
    volumes:
      - { name: pgdata, path: /var/lib/postgresql }
      - { name: pgwal,  path: /var/lib/homeinv/wal-archive }
    tmpfs: ["/tmp", "/var/run/postgresql"]
    env:
      POSTGRES_DB: "homeinv"
      POSTGRES_PASSWORD_FILE: "${SECRET_FILE:postgres-superuser-password}"
    settingsDelivery: postgresArgs
    settings:
      wal_level: replica
      archive_mode: "on"
      archive_command: "test ! -f /var/lib/homeinv/wal-archive/%f && cp %p /var/lib/homeinv/wal-archive/%f"
      archive_timeout: "900"
    secrets: [postgres-superuser-password, db-password, db-migration-password]
    resources: { memoryReservation: 1Gi, memoryLimit: 2Gi }
    health: { command: "pg_isready", interval: 10s }
    profiles: [minimal, standard, ha]
    notes: >
      Requires the ltree extension. The application role has no DDL rights and no
      BYPASSRLS; migrations run under a separate role (REQ-SEC-002, REQ-SEC-003).
      A THIRD role, homeinv_housekeeping, owns the retention deletions of ADR-0046:
      homeinv_app has only INSERT and SELECT on audit (REQ-SEC-069), so it cannot be
      the role that enforces a retention period, and homeinv_migrator must not be
      mounted into anything long-running (ADR-0041). All three are created by an init
      script, not by the image — the image only knows POSTGRES_PASSWORD_FILE for the
      superuser.

      The `pgwal` volume is the WAL archive (ADR-0045). It is exported with the daily
      dump and restored with it; without it REQ-NFR-014 promises an RPO of 15 minutes
      that nothing delivers.

  valkey:
    image: { name: docker.io/valkey/valkey, tag: "9-alpine", digest: "sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b" }
    user: "999:1000"
    networks: [internal]
    volumes: [{ name: kvdata, path: /data }]
    tmpfs: ["/tmp"]
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl", "--appendonly", "yes"]
    secrets: [valkey-password]
    files:
      - target: /etc/valkey/users.acl
        generatedFrom: secrets
        notes: >
          One ACL user, `homeinv`, with the password from the secret; `default` is
          disabled. Valkey held no credential at all until ADR-0044, which meant
          every session and every rate-limit counter was readable by anything that
          could open port 6379 on `internal` — including, at the time, `web`.
    resources: { memoryReservation: 128Mi, memoryLimit: 256Mi }
    health: { command: "valkey-cli ping", interval: 10s }
    profiles: [minimal, standard, ha]
    notes: >
      AOF persistence is on. Valkey holds sessions, rate-limit counters and the
      short-lived OIDC state — all recoverable by re-login or by retrying the
      login. Idempotency records deliberately do NOT live here: they are written to
      PostgreSQL in the same transaction as the record they protect (ADR-0009), so
      a Valkey outage cannot produce a duplicate.

  blobstore:
    image: { name: ghcr.io/greluc/home-inv-blobstore }
    networks: [internal]
    ports:
      - { container: 8100, host: null }
    secrets: [mtls-blobstore]
    volumes: [{ name: blobdata, path: /var/lib/homeinv/blobs }]
    tmpfs: ["/tmp"]
    resources: { memoryReservation: 32Mi, memoryLimit: 128Mi }
    health: { command: "/homeinv-blobstore --health", interval: 30s }
    profiles: [minimal, standard, ha]
    notes: >
      THE DEFAULT MEDIA STORE, and until 2026-09-11 it existed in no topology at
      all. `filesystem` is the default BlobStore and the only one `minimal` has,
      but there was no volume for it anywhere in this file, no mount on api or
      worker, and both are declared stateless with readOnlyRootFilesystem: true —
      so in `minimal` every photo and document had nowhere to be written and no
      backup row in 06 §6.13.

      Giving api and worker a shared volume instead would have been the smaller
      change and would have cost REQ-NFR-008: two api instances cannot share a
      local filesystem. Holding the volume in one small service keeps api and
      worker stateless and keeps the `ha` profile honest. It runs in every
      profile, because the filesystem adapter stays the default in every profile
      — `standard` may point media at plugin-blobstore-nextcloud, but print job
      artifacts (10 §10.6) and anything written before a plugin is granted still
      land here, and a profile-conditional service is not something this matrix
      can express.

  clamav:
    image: { name: docker.io/clamav/clamav, tag: "stable", digest: "sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422" }
    user: "100:101"
    networks: [scanner]
    volumes: [{ name: cvddata, path: /var/lib/clamav }]
    tmpfs: ["/tmp", "/run/clamav", "/var/lock", "/var/log/clamav"]
    resources: { memoryReservation: 1Gi, memoryLimit: 1536Mi }
    health: { command: "clamdcheck.sh", interval: 60s, startPeriod: 300s }
    profiles: [minimal, standard, ha]
    egress:
      via: egress-proxy
      allowlistEntry: clamav-signature-mirror
      configuredBy: freshclam.HTTPProxyServer
    files:
      - target: /etc/clamav/freshclam.conf
        generatedFrom: egress
        expected: expected/clamav-freshclam.conf
        deliveredBy:
          podman: "secret type=mount"
          docker: "secret"
          kubernetes: "ConfigMap"
        notes: >
          A thin first-party image with the setting baked in was rejected: it would
          put our rebuild, trivy scan and cosign signature between the scanner and
          its daily signature updates — the exact dependency ADR-0036 removes.
    notes: >
      Mandatory in every profile — the malware scan cannot be deselected
      (ADR-0024). It is why the minimal profile reserves about 3.7 GB rather than 1.5 —
      the figure in the budget block below, computed from the rows in this file.
      Its signature updates were the one dependency nothing traced: this segment is
      internal, the proxy did not run in `minimal`, and the proxy's allowlist was
      generated from plugin manifests, which a scanner does not have. All three are
      fixed in ADR-0036; without them stage 0 would ship a mandatory, fail-closed
      scanner whose signatures freeze at the image build date.

  egress-proxy:
    image: { name: ghcr.io/greluc/home-inv-egress-proxy }
    networks: [scanner, egress]
    networksByPlugin: all
    ports:
      - { container: 8118, host: null }
    tmpfs: ["/tmp", "/var/run"]
    resources: { memoryReservation: 16Mi, memoryLimit: 32Mi }
    health: { command: "/homeinv-egress-proxy --health", interval: 30s }
    profiles: [minimal, standard, ha]
    allowlist:
      fromGrantedManifests: true
      deployment:
        - id: clamav-signature-mirror
          caller: clamav
          hosts: [database.clamav.net]
          reason: >
            ClamAV is in-deployment infrastructure with no manifest, no capability
            grant and no per-tenant consent, so it cannot use source 1. The mirror
            sits behind a CDN with rotating addresses, which is precisely why
            ADR-0027 chose hostname allowlisting over CIDR.
    files:
      - target: /etc/homeinv/egress-allowlist.conf
        generatedFrom: allowlist
        deliveredBy:
          podman: "secret type=mount"
          docker: "secret"
          kubernetes: "ConfigMap"
    notes: >
      The single route out of the deployment (ADR-0027). Plugin containers get no
      gateway of their own and reach it via HTTPS_PROXY; clamav reaches it via
      freshclam's own proxy setting. Its allowlist has the two sources above. It
      speaks HTTP and CONNECT only, and never terminates TLS — it sees host and
      port, never content, so a compromise here does not yield any plugin's
      credentials. It refuses private, link-local and cloud-metadata ranges
      outright and resolves names itself rather than trusting the caller. A
      redirect to an undeclared host fails because it needs a new CONNECT the
      allowlist rejects — NOT because the proxy inspects the redirect, which under
      CONNECT it cannot see. Every attempt is logged with caller, target and
      outcome; that log is the source for the per-resolver disclosure REQ-ENR-009
      requires.
      The caller is identified by the SEGMENT INTERFACE the connection arrived on,
      one per plugin (ADR-0037). It used to be identified by source address on a
      shared segment, where plugin A could also use plugin B's forwarding port.
      It has two modes: HTTP/CONNECT for the usual targets, and plain TCP
      forwarding to an exact host:port for non-HTTP ones — plugin-smtp being the
      case that forced it (ADR-0027 §3). TCP mode forwards bytes only, so STARTTLS
      and implicit TLS both pass through untouched, each per-plugin listener binds
      to that plugin's interface alone, and both modes write the same access log.

  opensearch:
    image: { name: docker.io/opensearchproject/opensearch, tag: "3", digest: "sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509" }
    user: "1000:1000"
    networks: [internal]
    volumes: [{ name: osdata, path: /usr/share/opensearch/data }]
    tmpfs: ["/tmp", "/usr/share/opensearch/logs", "/usr/share/opensearch/config"]
    secrets: [opensearch-admin-password, search-password, mtls-search]
    env:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${SECRET_FILE:opensearch-admin-password}"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
    files:
      - target: /usr/share/opensearch/config/opensearch-security/internal_users.yml
        generatedFrom: secrets
        notes: >
          Two users: `admin` from opensearch-admin-password, and `homeinv` from
          search-password with read and write on the tenant indices only. api and
          worker authenticate as `homeinv` — they had no credential at all before
          ADR-0044, on a service whose port was open to every member of `internal`.
      - target: /usr/share/opensearch/config/certificates
        generatedFrom: secrets
        source: mtls-search
        notes: >
          Transport and HTTP certificates. The health check calls https://localhost:9200,
          which was true of the command and false of the configuration.
    hostPrerequisites:
      - key: vm.max_map_count
        value: 262144
        notes: >
          A HOST sysctl. It cannot be set from inside a rootless container, and the
          service user has no sudo — so it is a one-time root action at install time
          (a drop-in under /etc/sysctl.d), not something the stack can arrange for
          itself. The setup script checks it and aborts with a clear message; see
          06 §6.3. This is the one place where "rootless all the way down" needs a
          root action once, and saying so is better than letting the operator find
          out from an OpenSearch stack trace.
    resources: { memoryReservation: 1536Mi, memoryLimit: 2Gi }
    health: { command: "curl -fsS -k https://localhost:9200/_cluster/health", interval: 20s, startPeriod: 120s }
    profiles: [standard, ha]
    notes: "Not backed up — rebuildable from PostgreSQL (ADR-0008)."

  rabbitmq:
    image: { name: docker.io/library/rabbitmq, tag: "4-management-alpine", digest: "sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1" }
    user: "999:999"
    networks: [internal]
    volumes: [{ name: mqdata, path: /var/lib/rabbitmq }]
    tmpfs: ["/tmp", "/var/log/rabbitmq"]
    secrets: [mq-password]
    files:
      - target: /etc/rabbitmq/rabbitmq.conf
        generatedFrom: secrets
        deliveredBy:
          podman: "secret type=mount"
          docker: "secret"
          kubernetes: "Secret"
        notes: >
          It carries the password, so it is rendered into deploy/secrets/ and
          delivered as a secret rather than as a ConfigMap — exactly like
          valkey-users.acl.
    resources: { memoryReservation: 256Mi, memoryLimit: 512Mi }
    health: { command: "rabbitmq-diagnostics -q ping", interval: 20s, startPeriod: 60s }
    profiles: [minimal, standard, ha]
    notes: >
      This service had no credential until ADR-0044, and the omission was not merely a
      weakness: the built-in `guest` account is restricted to loopback, so api and worker
      could not have connected at all. The generated stack did not start.

  plugin-webhook:
    role: plugin
    image: { name: ghcr.io/greluc/home-inv-plugin-webhook }
    plugin:
      id: de.greluc.homeinv.plugin.webhook
      manifest: plugins/webhook/manifest.yaml
      hosts: ["hooks.example.org"]
      fingerprintFrom: mtls-plugin-webhook
      publicKeyFrom: cosign-plugin-webhook
    segment:
      subnet: 10.89.31.0/24
    networks: [plugin-webhook]
    ports:
      - { container: 8200, host: null }
    env:
      HOMEINV_PLUGIN_PORT: "8200"
      HOMEINV_MTLS_PLUGIN_FILE: "/run/secrets/mtls-plugin-webhook"
      HOMEINV_EGRESS_PROXY: "egress-proxy:8118"
      HOMEINV_WEBHOOK_TIMEOUT_SECONDS: "10"
    secrets: [mtls-plugin-webhook]
    resources: { memoryReservation: 32Mi, memoryLimit: 128Mi }
    profiles: [standard, ha]
    notes: >
      The first first-party plugin (ADR-0072). `minimal` runs no plugin at all,
      which is a complete deployment rather than a degraded one: without one,
      nothing leaves the deployment and the core says so plainly rather than
      failing silently (REQ-PLG-013, ADR-0028).

  plugin-smtp:
    role: plugin
    image: { name: ghcr.io/greluc/home-inv-plugin-smtp }
    plugin:
      id: de.greluc.homeinv.plugin.smtp
      manifest: plugins/smtp/manifest.yaml
      tcp: ["mail.example.org:587"]
      fingerprintFrom: mtls-plugin-smtp
      publicKeyFrom: cosign-plugin-smtp
    segment:
      subnet: 10.89.32.0/24
    networks: [plugin-smtp]
    ports:
      - { container: 8201, host: null }
    env:
      HOMEINV_PLUGIN_PORT: "8201"
      HOMEINV_MTLS_PLUGIN_FILE: "/run/secrets/mtls-plugin-smtp"
      HOMEINV_EGRESS_PROXY: "egress-proxy:8118"
      HOMEINV_SMTP_HOST: "${HOMEINV_SMTP_HOST:-mail.example.org}"
      HOMEINV_SMTP_PORT: "${HOMEINV_SMTP_PORT:-587}"
      HOMEINV_SMTP_SECURITY: "${HOMEINV_SMTP_SECURITY:-starttls}"
      HOMEINV_SMTP_USER: "${HOMEINV_SMTP_USER:-}"
      HOMEINV_SMTP_SENDER: "${HOMEINV_SMTP_SENDER:-}"
      HOMEINV_SMTP_TIMEOUT_SECONDS: "30"
    secrets:
      - mtls-plugin-smtp
      - plugin-smtp-password
    resources: { memoryReservation: 32Mi, memoryLimit: 128Mi }
    profiles: [standard, ha]
    notes: >
      The plugin a deployment misses first: an invitation, a password reset and
      every security notification of REQ-NOTI-004 are mail or they are nothing.
      The mail server this deployment may reach is the `tcp:` target above and
      the `HOMEINV_SMTP_HOST` beside it, and the two have to name the same
      server — one is what the proxy allows and the other is where the plugin
      goes.

  plugin-blobstore-s3:
    role: plugin
    image: { name: ghcr.io/greluc/home-inv-plugin-blobstore-s3 }
    plugin:
      id: de.greluc.homeinv.plugin.blobstore.s3
      manifest: plugins/blobstore-s3/manifest.yaml
      tcp: ["objects.example.org:443"]
      fingerprintFrom: mtls-plugin-blobstore-s3
      publicKeyFrom: cosign-plugin-blobstore-s3
    segment:
      subnet: 10.89.33.0/24
    networks: [plugin-blobstore-s3]
    ports:
      - { container: 8202, host: null }
    env:
      HOMEINV_PLUGIN_PORT: "8202"
      HOMEINV_MTLS_PLUGIN_FILE: "/run/secrets/mtls-plugin-blobstore-s3"
      HOMEINV_EGRESS_PROXY: "egress-proxy:8118"
      HOMEINV_S3_ENDPOINT: "${HOMEINV_S3_ENDPOINT:-}"
      HOMEINV_S3_BUCKET: "${HOMEINV_S3_BUCKET:-}"
      HOMEINV_S3_REGION: "${HOMEINV_S3_REGION:-us-east-1}"
      HOMEINV_S3_PREFIX: "${HOMEINV_S3_PREFIX:-}"
      HOMEINV_S3_ADDRESSING: "${HOMEINV_S3_ADDRESSING:-path}"
      HOMEINV_S3_ACCESS_KEY_ID: "${HOMEINV_S3_ACCESS_KEY_ID:-}"
      HOMEINV_S3_TIMEOUT_SECONDS: "60"
    secrets:
      - mtls-plugin-blobstore-s3
      - plugin-blobstore-s3-secret-key
    resources: { memoryReservation: 64Mi, memoryLimit: 256Mi }
    profiles: [standard, ha]
    notes: >
      A tenant's media in S3-compatible storage. Granting it routes the tenant's
      NEXT bytes here and moves none of the old ones (ADR-0074): what was stored
      before stays in the deployment's own blobstore and is still served from
      there. Two multipart parts of 8 MiB are what the memory reservation is for --
      an upload larger than one part is streamed part by part rather than held, so
      this does not grow with the size of the object. It is REQ-NFR-009's
      per-plugin adder exactly: 64 MB reserved, 256 MB limit.

  plugin-blobstore-nextcloud:
    role: plugin
    image: { name: ghcr.io/greluc/home-inv-plugin-blobstore-nextcloud }
    plugin:
      id: de.greluc.homeinv.plugin.blobstore.nextcloud
      manifest: plugins/blobstore-nextcloud/manifest.yaml
      tcp: ["cloud.example.org:443"]
      fingerprintFrom: mtls-plugin-blobstore-nextcloud
      publicKeyFrom: cosign-plugin-blobstore-nextcloud
    segment:
      subnet: 10.89.34.0/24
    networks: [plugin-blobstore-nextcloud]
    ports:
      - { container: 8203, host: null }
    env:
      HOMEINV_PLUGIN_PORT: "8203"
      HOMEINV_MTLS_PLUGIN_FILE: "/run/secrets/mtls-plugin-blobstore-nextcloud"
      HOMEINV_EGRESS_PROXY: "egress-proxy:8118"
      HOMEINV_NEXTCLOUD_URL: "${HOMEINV_NEXTCLOUD_URL:-}"
      HOMEINV_NEXTCLOUD_USER: "${HOMEINV_NEXTCLOUD_USER:-}"
      HOMEINV_NEXTCLOUD_FOLDER: "${HOMEINV_NEXTCLOUD_FOLDER:-}"
      HOMEINV_NEXTCLOUD_TIMEOUT_SECONDS: "60"
    secrets:
      - mtls-plugin-blobstore-nextcloud
      - plugin-blobstore-nextcloud-password
    resources: { memoryReservation: 64Mi, memoryLimit: 256Mi }
    profiles: [standard, ha]
    notes: >
      A tenant's media in its own Nextcloud, which is the path ADR-0007 named
      first: the photographs land in a store that is already backed up and
      synchronised, and the person who owns them can open the folder. Granting
      it routes the tenant's NEXT bytes here and moves none of the old ones
      (ADR-0074). Below 8 MiB one PUT; above it a chunked upload assembled by a
      MOVE, because WebDAV needs a Content-Length the core cannot give in
      advance. It is REQ-NFR-009's per-plugin adder exactly: 64 MB reserved,
      256 MB limit.

  plugin-oidc:
    role: plugin
    image: { name: ghcr.io/greluc/home-inv-plugin-oidc }
    plugin:
      id: de.greluc.homeinv.plugin.oidc
      manifest: plugins/oidc/manifest.yaml
      hosts: ["provider.example"]
      fingerprintFrom: mtls-plugin-oidc
      publicKeyFrom: cosign-plugin-oidc
    segment:
      subnet: 10.89.35.0/24
    networks: [plugin-oidc]
    ports:
      - { container: 8204, host: null }
    env:
      HOMEINV_PLUGIN_PORT: "8204"
      HOMEINV_MTLS_PLUGIN_FILE: "/run/secrets/mtls-plugin-oidc"
      HOMEINV_EGRESS_PROXY: "egress-proxy:8118"
      HOMEINV_OIDC_ISSUER: "${HOMEINV_OIDC_ISSUER:-}"
      HOMEINV_OIDC_CLIENT_ID: "${HOMEINV_OIDC_CLIENT_ID:-}"
      HOMEINV_OIDC_PROVIDER_KEY: "${HOMEINV_OIDC_PROVIDER_KEY:-oidc}"
      HOMEINV_OIDC_DISPLAY_NAME: "${HOMEINV_OIDC_DISPLAY_NAME:-Single sign-on}"
      HOMEINV_OIDC_SCOPES: "${HOMEINV_OIDC_SCOPES:-openid email profile}"
      HOMEINV_OIDC_TIMEOUT_SECONDS: "20"
    secrets:
      - mtls-plugin-oidc
      - plugin-oidc-client-secret
    resources: { memoryReservation: 192Mi, memoryLimit: 512Mi }
    profiles: [standard, ha]
    notes: >
      Federated sign-in (REQ-AUTH-005). The ONE plugin with a JVM in it, because
      ID-token validation is where an audited library outweighs an image size
      (ADR-0072) -- and the reason REQ-NFR-009 carries two per-plugin adders
      since ADR-0075: 64 MB for a Rust plugin, 192 MB for this one, amended
      before it was written rather than after. It is configured ONCE, by the
      operator: a sign-in happens before any tenant is known, so there is no
      tenant whose settings could be read, and the core resolves it through the
      instance operator's grant (ADR-0066).

secrets:
  postgres-superuser-password:
    required: true
    kind: random
    services: [postgres]
    notes: >
      The cluster superuser, used by initdb and by nothing afterwards. Separate from
      db-password on purpose: homeinv_app is NOBYPASSRLS and owns nothing, and sharing
      a string between it and the one role that can do anything would make the whole
      privilege separation a matter of nobody trying.
  db-password:               { required: true, kind: random }
  db-migration-password:
    required: true
    kind: random
    services: [migrate, postgres]
    notes: >
      Two mounts, and the difference between them is the point (ADR-0041,
      REQ-SEC-101). `migrate` USES it: it connects as homeinv_migrator and runs
      Flyway, then exits. `postgres` only CREATES the role with it, once, in its
      first-initialisation script — the image itself knows only
      POSTGRES_PASSWORD_FILE for the superuser. No long-running APPLICATION
      service holds it: not api, not worker. That is what the CI check asserts,
      and it is the property that keeps a compromise of the internet-facing
      process away from the one role that can rewrite an RLS policy.
  data-encryption-master-key:                  { required: true, kind: random, notes: "Envelope encryption master key (ADR-0019). Backed up separately from the data." }
  jwt-signing-key:                   { required: true, kind: ed25519, notes: "Ed25519 pair; two active versions during rotation." }
  bootstrap-password:
    required: true
    kind: random
    notes: >
      The first owner's password, read once by the `bootstrap` one-shot. It is a
      password a person types, so an operator who wants to choose it writes the file
      before the first run; setup.sh generates one only when the file is absent and
      never overwrites it (REQ-NFR-046 — there is no generated default that keeps a
      deployment running, and this is not one: without it the one-shot fails and api
      does not start).

  credential-key:
    required: true
    kind: random
    services: [api, worker]
    notes: >
      Seals the TOTP secrets of REQ-AUTH-002 at rest. A password is hashed and never
      recovered; a shared secret cannot be, because verifying a code means generating
      one — so a database dump without this file is not a set of working second factors,
      which is the whole point of having a second one. Separate from
      data-encryption-master-key, which wraps the per-tenant data keys of ADR-0019: a
      credential belongs to a person rather than to a tenant. `worker` holds it because
      it runs the same image and the same beans; it verifies no code, and a profile
      conditional instead would break the first background job that needs one.
  url-signing-key:
    required: true
    kind: random
    services: [api, worker]
    notes: >
      Signs the short-lived media URLs of REQ-MED-010 and the opaque pagination cursors
      of 08 §8.2. Both were specified as signed from stage 0 and neither named a key,
      so there was nothing for an implementer to sign with. Separate from jwt-signing-key on
      purpose: that one is an identity key with its own rotation, and a URL signature
      should not be forgeable by anything that can mint a token.
  valkey-password:
    required: true
    kind: random
    services: [valkey, api, worker]
    notes: "ACL password for the single `homeinv` user; `default` is disabled (ADR-0044)."
  mq-password:
    required: true
    kind: random
    profiles: [minimal, standard, ha]
    services: [rabbitmq, api, worker]
    notes: >
      RabbitMQ had no credential at all, and `guest` is loopback-only — the generated
      stack could not connect (ADR-0044).
  search-password:
    required: true
    kind: random
    profiles: [standard, ha]
    services: [opensearch, api, worker]
    notes: "The core's OpenSearch client user, distinct from the admin account (ADR-0044)."
  mtls-core:
    required: true
    kind: mtls-client
    services: [api, worker]
    notes: >
      Client identity for gRPC over mTLS towards `blobstore` and towards every plugin
      (REQ-SEC-056). One identity for both, because both are the same transport and the
      same contract.
  mtls-blobstore:
    required: true
    kind: mtls-server
    services: [blobstore]
    notes: >
      Server identity for the in-deployment BlobStore, pinned by fingerprint in
      HOMEINV_BLOBSTORE_FINGERPRINT. ADR-0043 gave this service every tenant's media and
      no authentication; ADR-0044 gives it the one the plugin adapters already had.
  mtls-plugin-webhook:
    required: false
    kind: mtls-server
    services: [plugin-webhook]
    notes: >
      Server identity for `plugin-webhook`. The core pins its fingerprint, which
      `setup.sh` computes when it creates this certificate and substitutes into
      the generated plugin list — exactly the mechanism a third party's plugin
      uses, because a first-party one gets no privileged path (ADR-0072).
  mtls-plugin-oidc:
    required: false
    kind: mtls-server
    services: [plugin-oidc]
    notes: >
      Server identity for `plugin-oidc`, pinned by the core exactly as every other
      in-deployment peer is (REQ-SEC-056).
  plugin-oidc-client-secret:
    required: false
    kind: external
    services: [plugin-oidc]
    notes: >
      THE CLIENT SECRET THE PROVIDER ISSUED, and the fourth secret here that
      belongs to somebody else's system. `setup.sh` creates it EMPTY and says so;
      under Podman it is also not INSTALLED until it is filled in, because a
      Podman secret cannot be empty. An empty one is a VALID configuration: a
      public client authenticates with PKCE alone, which is what binds the
      authorization code to this deployment.
  mtls-plugin-blobstore-nextcloud:
    required: false
    kind: mtls-server
    services: [plugin-blobstore-nextcloud]
    notes: >
      Server identity for `plugin-blobstore-nextcloud`, pinned by the core exactly
      as every other in-deployment peer is (REQ-SEC-056).
  plugin-blobstore-nextcloud-password:
    required: false
    kind: external
    services: [plugin-blobstore-nextcloud]
    notes: >
      THE DEPLOYMENT'S NEXTCLOUD APP PASSWORD, and the third secret here that
      belongs to somebody else's system. `setup.sh` creates it EMPTY and says so;
      under Podman it is also not INSTALLED until it is filled in, because a
      Podman secret cannot be empty. An APP password and not an account password:
      it carries no web session and revoking it revokes exactly this integration.
      A TENANT's own never appears here at all — it is sealed in the core and
      travels in the call envelope (ADR-0073, ADR-0019).
  mtls-plugin-blobstore-s3:
    required: false
    kind: mtls-server
    services: [plugin-blobstore-s3]
    notes: >
      Server identity for `plugin-blobstore-s3`, pinned by the core exactly as
      every other in-deployment peer is (REQ-SEC-056).
  plugin-blobstore-s3-secret-key:
    required: false
    kind: external
    services: [plugin-blobstore-s3]
    notes: >
      THE DEPLOYMENT'S SECRET ACCESS KEY, and the second secret here that belongs
      to somebody else's system. `setup.sh` creates it EMPTY and says so:
      generating one would produce a key the object store has never heard of, and
      the failure would look like a broken plugin rather than a key nobody set.
      Under Podman it is also not INSTALLED until then, because a Podman secret
      cannot be empty. A TENANT's own key never appears here at all — it is sealed
      in the core and travels in the call envelope (ADR-0073, ADR-0019).
  mtls-plugin-smtp:
    required: false
    kind: mtls-server
    services: [plugin-smtp]
    notes: >
      Server identity for `plugin-smtp`, pinned by the core exactly as every
      other in-deployment peer is (REQ-SEC-056).
  cosign-plugin-webhook:
    required: false
    kind: cosign-public
    seedFrom: keys/home-inv-plugins.pub.pem
  cosign-plugin-smtp:
    required: false
    kind: cosign-public
    seedFrom: keys/home-inv-plugins.pub.pem
  cosign-plugin-blobstore-s3:
    required: false
    kind: cosign-public
    seedFrom: keys/home-inv-plugins.pub.pem
  cosign-plugin-blobstore-nextcloud:
    required: false
    kind: cosign-public
    seedFrom: keys/home-inv-plugins.pub.pem
  cosign-plugin-oidc:
    required: false
    kind: cosign-public
    seedFrom: keys/home-inv-plugins.pub.pem

  plugin-smtp-password:
    required: false
    kind: external
    services: [plugin-smtp]
    notes: >
      THE MAIL ACCOUNT'S PASSWORD, and the first secret here that belongs to
      somebody else's system. `setup.sh` creates it EMPTY and says so: generating
      one would produce a value the mail server has never heard of, and the
      failure would look like a broken plugin rather than a password nobody set.
      Until it is filled in, the plugin reports NOT_CONFIGURED and sends nothing
      (REQ-PLG-015). It never passes through the core (ADR-0073). Under Podman it
      is also not INSTALLED until then: a Podman secret cannot be empty, so
      `setup.sh` names the file and moves on, and the unit that mounts it stays
      down until the credential is there.
  mtls-search:
    required: true
    kind: mtls-server
    profiles: [standard, ha]
    services: [opensearch]
    notes: >
      Transport and HTTP certificates for OpenSearch. DISABLE_INSTALL_DEMO_CONFIG removes
      the demo certificates as well as the demo users, and nothing replaced them, while
      the health check called https://.
  opensearch-admin-password:
    required: true
    kind: random
    profiles: [standard, ha]
    notes: >
      Required by OpenSearch since 2.12; no default exists. **The one documented exception
      to the *_FILE rule** (REQ-NFR-054): the image reads
      OPENSEARCH_INITIAL_ADMIN_PASSWORD and knows no _FILE variant, so the generator
      injects the file's contents into that variable. Stated here rather than left as a
      variable the image silently ignores.

forbidden:
  - privileged
  - cap_add
  - "pid: host"
  - "network_mode: host"
  - "user: root"
  - "SecurityLabelDisable=true"
  - container socket mounts
  - host ports below 1024
  - bind mounts into host directories

required:
  - every service runs as a non-root user (uid != 0)
  - every service sets readOnlyRootFilesystem, and declares the paths it needs writable
  - every service drops all capabilities and sets no-new-privileges
  - every service declares a memory limit, and a health check unless lifecycle is oneShot
  - every image is referenced by digest
  - db-migration-password is mounted only into `migrate` (which uses it) and
    `postgres` (which creates the role with it at first init) — into no
    long-running application service
  - every service that persists state declares a volume for it, and every such
    volume has a row in the backup table of 06 §6.13. `blobdata` had neither
    until 2026-09-11 (ADR-0043), which left the default media store with no
    place to write and nothing to restore from
  - every datastore authenticates its callers — postgres, valkey, rabbitmq, opensearch
    and blobstore each hold a credential or an mTLS identity, and none of them treats
    "reachable from `internal`" as authorisation (ADR-0044)
  - postgres declares an archive_command and a volume for it; a deployment that promises
    RPO <= 15 min and archives nowhere fails the check (ADR-0045, REQ-NFR-014)
  - every plugin sits on its own segment, alone among plugins
  - no plugin segment contains clamav
  - no management listener is reachable from a plugin segment
  - every outbound connection, from a plugin or from clamav, passes egress-proxy
  - "`web` reaches `api` and nothing else: postgres, valkey, rabbitmq, opensearch,
    blobstore and :8090 on both core roles all refuse from the `frontend` segment.
    The ingress is the container an attacker meets first, and it used to sit on
    `internal` with all of them"
  - exactly two containers sit on a non-internal segment — `web` and
    `egress-proxy` — and neither holds data, a credential or domain logic
  - api and worker sit on no non-internal segment and reach no external host
  - exactly one host port is published in the whole deployment

budget:
  minimal:  { reservations: ~3.5Gi, limits: ~7.2Gi }
  standard: { reservations: ~5.2Gi, limits: ~9.7Gi,
              plusPerPlugin: { reservation: 64Mi, limit: 256Mi } }
  vm:       ">= 8Gi"
  note: >
    The reservations are the budget; the limits over-commit on purpose. Each limit
    is sized for that service's own worst case — a 500-code label sheet, an
    OpenSearch reindex, a large re-encode — and those do not coincide. Sizing every
    limit so the sum fits 8 GB would throttle each service to half of what it needs
    when it is the one working. Each container stays bounded, so a runaway service
    cannot take the host; that is what the limits are for. `ha` does not
    over-commit, because it runs on >= 16 GB across several nodes.
