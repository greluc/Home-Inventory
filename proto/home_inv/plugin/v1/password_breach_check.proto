//
// ASKING WHETHER A PASSWORD IS ALREADY KNOWN TO ATTACKERS (ADR-0067).
//
// AN ADDITION, NEVER A REPLACEMENT. The core ships a list of breached passwords
// and checks it always, in every profile, because it has no outbound route and
// may not call anybody for this (ADR-0026). A plugin here is consulted AFTER
// that list and can only refuse more: a plugin saying a password is fine does
// not make it fine, and an unreachable plugin weakens nothing.
//
// THE PASSWORD NEVER LEAVES AS A PASSWORD. What crosses is the first five
// hexadecimal characters of its SHA-1; what comes back is the suffixes the
// service knows for that prefix, and the core compares them itself. That is the
// k-anonymity range query HIBP and compatible services answer.
//
// The shape is the point. A port that took the password would hand every new
// password of every account to third-party code, and no capability grant could
// make that reasonable. This one lets a plugin be wrong, slow or hostile
// without learning a single password.
//
// THE CALL CARRIES NO TENANT. A password is chosen where there often is none —
// at registration, and at a reset asked for from the login page — so this is an
// instance call under an instance-level grant: `scope` is CALL_SCOPE_INSTANCE
// and `tenant_id` is empty (ADR-0066).

syntax = "proto3";

package home_inv.plugin.v1;

import "home_inv/plugin/v1/common.proto";

option java_multiple_files = true;
option java_package = "de.greluc.homeinv.plugin.v1";
option java_outer_classname = "PasswordBreachCheckProto";

// Answers which known-breached hashes share a prefix.
service PasswordBreachCheck {
  // Asks for one prefix's suffixes.
  rpc SuffixesFor(PasswordBreachPrefixRequest) returns (PasswordBreachRange);
}

// One prefix query.
message PasswordBreachPrefixRequest {
  // An INSTANCE call: `tenant_id` is empty and `scope` says why.
  CallContext context = 1;

  // The first FIVE hexadecimal characters of the password's SHA-1, upper case.
  //
  // Never the password, and never a full hash. A server that receives anything
  // longer than five characters should refuse the call rather than answer it:
  // a longer prefix narrows the anonymity set, and at forty characters there is
  // none left.
  string sha1_prefix = 2;
}

// What a service knows for one prefix.
message PasswordBreachRange {
  // The remaining THIRTY-FIVE hexadecimal characters of each known hash with
  // this prefix, upper case.
  //
  // Empty when the service knows none — an answer, not a failure.
  repeated string suffixes = 1;
}
