//
// THE BLOB STORE CONTRACT.
//
// Four implementations speak it (ADR-0007, ADR-0043):
//
//   * `blobstore`, the in-deployment service that holds the `blobdata` volume —
//     the reference implementation, and the one the others are compared to;
//   * `plugin-blobstore-s3` and `plugin-blobstore-nextcloud`, stage 1, which are
//     plugins precisely because they open a connection OUTSIDE the deployment
//     (ADR-0026);
//   * and whatever a third party writes against the published SDK in stage 3.
//
// Apache-2.0 like everything in `proto/`: a plugin author compiles against this
// and must stay free to license their own work as they wish (ADR-0018).

syntax = "proto3";

package home_inv.plugin.v1;

import "home_inv/plugin/v1/common.proto";

option java_multiple_files = true;
option java_package = "de.greluc.homeinv.plugin.v1";
option java_outer_classname = "BlobStoreProto";

// Stores and returns opaque byte sequences, addressed by content.
//
// WHAT THIS SERVICE DELIBERATELY DOES NOT DO
//
// It does not authorise. The tenant is a path segment the caller supplies, and
// the caller is authenticated by its client certificate and by nothing else
// (ADR-0044: `internal` is not a trust boundary, so reachability is not
// authorisation). Deciding whether a person may read a blob happens in the
// application layer, where ADR-0010 puts every such decision — a store that
// decided too would be a second set of rules to keep right, and the second one
// is always the one that is wrong.
//
// It does not know what a blob IS. No media type, no dimensions, no scan
// verdict: those belong to `media_object` in PostgreSQL, and a store that held
// them would be a second source for facts a transaction already protects.
service BlobStore {
  // Writes a blob, or confirms that the identical blob is already there.
  //
  // Streamed, because a 25 MB upload in one message would mean both sides
  // holding it entirely in memory, and gRPC's default message limit is 4 MB.
  rpc Put(stream PutRequest) returns (PutResponse);

  // Reads a blob.
  rpc Get(GetRequest) returns (stream GetResponse);

  // Whether a blob is present, and how large it is, without transferring it.
  rpc Head(HeadRequest) returns (HeadResponse);

  // Removes a blob.
  //
  // Reference counting is the CALLER's: `media_object.ref_count` decides when
  // nothing points at a blob any more, and only then is this called. A store
  // that counted references would need to know what a reference is.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // ---------------------------------------------------------------------
  // STAGING, for an upload that arrives in pieces (REQ-MED-008, ADR-0084).
  // ---------------------------------------------------------------------
  //
  // OPTIONAL, and a plugin may answer all four with UNIMPLEMENTED. The core
  // calls them on the IN-DEPLOYMENT store and on nothing else: a half-uploaded
  // file has no content address yet, so it cannot be addressed the way the four
  // methods above address a blob, and pushing an unfinished object into a
  // tenant's own bucket would leave litter in somebody else's storage that only
  // this deployment knows how to clean up. What a tenant's store receives is the
  // finished blob, through `Put`, exactly as before (ADR-0074).
  //
  // A staged object is addressed by an UPLOAD ID rather than by content,
  // because the content is not yet known -- that is the whole difference
  // between this and `Put`.

  // Appends bytes to a staged upload, creating it on the first call.
  //
  // The offset on the first frame must equal what is already staged, and the
  // server refuses anything else with FAILED_PRECONDITION. That is what makes a
  // retry after a broken connection safe: the client asks `HeadStaged` what
  // arrived, and continues from there. A client that guesses wrong writes
  // nothing rather than writing at the wrong place.
  rpc AppendStaged(stream AppendStagedRequest) returns (StagedResponse);

  // How much of a staged upload has arrived.
  //
  // This is the authoritative offset. The caller keeps the upload's metadata --
  // who it is for, what it will be attached to, when it expires -- and keeps no
  // second copy of the length, because two records of the same number disagree
  // after a crash and the one on disk is the one that is true.
  rpc HeadStaged(StagedRequest) returns (StagedResponse);

  // Reads a staged upload back, so the caller can hash it, check its magic
  // bytes and transcode it before storing it for real.
  rpc GetStaged(StagedRequest) returns (stream GetResponse);

  // Discards a staged upload: completed, abandoned or expired.
  rpc DeleteStaged(StagedRequest) returns (DeleteResponse);
}

// Where a blob lives.
//
// Content-addressed WITHIN a tenant and never across (ADR-0032). Two tenants
// holding the same bytes hold two objects: a global namespace would have been an
// existence oracle across the tenant boundary, and would have let the second
// tenant inherit the first one's malware verdict.
message BlobRef {
  // The owning tenant, as a UUID in its canonical hyphenated text form.
  string tenant_id = 1;

  // The SHA-256 of the content, lowercase hex, exactly 64 characters.
  //
  // The server verifies it on write and refuses a mismatch. A store that
  // believed the caller's hash would be content-addressed in name only, and the
  // first corrupted transfer would be indistinguishable from a different file.
  string sha256 = 2;
}

// One frame of a write.
//
// The first message on the stream carries `ref` and no `chunk`; every later one
// carries `chunk` and no `ref`. Splitting them into two fields of one message
// rather than using a `oneof` keeps the wire format obvious at the cost of a
// rule the server enforces.
message PutRequest {
  // Present on the first message only.
  //
  // Named `blob` and not `ref`, which would be the obvious word: `ref` is a
  // keyword in Rust and a reserved word in several other targets, and a field
  // name that forces every generated client to escape it is a field name that
  // will be escaped inconsistently.
  BlobRef blob = 1;

  // Present on every message after the first.
  bytes chunk = 2;

  // WHO THE CALL IS FOR, and what that tenant configured for this plugin.
  //
  // Added 2026-09-21. It was absent while the only implementation was the
  // in-deployment service, which needs nothing beyond the address -- and then
  // `plugin-blobstore-s3` arrived, whose bucket, endpoint and keys a TENANT may
  // choose (ADR-0073, ADR-0074), and a store that could not be told which tenant
  // it was acting for could not read them.
  //
  // `blob.tenant_id` stays where it is and keeps its meaning: it is part of the
  // ADDRESS (ADR-0032), which a store needs even when it is configured once for
  // the whole deployment. This field is the ENVELOPE. They always name the same
  // tenant; a store that finds them disagreeing should refuse the call.
  //
  // On the first message only, with `blob`. A sender that repeated it on every
  // chunk would be sending the tenant's settings once per 256 KiB.
  CallContext context = 3;
}

// The result of a write.
message PutResponse {
  // False when the blob was already present with identical content, which is the
  // common case: the same photograph uploaded twice by one tenant costs no
  // second copy.
  bool created = 1;

  // The number of bytes the blob occupies.
  uint64 byte_size = 2;
}

// Which blob to read.
message GetRequest {
  BlobRef blob = 1;

  // WHO THE CALL IS FOR, and what that tenant configured for this plugin.
  //
  // Added 2026-09-21. It was absent while the only implementation was the
  // in-deployment service, which needs nothing beyond the address -- and then
  // `plugin-blobstore-s3` arrived, whose bucket, endpoint and keys a TENANT may
  // choose (ADR-0073, ADR-0074), and a store that could not be told which tenant
  // it was acting for could not read them.
  //
  // `blob.tenant_id` stays where it is and keeps its meaning: it is part of the
  // ADDRESS (ADR-0032), which a store needs even when it is configured once for
  // the whole deployment. This field is the ENVELOPE. They always name the same
  // tenant; a store that finds them disagreeing should refuse the call.
  CallContext context = 2;
}

// One frame of a read.
message GetResponse {
  bytes chunk = 1;
}

// Which blob to ask about.
message HeadRequest {
  BlobRef blob = 1;

  // WHO THE CALL IS FOR, and what that tenant configured for this plugin.
  //
  // Added 2026-09-21. It was absent while the only implementation was the
  // in-deployment service, which needs nothing beyond the address -- and then
  // `plugin-blobstore-s3` arrived, whose bucket, endpoint and keys a TENANT may
  // choose (ADR-0073, ADR-0074), and a store that could not be told which tenant
  // it was acting for could not read them.
  //
  // `blob.tenant_id` stays where it is and keeps its meaning: it is part of the
  // ADDRESS (ADR-0032), which a store needs even when it is configured once for
  // the whole deployment. This field is the ENVELOPE. They always name the same
  // tenant; a store that finds them disagreeing should refuse the call.
  CallContext context = 2;
}

// What is known about a blob without reading it.
message HeadResponse {
  bool exists = 1;
  uint64 byte_size = 2;
}

// Which blob to remove.
message DeleteRequest {
  BlobRef blob = 1;

  // WHO THE CALL IS FOR, and what that tenant configured for this plugin.
  //
  // Added 2026-09-21. It was absent while the only implementation was the
  // in-deployment service, which needs nothing beyond the address -- and then
  // `plugin-blobstore-s3` arrived, whose bucket, endpoint and keys a TENANT may
  // choose (ADR-0073, ADR-0074), and a store that could not be told which tenant
  // it was acting for could not read them.
  //
  // `blob.tenant_id` stays where it is and keeps its meaning: it is part of the
  // ADDRESS (ADR-0032), which a store needs even when it is configured once for
  // the whole deployment. This field is the ENVELOPE. They always name the same
  // tenant; a store that finds them disagreeing should refuse the call.
  CallContext context = 2;
}

// The result of a removal.
message DeleteResponse {
  // False when there was nothing to remove. Not an error: deletion is retried
  // after a partial failure, and a retry that failed because the work was
  // already done would be a retry nobody could make succeed.
  bool removed = 1;
}

// ---------------------------------------------------------------------------
// Staging
// ---------------------------------------------------------------------------

// Where a half-arrived upload lives.
//
// Not content-addressed, because there is no content address until the last
// byte has arrived. The pair is still per tenant, for the reason ADR-0032 gives
// for blobs: one tenant must not be able to ask about another's upload, and an
// id that carried no tenant would make that a matter of guessing a UUID.
message StagedRef {
  // The owning tenant, as a UUID in its canonical hyphenated text form.
  string tenant_id = 1;

  // The upload, as a UUID in its canonical hyphenated text form. The caller
  // chooses it and hands the same id to whoever is uploading.
  string upload_id = 2;
}

// Which staged upload to ask about, read or discard.
message StagedRequest {
  StagedRef staged = 1;

  // WHO THE CALL IS FOR (ADR-0073). Same meaning as on every other request
  // here, and the same rule: it names the tenant the address names.
  CallContext context = 2;
}

// One frame of an append.
//
// The first message carries `staged` and `offset` and may carry bytes; every
// later one carries `chunk` alone. The same shape `PutRequest` uses, for the
// same reason: the wire format stays obvious at the cost of a rule the server
// enforces.
message AppendStagedRequest {
  // Present on the first message only.
  StagedRef staged = 1;

  // Where these bytes go. Present on the first message only, and it must equal
  // what is already staged -- the server refuses any other value rather than
  // writing at the wrong place or silently overwriting.
  uint64 offset = 2;

  // The bytes.
  bytes chunk = 3;

  // Present on the first message only, with `staged`.
  CallContext context = 4;
}

// How much of a staged upload is on disk.
message StagedResponse {
  // False when there is no such staged upload. A caller that asked about one
  // that expired gets this rather than an error, because expiry is an ordinary
  // outcome and the caller's next move is the same either way: start again.
  bool exists = 1;

  // The number of bytes staged so far, which is where the next append goes.
  uint64 byte_size = 2;
}
