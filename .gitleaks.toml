#
# gitleaks runs in CI (.github/workflows/security.yml) and as a pre-commit hook.
# Nothing secret ever lands in this repository — it is public, and every file in
# it is world-readable from the moment it is pushed.
#
# This file adds allowlists and nothing else: every default rule stays on. Each
# entry below names a value that is not a credential and could not become one —
# a deliberately fake test password, an illustrative string in a specification, a
# broker routing key. It does NOT relax the rules anywhere a real credential
# could appear, and each entry is scoped to the paths where its value belongs, so
# the same string somewhere else is still a finding.
#
# The bar for adding one: a pattern that is WRONG for this codebase, rather than
# one that is merely inconvenient today.

[extend]
# Every default rule stays on. This file adds an allowlist; it replaces nothing.
useDefault = true

[[rules]]
# A rule of our own, so the allowlist below has something to hang on that is not
# one of the defaults. It never matches: the default `generic-api-key` rule is
# what fires on the test password, and `[[allowlists]]` below applies globally.
id = "homeinv-placeholder"
description = "Unused; present so this file is a valid rule set rather than only an allowlist."
regex = '''homeinv-this-pattern-matches-nothing-[0-9a-f]{64}'''

[[allowlists]]
description = """
The xkcd passphrase the integration tests sign in with.

It is a literal in every integration test class and it is not a credential:
`CLAUDE.md` says never use real credentials in tests or local stacks, and this is
what following that rule looks like from a scanner's side. The account it belongs
to exists for the length of one Testcontainers run, in a database that is
destroyed with it.

ONE passphrase and not one per class, which this file said was already true and
was not: fifteen classes had invented their own, and on 2026-09-15 the entropy
check finally fired on one of them. A bespoke password that happens not to trip
today is how the next false positive arrives, so they were all aligned rather
than the twenty-second one allowlisted.

Scoped to test sources on purpose. The same string in `app/src/main` would be a
finding, and should be.
"""
condition = "AND"
paths = ['''app/src/test/.*\.java$''']
regexes = ['''correct-horse-battery-staple-42''']

[[allowlists]]
description = """
The plaintext the envelope-encryption tests seal and open again.

`SensitiveFieldCryptoIT` and `SealedAttributesIT` seal a value under a field
called `licenceKey`, and the generic-api-key rule fires on the adjacency rather
than on the value — which reads, in full, "not a real licence key". It is the
plaintext side of a round trip: the test seals it, opens it, and asserts the two
match, so it cannot be replaced by something shorter without the test losing its
point.

The push scan only ever sees a diff, so this surfaced first in the scheduled run
that reads the whole history. Allowlisted rather than renamed again: the previous
literal was changed once already for this rule, and a value chosen to slip past a
regex is one the next regex catches.

Scoped to test sources on purpose. The same string in `app/src/main` would be a
finding, and should be.
"""
condition = "AND"
paths = ['''app/src/test/.*\.java$''']
regexes = ['''not a real licence key''']

[[allowlists]]
description = """
The role passwords in the test database's init script.

`app/src/test/resources/db/test-roles.sql` sets `test-app`, `test-migrator`,
`test-readonly` and `test-housekeeping` on the four roles, because production
reads them from mounted secrets and a test container has nowhere to read them
from. The file says so in its own header. They exist only inside a container
that is thrown away when the test class ends.
"""
paths = ['''app/src/test/resources/db/test-roles\.sql$''']

[[allowlists]]
description = """
Container-local passwords in the test harness and the example environment.

`AbstractIntegrationTest` gives the PostgreSQL container a superuser password so
that the isolation proof can seed rows as a superuser; `deploy/.env.example`
carries shapes and placeholders rather than values, which is what makes it
committable at all. Neither reaches a registry, a host or a log.
"""
condition = "AND"
paths = [
  '''app/src/test/java/de/greluc/homeinv/AbstractIntegrationTest\.java$''',
  '''deploy/\.env\.example$''',
]
regexes = ['''test-superuser''']

[[allowlists]]
description = """
Illustrative values in the design system's component prompts.

`SecretInput.prompt.md` shows what the `secret` field renders when revealed, and
the string in it is a made-up licence key of the shape a user would see. These
files are specifications of appearance; every value in them is chosen to look
like the thing it illustrates, which is exactly what an entropy check rewards.

CI only scans the commits a push carries, so this one did not fire on 2026-09-12
— it fires the day somebody edits the file. Better allowed with a reason now than
diagnosed under time pressure later.
"""
paths = ['''design-system/.*\.prompt\.md$''']

[[allowlists]]
description = """
The routing keys the RabbitMQ listeners bind to.

`ItemIndexListener` and `MediaDerivationListener` declare their bindings with
`key = "item-purged.v1"` and nine siblings of the same shape. The generic-api-key
rule fires on the adjacency — a field literally called `key`, assigned a quoted
string — and the string is a broker binding pattern that every consumer of this
exchange has to know. A routing key is addressed to, not authenticated with:
the broker authenticates its caller by RabbitMQ user (`12 §12.2`, ADR-0044,
REQ-SEC-104), so knowing the name of a binding buys nothing without one.

Allowlisted by SHAPE rather than by value, deliberately. Only `item-purged.v1`
tripped the entropy threshold on 2026-09-16; the other nine are the same
construct and differ from it by luck. Allowlisting the one that fired is how the
same finding returns under a different name the day an event is added — the
lesson the test passphrase above already taught this file once.

`regexTarget = "line"` because the prefix is what makes this narrow: the pattern
matches an annotation element assigned a versioned event name, not any string in
these files. A real credential in a listener would not end in `.v<digits>`, and
one that did would still be a finding anywhere outside these two paths.
"""
condition = "AND"
regexTarget = "line"
paths = [
  '''app/src/main/java/de/greluc/homeinv/search/infrastructure/ItemIndexListener\.java$''',
  '''app/src/main/java/de/greluc/homeinv/media/infrastructure/MediaDerivationListener\.java$''',
]
regexes = ['''key = "[a-z][a-z0-9-]*\.v[0-9]+"''']
